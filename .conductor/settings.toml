"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"
spotlight_testing = true

file_include_globs = """
.env*
.codegraph/codegraph.db
"""

[prompts]
create_pr = "Monitor the CI run. You should fix any jobs that fail, push and keep checking. As part of your monitoring, look for CR comments, and address them using the skill. You should not stop until all CR comments are resolved and all of CI is green. You should also resolve any conflicts with the parent branch."

[scripts]
archive = "pnpm tsx scripts/conductor-archive.ts"
run_mode = "concurrent"
setup = "command -v pnpm >/dev/null || corepack enable; pnpm install --frozen-lockfile && (test -f .codegraph/codegraph.db || codegraph init -i)"

[tasks.Run]
available_in = "local"
command = "pnpm --filter dofek-web dev --host 127.0.0.1 --port \"$CONDUCTOR_PORT\""
default = true
icon = "play"
