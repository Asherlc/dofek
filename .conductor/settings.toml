"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
archive = "pnpm tsx scripts/conductor-archive.ts"
run_mode = "concurrent"
setup = "corepack enable && pnpm install --frozen-lockfile && codegraph init -i"

[tasks.Run]
available_in = "local"
command = "pnpm --filter dofek-web dev --host 127.0.0.1 --port \"$CONDUCTOR_PORT\""
default = true
icon = "play"
