# Isolated qualification services; does not replace the existing development log.
# https://pulsar.apache.org/docs/5.0.x/deploy-docker/
services:
  metric-stream-minio:
    profiles: ["pulsar"]
    mem_limit: 384m
    ports: !reset []
    environment:
      MINIO_ROOT_USER: pulsarqualification
      MINIO_ROOT_PASSWORD: pulsarqualification
      METRIC_STREAM_R2_BUCKET: pulsar-qualification

  pulsar-oxia:
    image: oxia/oxia:0.18.0@sha256:65f9898d531c3ca48a3277247650200c8065435fd542ea9a81e51c37b90fff60
    profiles: ["pulsar"]
    mem_limit: 128m
    environment:
      GOMEMLIMIT: 96MiB
    command:
      - oxia
      - server
      - --data-dir=/data/db
      - --wal-dir=/data/wal
      - --db-cache-size-mb=32
      - --wal-sync-data=true
    volumes:
      - pulsar_oxia_data:/data

  pulsar-oxia-coordinator:
    image: oxia/oxia:0.18.0@sha256:65f9898d531c3ca48a3277247650200c8065435fd542ea9a81e51c37b90fff60
    profiles: ["pulsar"]
    mem_limit: 128m
    environment:
      GOMEMLIMIT: 96MiB
    command: ["oxia", "coordinator", "--sconfig=/etc/oxia/coordinator.yml"]
    volumes:
      - ./deploy/pulsar/oxia-coordinator.yml:/etc/oxia/coordinator.yml:ro
      - pulsar_oxia_coordinator_data:/data
    depends_on:
      pulsar-oxia:
        condition: service_started
    healthcheck:
      test: ["CMD", "oxia", "admin", "--admin-address", "localhost:6650", "--output", "json", "dataserver", "get"]
      interval: 2s
      timeout: 5s
      retries: 30

  pulsar-init:
    image: apachepulsar/pulsar:5.0.1@sha256:4507075d8c11b34629f3a0b41f48e3c659951e601538562ee0c088cd2c737ec0
    profiles: ["pulsar"]
    user: "0:0"
    mem_limit: 512m
    environment:
      PULSAR_MEM: -Xms64m -Xmx192m -XX:MaxDirectMemorySize=128m
    entrypoint: ["/bin/bash", "-euc"]
    command:
      - |
        chown 10000:0 /pulsar/data/bookkeeper
        exec bin/pulsar initialize-cluster-metadata \
          --cluster qualification \
          --metadata-store oxia://pulsar-oxia:6648/pulsar \
          --configuration-metadata-store oxia://pulsar-oxia:6648/pulsar \
          --bookkeeper-metadata-service-uri metadata-store:oxia://pulsar-oxia:6648/bookkeeper \
          --web-service-url http://pulsar-broker:8080 \
          --broker-service-url pulsar://pulsar-broker:6650
    volumes:
      - pulsar_bookie_data:/pulsar/data/bookkeeper
    depends_on:
      pulsar-oxia-coordinator:
        condition: service_healthy

  pulsar-bookie:
    image: apachepulsar/pulsar:5.0.1@sha256:4507075d8c11b34629f3a0b41f48e3c659951e601538562ee0c088cd2c737ec0
    profiles: ["pulsar"]
    mem_limit: 768m
    environment:
      BOOKIE_MEM: -Xms64m -Xmx192m -XX:MaxDirectMemorySize=128m
      advertisedAddress: pulsar-bookie
      metadataServiceUri: metadata-store:oxia://pulsar-oxia:6648/bookkeeper
      journalDirectory: /pulsar/data/bookkeeper/journal
      ledgerDirectories: /pulsar/data/bookkeeper/ledgers
      dbStorage_writeCacheMaxSizeMb: "32"
      dbStorage_readAheadCacheMaxSizeMb: "32"
      numAddWorkerThreads: "2"
      numReadWorkerThreads: "2"
      numJournalCallbackThreads: "1"
      httpServerEnabled: "true"
      httpServerPort: "8000"
    entrypoint: ["/bin/bash", "-euc"]
    command:
      - bin/apply-config-from-env.py conf/bookkeeper.conf && exec bin/pulsar bookie
    volumes:
      - pulsar_bookie_data:/pulsar/data/bookkeeper
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/api/v1/bookie/is_ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      pulsar-init:
        condition: service_completed_successfully

  pulsar-broker:
    image: dofek-pulsar-qualification:5.0.1-r2
    build:
      context: ./deploy/pulsar
    profiles: ["pulsar"]
    mem_limit: 768m
    cpus: 1
    environment:
      PULSAR_MEM: -Xms64m -Xmx256m -XX:MaxDirectMemorySize=192m
      PULSAR_GC: -XX:+UseG1GC
      clusterName: qualification
      advertisedAddress: pulsar-broker
      metadataStoreUrl: oxia://pulsar-oxia:6648/pulsar
      configurationMetadataStoreUrl: oxia://pulsar-oxia:6648/pulsar
      bookkeeperMetadataServiceUri: metadata-store:oxia://pulsar-oxia:6648/bookkeeper
      managedLedgerDefaultEnsembleSize: "1"
      managedLedgerDefaultWriteQuorum: "1"
      managedLedgerDefaultAckQuorum: "1"
      managedLedgerCacheSizeMB: "32"
      managedLedgerOffloadDriver: S3
      jclouds.s3.signer-version: "4"
      PULSAR_PREFIX_managedLedgerOffloadBucket: pulsar-qualification
      PULSAR_PREFIX_managedLedgerOffloadServiceEndpoint: http://metric-stream-minio:9000
      PULSAR_PREFIX_managedLedgerOffloadRegion: us-east-1
      PULSAR_PREFIX_managedLedgerOffloadMaxBlockSizeInBytes: "5242880"
      PULSAR_PREFIX_s3ManagedLedgerOffloadCredentialId: pulsarqualification
      PULSAR_PREFIX_s3ManagedLedgerOffloadCredentialSecret: pulsarqualification
      managedLedgerOffloadDeletionLagMs: "0"
      loadBalancerEnabled: "false"
      functionsWorkerEnabled: "false"
    entrypoint: ["/bin/bash", "-euc"]
    command:
      - bin/apply-config-from-env.py conf/broker.conf && exec bin/pulsar broker
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/admin/v2/brokers/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      pulsar-bookie:
        condition: service_healthy
      metric-stream-minio:
        condition: service_started

volumes:
  pulsar_oxia_data:
  pulsar_oxia_coordinator_data:
  pulsar_bookie_data:
