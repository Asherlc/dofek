services:
  peerdb-catalog:
    image: postgres:18-alpine
    environment:
      PGUSER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-health}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --locale=C.UTF-8
    volumes:
      - peerdb_catalog_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 60s

  peerdb-temporal:
    image: temporalio/auto-setup:1.29
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-health}
      POSTGRES_SEEDS: peerdb-catalog
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
      TEMPORAL_BROADCAST_HOST: "127.0.0.1"
    restart: unless-stopped
    depends_on:
      peerdb-catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "peerdb-temporal:7233"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  peerdb-temporal-admin-tools:
    image: temporalio/admin-tools:1.32
    environment:
      TEMPORAL_ADDRESS: peerdb-temporal:7233
      TEMPORAL_CLI_ADDRESS: peerdb-temporal:7233
      TEMPORAL_CLI_SHOW_STACKS: "1"

  # Registers the MirrorName search attribute that PeerDB workflows require.
  # Runs once after Temporal is healthy, then exits.
  peerdb-temporal-init:
    image: temporalio/admin-tools:1.32
    environment:
      TEMPORAL_ADDRESS: peerdb-temporal:7233
      TEMPORAL_CLI_ADDRESS: peerdb-temporal:7233
    depends_on:
      peerdb-temporal:
        condition: service_healthy
    restart: "no"
    entrypoint: /bin/sh
    command:
      - -euc
      - |
        temporal_address=peerdb-temporal:7233
        search_attributes="$$(temporal operator search-attribute list \
          --address "$$temporal_address" --namespace default --output json)"
        if printf '%s\n' "$$search_attributes" | \
          grep -Eq '"MirrorName"[[:space:]]*:[[:space:]]*"INDEXED_VALUE_TYPE_TEXT"'; then
          exit 0
        fi
        if printf '%s\n' "$$search_attributes" | grep -Eq '"MirrorName"[[:space:]]*:'; then
          echo "Temporal search attribute MirrorName must have type Text" >&2
          exit 1
        fi
        temporal operator search-attribute create \
          --address "$$temporal_address" --namespace default \
          --name MirrorName --type Text
        search_attributes="$$(temporal operator search-attribute list \
          --address "$$temporal_address" --namespace default --output json)"
        if ! printf '%s\n' "$$search_attributes" | \
          grep -Eq '"MirrorName"[[:space:]]*:[[:space:]]*"INDEXED_VALUE_TYPE_TEXT"'; then
          echo "Temporal search attribute MirrorName was not registered as Text" >&2
          exit 1
        fi

  peerdb-minio:
    # SeaweedFS S3 API stand-in; service hostname kept for PeerDB endpoint URLs.
    # https://github.com/seaweedfs/seaweedfs/releases/tag/4.47
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    environment:
      # Credential names retained for PeerDB client env wiring; SeaweedFS accepts
      # these as S3 access/secret keys for path-style clients.
      MINIO_ROOT_USER: peerdb
      # Do not reuse POSTGRES_PASSWORD here since the local default ("health") is
      # too short for some S3 client validators.
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-peerdblocaldev}
      PEERDB_CLICKHOUSE_AWS_S3_BUCKET_NAME: peerdbbucket
    volumes:
      - peerdb_minio_data:/data
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -euc
      - |
        printf '%s\n' "{\"identities\":[{\"name\":\"$$MINIO_ROOT_USER\",\"credentials\":[{\"accessKey\":\"$$MINIO_ROOT_USER\",\"secretKey\":\"$$MINIO_ROOT_PASSWORD\"}],\"actions\":[\"Admin\",\"Read\",\"Write\",\"List\",\"Tagging\"]}]}" > /tmp/s3.json
        weed server -ip=peerdb-minio -dir=/data -s3 -s3.port=9000 -s3.ip.bind=0.0.0.0 -s3.config=/tmp/s3.json -s3.port.iceberg=0 -s3.port.lance=0 -master.volumeSizeLimitMB=1024 -master.telemetry=false &
        weed_pid=$$!
        attempts=0
        until wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -O /dev/null http://127.0.0.1:8888/; do
          attempts=$$((attempts + 1))
          if [ $$attempts -ge 90 ]; then
            echo peerdb-minio master/filer did not become ready in time >&2
            kill $$weed_pid 2>/dev/null || true
            exit 1
          fi
          if ! kill -0 $$weed_pid 2>/dev/null; then
            echo peerdb-minio weed server exited before ready >&2
            exit 1
          fi
          sleep 1
        done
        attempts=0
        until printf 's3.bucket.create -name %s\n' "$$PEERDB_CLICKHOUSE_AWS_S3_BUCKET_NAME" | weed shell -master=localhost:9333; do
          attempts=$$((attempts + 1))
          if [ $$attempts -ge 30 ]; then
            echo peerdb-minio bucket create failed >&2
            kill $$weed_pid 2>/dev/null || true
            exit 1
          fi
          sleep 1
        done
        touch /tmp/peerdb-minio-ready
        wait
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/peerdb-minio-ready"]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 30s

  peerdb-minio-lifecycle:
    image: amazon/aws-cli:2.37.1@sha256:b0dd5a4d216a1786863541a201baa7b7b4c5032bec9c6e72c38d01cafd7e8db8
    environment:
      AWS_ACCESS_KEY_ID: peerdb
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-peerdblocaldev}
      AWS_DEFAULT_REGION: us-east-1
      # Newer aws-cli defaults to flexible checksums that some S3 clones reject.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      PEERDB_CLICKHOUSE_AWS_S3_BUCKET_NAME: peerdbbucket
    entrypoint:
      - /bin/sh
      - -euc
      - |
        cat > /tmp/peerdb-lifecycle.json <<'EOF'
        {"Rules":[{"Expiration":{"Days":1},"Filter":{"Prefix":""},"ID":"peerdb-transient-stage-retention","Status":"Enabled","AbortIncompleteMultipartUpload":{"DaysAfterInitiation":1}}]}
        EOF
        attempts=0
        until aws --endpoint-url=http://peerdb-minio:9000 s3api head-bucket --bucket "$$PEERDB_CLICKHOUSE_AWS_S3_BUCKET_NAME" >/dev/null 2>&1; do
          attempts=$$((attempts + 1))
          if [ $$attempts -ge 30 ]; then
            echo peerdb-minio bucket was not ready for lifecycle setup >&2
            exit 1
          fi
          sleep 1
        done
        aws --endpoint-url=http://peerdb-minio:9000 s3api put-bucket-lifecycle-configuration --bucket "$$PEERDB_CLICKHOUSE_AWS_S3_BUCKET_NAME" --lifecycle-configuration file:///tmp/peerdb-lifecycle.json
    depends_on:
      peerdb-minio:
        condition: service_healthy
    restart: "no"

  peerdb-flow-api:
    image: ghcr.io/peerdb-io/flow-api:stable-v0.37.7
    environment: &peerdb-flow-environment
      PEERDB_CATALOG_HOST: peerdb-catalog
      PEERDB_CATALOG_PORT: "5432"
      PEERDB_CATALOG_USER: postgres
      PEERDB_CATALOG_PASSWORD: ${POSTGRES_PASSWORD:-health}
      PEERDB_CATALOG_DATABASE: postgres
      TEMPORAL_HOST_PORT: peerdb-temporal:7233
      TEMPORAL_CLIENT_CERT: ""
      TEMPORAL_CLIENT_KEY: ""
      PEERDB_TEMPORAL_NAMESPACE: default
      PEERDB_ALLOWED_TARGETS: ""
      PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_ACCESS_KEY_ID: peerdb
      PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-peerdblocaldev}
      PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_REGION: us-east-1
      PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_ENDPOINT_URL_S3: http://peerdb-minio:9000
      PEERDB_CLICKHOUSE_AWS_S3_BUCKET_NAME: peerdbbucket
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_REGION: ""
      AWS_ENDPOINT: ""
    restart: unless-stopped
    depends_on:
      peerdb-catalog:
        condition: service_healthy
      peerdb-temporal:
        condition: service_started
      peerdb-temporal-init:
        condition: service_completed_successfully
      peerdb-minio:
        condition: service_healthy
      peerdb-minio-lifecycle:
        condition: service_completed_successfully

  peerdb-flow-snapshot-worker:
    image: ghcr.io/peerdb-io/flow-snapshot-worker:stable-v0.37.9
    environment: *peerdb-flow-environment
    restart: unless-stopped
    depends_on:
      peerdb-flow-api:
        condition: service_started

  peerdb-flow-worker:
    image: ghcr.io/peerdb-io/flow-worker:stable-v0.37.9
    environment: *peerdb-flow-environment
    restart: unless-stopped
    depends_on:
      peerdb-flow-api:
        condition: service_started

  peerdb:
    image: ghcr.io/peerdb-io/peerdb-server:stable-v0.37.9
    stop_signal: SIGINT
    environment:
      PEERDB_CATALOG_HOST: peerdb-catalog
      PEERDB_CATALOG_PORT: "5432"
      PEERDB_CATALOG_USER: postgres
      PEERDB_CATALOG_PASSWORD: ${POSTGRES_PASSWORD:-health}
      PEERDB_CATALOG_DATABASE: postgres
      PEERDB_PASSWORD: ${POSTGRES_PASSWORD:-health}
      PEERDB_FLOW_SERVER_ADDRESS: grpc://peerdb-flow-api:8112
      RUST_LOG: info
      RUST_BACKTRACE: "1"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PEERDB_CDC_PORT:-9900}:9900"
    depends_on:
      peerdb-catalog:
        condition: service_healthy
      peerdb-flow-api:
        condition: service_started

  peerdb-ui:
    image: ghcr.io/peerdb-io/peerdb-ui:stable-v0.37.9
    environment:
      PEERDB_CATALOG_HOST: peerdb-catalog
      PEERDB_CATALOG_PORT: "5432"
      PEERDB_CATALOG_USER: postgres
      PEERDB_CATALOG_PASSWORD: ${POSTGRES_PASSWORD:-health}
      PEERDB_CATALOG_DATABASE: postgres
      PEERDB_PASSWORD: ${POSTGRES_PASSWORD:-health}
      PEERDB_FLOW_SERVER_HTTP: http://peerdb-flow-api:8113
      NEXTAUTH_SECRET: ${PEERDB_UI_NEXTAUTH_SECRET:-local-dev-peerdb-ui-nextauth-secret-rotate-before-shared-use}
      NEXTAUTH_URL: ${PEERDB_UI_PUBLIC_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PEERDB_UI_PORT:-3001}:3000"
    depends_on:
      peerdb-flow-api:
        condition: service_started

volumes:
  peerdb_catalog_data:
  peerdb_minio_data:
