[features]
codex_hooks = true

[mcp_servers.chrome_devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest"]

[mcp_servers.axiom]
url = "https://mcp.axiom.co/mcp"
headers = {}

[mcp_servers.sentry]
url = "https://mcp.sentry.dev/mcp"

[mcp_servers.xcodebuildmcp]
command = "npx"
args = ["-y", "xcodebuildmcp@latest", "mcp"]
