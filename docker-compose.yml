# Dev backing services. Run the app outside Docker for fast iteration.
#
# Usage:
#   pnpm compose:up
#   pnpm dev              # sync runner
#   cd packages/web && pnpm dev   # Vite dev server
#   cd packages/server && pnpm dev # Express API server

services:
  db:
    image: timescale/timescaledb-ha:pg18.3-ts2.26.4-all
    restart: unless-stopped
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    environment:
      POSTGRES_DB: health
      POSTGRES_USER: health
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-health}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-0}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U health -d health"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.2.7-alpine
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      CLICKHOUSE_DB: fitness
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-health}
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-0}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-0}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./deploy/clickhouse/users.d/default-query-guardrails.xml:/etc/clickhouse-server/users.d/default-query-guardrails.xml:ro
      - ./deploy/clickhouse/config.d/system-log-ttl.xml:/etc/clickhouse-server/config.d/system-log-ttl.xml:ro
      - ./deploy/clickhouse/config.d/memory-limits.xml:/etc/clickhouse-server/config.d/memory-limits.xml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --password \"$${CLICKHOUSE_PASSWORD:-health}\" --query 'SELECT 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-0}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:v26.2.2
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      # NOTE: cluster properties like kafka_batch_max_bytes are NOT valid
      # `rpk redpanda start` flags — adding e.g. --kafka-batch-max-bytes here
      # crash-loops the broker. Set them via `rpk cluster config set` instead.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:${REDPANDA_PORT:-19092}
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "127.0.0.1:${REDPANDA_PORT:-19092}:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  metric-stream-minio:
    # SeaweedFS S3 API stand-in; service hostname kept for R2_ENDPOINT wiring.
    # https://github.com/seaweedfs/seaweedfs/releases/tag/4.47
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    profiles: ["metric-stream"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${METRIC_STREAM_R2_ACCESS_KEY_ID:-metricstream}
      MINIO_ROOT_PASSWORD: ${METRIC_STREAM_R2_SECRET_ACCESS_KEY:-metricstreamlocaldev}
      METRIC_STREAM_R2_BUCKET: ${METRIC_STREAM_R2_BUCKET:-dofek-metric-stream-archive}
    volumes:
      - metric_stream_minio_data:/data
    ports:
      - "127.0.0.1:${METRIC_STREAM_MINIO_PORT:-0}:9000"
    entrypoint: >
      /bin/sh -euc "
      printf '%s\n' \"{\\\"identities\\\":[{\\\"name\\\":\\\"$$MINIO_ROOT_USER\\\",\\\"credentials\\\":[{\\\"accessKey\\\":\\\"$$MINIO_ROOT_USER\\\",\\\"secretKey\\\":\\\"$$MINIO_ROOT_PASSWORD\\\"}],\\\"actions\\\":[\\\"Admin\\\",\\\"Read\\\",\\\"Write\\\",\\\"List\\\",\\\"Tagging\\\"]}]}\" > /tmp/s3.json;
      weed server -ip=metric-stream-minio -dir=/data -s3 -s3.port=9000 -s3.ip.bind=0.0.0.0 -s3.config=/tmp/s3.json -s3.port.iceberg=0 -s3.port.lance=0 -master.volumeSizeLimitMB=1024 -master.telemetry=false &
      attempts=0;
      until wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -O /dev/null http://127.0.0.1:8888/; do
        attempts=$$((attempts + 1));
        if [ $$attempts -ge 90 ]; then
          echo metric-stream-minio did not become ready in time >&2;
          exit 1;
        fi;
        sleep 1;
      done;
      printf 's3.bucket.create -name %s\n' \"$$METRIC_STREAM_R2_BUCKET\" |
        weed shell -master=localhost:9333;
      wait
      "

  metric-stream-clickhouse-sink: &metric-stream-clickhouse-sink
    build:
      context: .
      target: server
    profiles: ["metric-stream"]
    restart: unless-stopped
    command: ["metric-stream-clickhouse-sink"]
    environment: &metric-stream-clickhouse-sink-environment
      NODE_ENV: production
      CLICKHOUSE_URL: http://default:${CLICKHOUSE_PASSWORD:-health}@clickhouse:8123
      REDPANDA_BROKERS: redpanda:9092
      METRIC_STREAM_TOPIC: ${METRIC_STREAM_LEGACY_TOPIC:-metric-stream-v1}
      METRIC_STREAM_CONSUMER_GROUP: metric-stream-clickhouse-sink
    depends_on:
      clickhouse:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  metric-stream-live-clickhouse-sink:
    <<: *metric-stream-clickhouse-sink
    environment:
      <<: *metric-stream-clickhouse-sink-environment
      METRIC_STREAM_TOPIC: ${METRIC_STREAM_LIVE_TOPIC:-metric-stream-live-v1}
      METRIC_STREAM_CONSUMER_GROUP: metric-stream-live-clickhouse-sink

  metric-stream-history-clickhouse-sink:
    <<: *metric-stream-clickhouse-sink
    environment:
      <<: *metric-stream-clickhouse-sink-environment
      METRIC_STREAM_TOPIC: ${METRIC_STREAM_HISTORY_TOPIC:-metric-stream-history-v1}
      METRIC_STREAM_CONSUMER_GROUP: metric-stream-history-clickhouse-sink

  metric-stream-r2-archive: &metric-stream-r2-archive
    image: docker.redpanda.com/redpandadata/connect:4.99.0
    profiles: ["metric-stream"]
    restart: unless-stopped
    command: ["run", "/connect/metric-stream-r2-archive.connect.yml"]
    environment: &metric-stream-r2-archive-environment
      REDPANDA_BROKERS: redpanda:9092
      METRIC_STREAM_TOPIC: ${METRIC_STREAM_LEGACY_TOPIC:-metric-stream-v1}
      METRIC_STREAM_CONSUMER_GROUP: metric-stream-r2-archive
      METRIC_STREAM_R2_BUCKET: ${METRIC_STREAM_R2_BUCKET:-dofek-metric-stream-archive}
      R2_ENDPOINT: http://metric-stream-minio:9000
      R2_ACCESS_KEY_ID: ${METRIC_STREAM_R2_ACCESS_KEY_ID:-metricstream}
      R2_SECRET_ACCESS_KEY: ${METRIC_STREAM_R2_SECRET_ACCESS_KEY:-metricstreamlocaldev}
    volumes:
      - ./deploy/redpanda/metric-stream-r2-archive.connect.yml:/connect/metric-stream-r2-archive.connect.yml:ro
    depends_on:
      redpanda:
        condition: service_healthy
      metric-stream-minio:
        condition: service_started

  metric-stream-live-r2-archive:
    <<: *metric-stream-r2-archive
    environment:
      <<: *metric-stream-r2-archive-environment
      METRIC_STREAM_TOPIC: ${METRIC_STREAM_LIVE_TOPIC:-metric-stream-live-v1}
      METRIC_STREAM_CONSUMER_GROUP: metric-stream-live-r2-archive

  metric-stream-history-r2-archive:
    <<: *metric-stream-r2-archive
    environment:
      <<: *metric-stream-r2-archive-environment
      METRIC_STREAM_TOPIC: ${METRIC_STREAM_HISTORY_TOPIC:-metric-stream-history-v1}
      METRIC_STREAM_CONSUMER_GROUP: metric-stream-history-r2-archive

  collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    restart: unless-stopped
    user: "0:0"
    environment:
      AXIOM_API_TOKEN: ${AXIOM_API_TOKEN}
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./deploy/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:13133/"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  db_data:
  clickhouse_data:
  redis_data:
  redpanda_data:
  metric_stream_minio_data:
