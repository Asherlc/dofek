[project]
name = "dofek-ml"
version = "0.1.0"
description = "ML activity classifier — fused CNN for wearable sensor data"
readme = "README.md"
authors = [{ name = "Asher Cohen", email = "asherlc@asherlc.com" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "pandas>=2.2.3",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=25.0.0",
]

[project.optional-dependencies]
training = [
    "boto3>=1.43.48",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
]

[project.scripts]
dofek-export = "dofek_ml.export:main"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "mutmut>=3.6.0",
    "pandas-stubs>=3.0.3.260530",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.21",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

# ── ruff (linter + formatter) ──

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # bugbear
    "C4",    # comprehensions
    "PT",    # pytest-style
    "PTH",   # pathlib
    "RET",   # return statements
    "SIM",   # simplify
    "ARG",   # unused arguments
    "TC",    # type-checking imports
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "E402"]

# ── mypy (type checker) ──

[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# ── pytest ──

[tool.pytest.ini_options]
testpaths = ["tests"]

# ── coverage ──

[tool.coverage.run]
source = ["src/dofek_ml"]
omit = ["src/dofek_ml/training.py"]

[tool.coverage.report]
fail_under = 80
