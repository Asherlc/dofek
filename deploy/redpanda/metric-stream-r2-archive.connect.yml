input:
  redpanda:
    seed_brokers:
      - ${REDPANDA_BROKERS}
    topics:
      - ${METRIC_STREAM_TOPIC}
    consumer_group: metric-stream-r2-archive

pipeline:
  processors:
    - archive:
        format: lines
    - compress:
        algorithm: gzip

output:
  aws_s3:
    bucket: ${METRIC_STREAM_R2_BUCKET}
    region: auto
    endpoint: ${R2_ENDPOINT}
    force_path_style_urls: true
    path: >-
      metric-stream/v1/date=${! json("recordedAt").string().slice(0, 10) }/hour=${! json("recordedAt").string().slice(11, 13) }/${! meta("kafka_topic") }-${! meta("kafka_partition") }-${! meta("kafka_offset") }-${! meta("kafka_offset") }.jsonl.gz
    credentials:
      id: ${R2_ACCESS_KEY_ID}
      secret: ${R2_SECRET_ACCESS_KEY}
