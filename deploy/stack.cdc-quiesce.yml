# Temporary deploy overlay: keep analytics-worker,
# all three metric-stream ClickHouse sinks, and processing-reconciliation at zero replicas
# while post-deploy CDC setup runs. The deploy workflow applies this overlay
# for the first stack deploy, runs Configure ClickHouse CDC, then redeploys
# without this file so all five services start.
services:
  analytics-worker:
    deploy:
      replicas: 0

  metric-stream-clickhouse-sink:
    deploy:
      replicas: 0

  metric-stream-live-clickhouse-sink:
    deploy:
      replicas: 0

  metric-stream-history-clickhouse-sink:
    deploy:
      replicas: 0

  processing-reconciliation:
    deploy:
      replicas: 0
