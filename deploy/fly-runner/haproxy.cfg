# Plain TCP relay into the Oracle stack. Bind only the WireGuard address:
# there is no underlay listener and no stats/admin socket.
global
    maxconn 256

defaults
    mode tcp
    option tcplog
    log stdout format raw local0
    timeout connect 5s
    # Long-lived Redis/Postgres/OTLP connections must not idle out.
    timeout client 24h
    timeout server 24h

# Docker's embedded DNS is the only name source. Resolve backends at runtime
# (init-addr none) so startup does not depend on service discovery timing.
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend redis_in
    bind 10.253.0.1:6379
    default_backend redis_out

frontend postgres_in
    bind 10.253.0.1:5432
    default_backend postgres_out

frontend collector_in
    bind 10.253.0.1:4318
    default_backend collector_out

backend redis_out
    server redis redis:6379 check resolvers docker init-addr none

backend postgres_out
    server db db:5432 check resolvers docker init-addr none

backend collector_out
    server collector collector:4318 check resolvers docker init-addr none
