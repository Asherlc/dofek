server {
    listen 80;
    server_name _;

    access_log off;

    add_header X-Dofek-Maintenance "1" always;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "60" always;

    location /api/ {
        default_type application/json;
        return 503 '{"error":"Dofek is undergoing scheduled maintenance. Try again in a few minutes."}';
    }

    location ~ ^/api/trpc(?:/|$) {
        default_type application/json;
        return 503 '{"error":{"message":"Dofek is undergoing scheduled maintenance. Try again in a few minutes.","code":-32603,"data":{"code":"SERVICE_UNAVAILABLE","httpStatus":503}}}';
    }

    location / {
        default_type text/html;
        return 503 '<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dofek scheduled maintenance</title>
    <meta name="color-scheme" content="light dark">
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 12vh auto 0;
            max-width: 40rem;
            padding: 0 1rem;
        }
    </style>
</head>
<body>
    <main>
        <h1>Dofek is undergoing scheduled maintenance</h1>
        <p>Try again in a few minutes.</p>
    </main>
</body>
</html>';
    }
}
