[db]
  mode = dbengine
  storage tiers = 2

  # Tier 0 stores per-second metrics for recent incident triage.
  dbengine tier 0 retention size = 96MiB
  dbengine tier 0 retention time = 1d

  # Tier 1 stores per-minute history for short trend checks.
  dbengine tier 1 retention size = 128MiB
  dbengine tier 1 retention time = 7d
