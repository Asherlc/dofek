extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  # Accept OTLP from application containers (traces + logs from Winston/OTel SDK)
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

  # Tail Docker container logs from the host filesystem
  filelog:
    include:
      - /var/lib/docker/containers/*/*.log
    include_file_name: false
    include_file_path: true
    operators:
      # Docker uses JSON log format by default
      - type: json_parser
        id: docker_json
        timestamp:
          parse_from: attributes.time
          layout: "%Y-%m-%dT%H:%M:%S.%LZ"
      # Extract container ID from the file path
      - type: regex_parser
        id: extract_container_id
        parse_from: attributes["log.file.path"]
        regex: '/var/lib/docker/containers/(?P<container_id>[a-f0-9]+)/'
      # Move parsed log body
      - type: move
        from: attributes.log
        to: body
      # Drop noisy Postgres NOTICE lines (e.g. migration progress).
      # Each PL/pgSQL RAISE NOTICE emits ~8 lines; a backfill can produce 50k+.
      - type: filter
        expr: 'body matches "severity(_local)?: .NOTICE." or body matches "routine: .exec_stmt_raise."'

  # Capacity of the data volume that holds Postgres, ClickHouse, Kafka, PeerDB,
  # backups and archives. Only an empty child directory is mounted read-only at
  # /mnt/dofek-data; it reports the same filesystem without exposing data files.
  # The default inode metric is disabled; the usage metric
  # records the free/reserved/used states, where free is the space available to
  # unprivileged users and reserved is total minus used minus that free space.
  hostmetrics/filesystem:
    collection_interval: 30s
    scrapers:
      filesystem:
        # The bind mount shares its underlying device with other mounts
        # on the host, and the default `include_virtual_filesystems: false` skips
        # duplicate-device mounts, so /mnt/dofek-data would emit nothing. The
        # strict mount-point filter below still limits collection to that path.
        include_virtual_filesystems: true
        include_mount_points:
          mount_points: [/mnt/dofek-data]
          match_type: strict
        metrics:
          system.filesystem.usage:
            enabled: true
          system.filesystem.inodes.usage:
            enabled: false

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

  # Drop Winston console lines from Docker logs. App services already ship
  # structured logs via OTLP, so keeping both roughly doubles log ingest.
  filter/drop-app-console-logs:
    error_mode: ignore
    logs:
      log_record:
        - 'IsMatch(body, "^(\\\\x1b\\\\[[0-9;]*m)?(info|warn|error|debug):")'

  # Drop debug-level OTLP logs to reduce volume while keeping info+.
  filter/drop-debug-logs:
    error_mode: ignore
    logs:
      log_record:
        - 'severity_number < SEVERITY_NUMBER_INFO'

  # Sample infra-only Docker logs. App duplicates are already filtered above.
  probabilistic_sampler/docker-logs:
    sampling_percentage: 50

  # Add resource attributes to filelog entries
  resource/docker:
    attributes:
      - key: source
        value: docker
        action: upsert

  # Host capacity is a separate signal from application telemetry.
  resource/host:
    attributes:
      - key: service.name
        value: dofek-host
        action: upsert

  # OTLP scalar log attributes become separate Axiom fields. Keep metadata in
  # one map, including logs already mapped by application exporters.
  transform/log-attributes:
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          - set(log.cache["attributes"], log.attributes)
          - delete_key(log.cache["attributes"], "custom") where IsMap(log.attributes["custom"])
          - merge_maps(log.cache["attributes"], log.attributes["custom"], "upsert") where IsMap(log.attributes["custom"])
          - delete_matching_keys(log.attributes, ".*")
          - set(log.attributes["custom"], log.cache["attributes"])

exporters:
  otlphttp/traces:
    endpoint: https://api.axiom.co
    headers:
      authorization: "Bearer ${env:AXIOM_API_TOKEN}"
      x-axiom-dataset: dofek-traces
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 5000
  otlphttp/logs:
    endpoint: https://api.axiom.co
    headers:
      authorization: "Bearer ${env:AXIOM_API_TOKEN}"
      x-axiom-dataset: dofek-logs
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 5000
  # Host capacity uses its own native metrics dataset. Axiom requires a Metrics
  # dataset for the metrics signal and a distinct header from logs/traces.
  otlphttp/host-metrics:
    endpoint: https://api.axiom.co
    headers:
      authorization: "Bearer ${env:AXIOM_API_TOKEN}"
      x-axiom-metrics-dataset: dofek-host-metrics
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 5000

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/traces]
    logs/app:
      receivers: [otlp]
      processors: [filter/drop-debug-logs, transform/log-attributes, batch]
      exporters: [otlphttp/logs]
    logs/docker:
      receivers: [filelog]
      processors: [filter/drop-app-console-logs, resource/docker, probabilistic_sampler/docker-logs, transform/log-attributes, batch]
      exporters: [otlphttp/logs]
    # Scoped to host metrics; application OTLP metrics do not use this pipeline.
    metrics/host:
      receivers: [hostmetrics/filesystem]
      processors: [resource/host, batch]
      exporters: [otlphttp/host-metrics]
