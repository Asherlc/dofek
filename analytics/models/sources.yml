version: 2

sources:
  - name: analytics
    schema: "{{ env_var('DBT_ANALYTICS_SOURCE_SCHEMA', 'analytics') }}"
    tables:
      - name: body_measurement_sample
      - name: heart_rate_day_change
      - name: metric_stream_day_change
      - name: provider_change_state
      - name: sleep_heart_rate_cutover
      - name: v_activity
      - name: v_activity_members
  - name: ingest
    schema: "{{ env_var('DBT_INGEST_SOURCE_SCHEMA', 'ingest') }}"
    tables:
      - name: metric_stream
        config:
          event_time: recorded_at
      - name: metric_stream_current
        identifier: metric_stream
      - name: metric_stream_freshness
        identifier: metric_stream
        config:
          event_time: ingested_at
  - name: postgres_fitness
    schema: "{{ env_var('DBT_POSTGRES_FITNESS_SOURCE_SCHEMA', 'postgres_fitness') }}"
    tables:
      - name: activity
      - name: device_priority
      - name: daily_metrics
      - name: food_entry
      - name: health_event
      - name: clinical_record
      - name: journal_entry
      - name: provider
      - name: provider_connection
      - name: provider_priority
      - name: sensor_device_priority
      - name: sensor_provider_priority
      - name: sleep_session
      - name: user_profile
