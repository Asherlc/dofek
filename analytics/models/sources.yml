version: 2

sources:
  - name: analytics
    schema: analytics
    tables:
      - name: body_measurement_sample
      - name: v_activity
      - name: v_activity_members
  - name: ingest
    schema: ingest
    tables:
      - name: metric_stream
        config:
          event_time: recorded_at
      - name: metric_stream_freshness
        identifier: metric_stream
        config:
          event_time: ingested_at
  - name: postgres_fitness
    schema: postgres_fitness
    tables:
      - name: activity
      - name: device_priority
      - name: daily_metrics
      - name: food_entry
      - name: health_event
      - name: journal_entry
      - name: lab_panel
      - name: lab_result
      - name: provider
      - name: provider_connection
      - name: provider_priority
      - name: sensor_device_priority
      - name: sensor_provider_priority
      - name: sleep_session
      - name: user_profile
