[project]
name = "dofek-analytics"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dbt-core==1.11.16",
    "dbt-clickhouse>=1.10.3,<1.11",
    "sqlfluff==4.3.0",
    "sqlfluff-templater-dbt==4.3.0",
]

[tool.uv.sources]
# ClickHouse MATERIALIZED CTE grammar: https://github.com/sqlfluff/sqlfluff/pull/8497
sqlfluff = { git = "https://github.com/sqlfluff/sqlfluff.git", rev = "f59543a25e13a9932a8eacc97bdcb6ede35bc011" }
sqlfluff-templater-dbt = { git = "https://github.com/sqlfluff/sqlfluff.git", rev = "f59543a25e13a9932a8eacc97bdcb6ede35bc011", subdirectory = "plugins/sqlfluff-templater-dbt" }

[tool.sqlfluff.templater.dbt.context]
analytics_source_ids = ["10000000-0000-4000-8000-000000000001"]
analytics_keys = [{ userId = "20000000-0000-4000-8000-000000000001", channel = "heart_rate", recordedAt = "2000-01-01T00:00:00.000000Z" }]
analytics_publication_revision = "1"
