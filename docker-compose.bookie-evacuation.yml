# Isolated synthetic native BookKeeper fixture, with no broker or object store.
services:
  pulsar-oxia:
    image: oxia/oxia:0.18.0@sha256:65f9898d531c3ca48a3277247650200c8065435fd542ea9a81e51c37b90fff60
    mem_limit: 128m
    environment:
      GOMEMLIMIT: 96MiB
    command: [oxia, server, --data-dir=/data/db, --wal-dir=/data/wal, --db-cache-size-mb=32, --wal-sync-data=true]
    volumes: ["oxia_data:/data"]
  pulsar-oxia-coordinator:
    image: oxia/oxia:0.18.0@sha256:65f9898d531c3ca48a3277247650200c8065435fd542ea9a81e51c37b90fff60
    mem_limit: 128m
    environment:
      GOMEMLIMIT: 96MiB
    command: [oxia, coordinator, --sconfig=/etc/oxia/coordinator.yml]
    volumes:
      - ./deploy/pulsar/oxia-coordinator.yml:/etc/oxia/coordinator.yml:ro
      - coordinator_data:/data
    depends_on: [pulsar-oxia]
  client:
    image: apachepulsar/pulsar:5.0.1@sha256:4507075d8c11b34629f3a0b41f48e3c659951e601538562ee0c088cd2c737ec0
    user: "0:0"
    mem_limit: 512m
    environment:
      BOOKIE_MEM: -Xms64m -Xmx192m -XX:MaxDirectMemorySize=128m
      metadataServiceUri: metadata-store:oxia://pulsar-oxia:6648/bookkeeper
    entrypoint: [/bin/bash, -euc]
    command: ["bin/apply-config-from-env.py conf/bookkeeper.conf && exec sleep infinity"]
    volumes:
      - ${BOOKIE_EVACUATION_DIR:?required}/fixture:/fixture
      - ${BOOKIE_EVACUATION_DIR:?required}/source:/old
      - ${BOOKIE_EVACUATION_DIR:?required}/replacement:/replacement
  source:
    image: apachepulsar/pulsar:5.0.1@sha256:4507075d8c11b34629f3a0b41f48e3c659951e601538562ee0c088cd2c737ec0
    mem_limit: 768m
    environment: &bookie_environment
      BOOKIE_MEM: -Xms64m -Xmx192m -XX:MaxDirectMemorySize=128m
      advertisedAddress: source
      metadataServiceUri: metadata-store:oxia://pulsar-oxia:6648/bookkeeper
      journalDirectory: /pulsar/data/bookkeeper/journal
      ledgerDirectories: /pulsar/data/bookkeeper/ledgers
      journalSyncData: "true"
      journalWriteData: "true"
      dbStorage_writeCacheMaxSizeMb: "32"
      dbStorage_readAheadCacheMaxSizeMb: "32"
      numAddWorkerThreads: "2"
      numReadWorkerThreads: "2"
      numJournalCallbackThreads: "1"
      httpServerEnabled: "true"
      httpServerPort: "8000"
      readOnlyModeEnabled: "true"
    entrypoint: [/bin/bash, -euc]
    command: ["bin/apply-config-from-env.py conf/bookkeeper.conf && exec bin/pulsar bookie"]
    volumes: ["${BOOKIE_EVACUATION_DIR:?required}/source:/pulsar/data/bookkeeper"]
    healthcheck: &bookie_health
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8000/api/v1/bookie/is_ready]
      interval: 2s
      timeout: 5s
      retries: 30
  replacement:
    image: apachepulsar/pulsar:5.0.1@sha256:4507075d8c11b34629f3a0b41f48e3c659951e601538562ee0c088cd2c737ec0
    mem_limit: 768m
    environment:
      <<: *bookie_environment
      advertisedAddress: replacement
    entrypoint: [/bin/bash, -euc]
    command: ["bin/apply-config-from-env.py conf/bookkeeper.conf && exec bin/pulsar bookie"]
    volumes: ["${BOOKIE_EVACUATION_DIR:?required}/replacement:/pulsar/data/bookkeeper"]
    healthcheck: *bookie_health
volumes:
  oxia_data:
  coordinator_data:
