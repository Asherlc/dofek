name: Database Backup Freshness

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: database-backup-freshness
  cancel-in-progress: false

jobs:
  check:
    name: Check database backup freshness
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/load-infisical-secrets
        with:
          keys: |
            R2_ACCESS_KEY_ID
            R2_ENDPOINT
            R2_SECRET_ACCESS_KEY
      - name: Check newest database backup
        run: pnpm check:database-backup-freshness
