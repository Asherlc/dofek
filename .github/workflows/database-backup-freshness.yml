name: Database Backup Freshness

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: database-backup-freshness
  cancel-in-progress: false

jobs:
  check:
    name: Check database backup freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/load-infisical-secrets
        with:
          keys: |
            R2_ACCESS_KEY_ID
            R2_ENDPOINT
            R2_SECRET_ACCESS_KEY
      - name: Check newest database backup
        run: pnpm check:database-backup-freshness
