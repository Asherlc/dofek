name: Release / npm packages

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  prepare-native:
    name: Prepare native packages
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: macos-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      - name: Record the source revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Test Swift package
        working-directory: packages/mobile/modules/whoop-ble
        run: swift test

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install the Oura Rust toolchain and targets
        run: |
          rustup toolchain install 1.100.0 --profile minimal --target aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
          cargo +1.100.0 install --locked cargo-about --version 0.9.3 --features cli

      - name: Build and test the Oura iOS library
        run: |
          cargo +1.100.0 test --locked --lib --manifest-path packages/oura-ble/native/Cargo.toml
          pnpm --filter @dofek/oura-ble build:ios

      - name: Archive the Oura iOS build
        run: tar -czf "$RUNNER_TEMP/oura-ble-ios.tar.gz" -C packages/oura-ble/ios/generated .

      - name: Upload the Oura iOS build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oura-ble-ios-${{ steps.revision.outputs.sha }}
          path: ${{ runner.temp }}/oura-ble-ios.tar.gz
          if-no-files-found: error

  publish:
    name: Publish
    needs: prepare-native
    runs-on: ubuntu-24.04
    permissions:
      # `contents: write` pushes release tags. Tags are not covered by the branch
      # rulesets, so this needs no elevated credential.
      contents: write
      # OIDC for npm trusted publishing; no npm token is involved.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Confirm the tested commit is current
        id: current
        env:
          EVENT_NAME: ${{ github.event_name }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          NATIVE_SHA: ${{ needs.prepare-native.outputs.sha }}
        run: |
          CURRENT_SHA="$(git rev-parse HEAD)"
          if [ "$CURRENT_SHA" = "$NATIVE_SHA" ] && { [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$CURRENT_SHA" = "$TESTED_SHA" ]; }; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "A newer commit is on main; its CI run will publish instead."
          fi

      - name: Set up Node.js and pnpm
        if: steps.current.outputs.should_release == 'true'
        uses: ./.github/actions/setup-node-pnpm

      - name: Download the matching Oura iOS build
        if: steps.current.outputs.should_release == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oura-ble-ios-${{ needs.prepare-native.outputs.sha }}
          path: ${{ runner.temp }}

      - name: Restore the Oura iOS build
        if: steps.current.outputs.should_release == 'true'
        run: |
          mkdir -p packages/oura-ble/ios/generated
          tar -xzf "$RUNNER_TEMP/oura-ble-ios.tar.gz" -C packages/oura-ble/ios/generated

      - name: Verify public packages
        if: steps.current.outputs.should_release == 'true'
        run: |
          pnpm release:npm:build
          pnpm release:npm:test

      # Version bumps reach main through the reviewed pull request opened by
      # "Version npm Packages". Publishing is a no-op for any package whose
      # version is already on the registry.
      - name: Publish packages
        if: steps.current.outputs.should_release == 'true'
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: pnpm release:npm:publish

      - name: Tag published packages
        if: steps.current.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CREATED_TAGS=()
          while read -r TAG; do
            [ -n "$TAG" ] || continue
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              continue
            fi
            git tag "$TAG"
            CREATED_TAGS+=("refs/tags/$TAG")
          done < <(pnpm exec lerna list --json --loglevel silent | jq -r '.[] | "\(.name)@\(.version)"')
          if [ "${#CREATED_TAGS[@]}" -eq 0 ]; then
            echo "All package versions are already tagged."
          else
            git push origin "${CREATED_TAGS[@]}"
            echo "Pushed ${#CREATED_TAGS[@]} release tag(s)."
          fi
