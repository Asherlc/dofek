name: Check Shared

on:
  workflow_call:
    inputs:
      commit_sha:
        description: Full commit SHA to check; the caller validates it before dispatch.
        required: true
        type: string
      mutation_base_sha:
        description: Parent source SHA used to select changed mutation lines for a historical release.
        required: false
        type: string
        default: ""
      control_commit_sha:
        description: Trusted workflow-control revision for selected historical source checks.
        required: false
        type: string
        default: ""

jobs:
  typecheck:
    name: Typecheck (shared packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Typecheck
        run: pnpm --recursive --filter '!dofek' --filter '!dofek-server' --filter '!dofek-web' --filter '!dofek-mobile' --if-present run typecheck

  test-unit-shared:
    name: Unit Tests (shared)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.control_commit_sha != ''
        with:
          ref: ${{ inputs.control_commit_sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/integration-diagnostics-reporter.ts
            scripts/integration-test-sequencer.ts
            scripts/integration-timing-reporter.ts
            scripts/prepare-mutation-shards.ts
            vitest.config.ts
            vitest.config.shared-mutation.ts
            stryker.ci.config.json
            stryker.shared.config.cjs
      - name: Install trusted shared test controls
        if: inputs.control_commit_sha != ''
        run: |
          cp .release-tools/vitest.config.ts ./vitest.config.ts
          cp .release-tools/scripts/integration-diagnostics-reporter.ts ./scripts/integration-diagnostics-reporter.ts
          cp .release-tools/scripts/integration-test-sequencer.ts ./scripts/integration-test-sequencer.ts
          cp .release-tools/scripts/integration-timing-reporter.ts ./scripts/integration-timing-reporter.ts
          cp .release-tools/vitest.config.shared-mutation.ts ./vitest.config.shared-mutation.ts
          cp .release-tools/stryker.ci.config.json ./stryker.ci.config.json
          cp .release-tools/stryker.shared.config.cjs ./stryker.shared.config.cjs
      - uses: ./.github/actions/setup-node-pnpm
      - name: Run shared package tests
        env:
          HISTORICAL_CONTROL_SOURCE: ${{ inputs.control_commit_sha != '' }}
          CLICKHOUSE_URL: http://default:health@localhost:8123
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          if [ "$HISTORICAL_CONTROL_SOURCE" = "true" ]; then
            pnpm exec vitest run --project unit-shared --coverage \
              --coverage.include='packages/*/src/**/*.ts' \
              --coverage.exclude='**/*.test.ts' \
              --coverage.exclude='**/test-helpers.ts' \
              --coverage.exclude='**/fixtures/**' \
              --coverage.exclude='**/node_modules/**' \
              --coverage.exclude='packages/server/**' \
              --coverage.exclude='packages/web/**' \
              --coverage.exclude='packages/mobile/**'
          else
            pnpm test:unit:shared
          fi
      - name: Diff coverage (changed lines only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          pip install diff-cover
          diff-cover coverage/lcov.info \
            --compare-branch=origin/$BASE_REF \
            --fail-under=80 \
            --markdown-report diff-coverage.md || DIFF_FAILED=1
          if [ -f diff-coverage.md ]; then
            cat diff-coverage.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit ${DIFF_FAILED:-0}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-shared
          path: coverage/

  import-boundaries:
    name: Import Boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm exec depcruise --config .dependency-cruiser.cjs src/ packages/

  review-scenarios:
    name: Review Scenario Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm lint:review-scenarios

  # ── Mutation testing ───────────────────────────────────────────────────

  mutation-shared-prep:
    name: Shared Mutation Prep
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.shard.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.control_commit_sha != ''
        with:
          ref: ${{ inputs.control_commit_sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: scripts/prepare-mutation-shards.ts
      - name: Compute changed files and split into shards
        id: shard
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MUTATION_BASE_SHA: ${{ inputs.mutation_base_sha }}
          CONTROL_COMMIT_SHA: ${{ inputs.control_commit_sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            DIFF_RANGE="$PR_BASE_SHA...HEAD"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$MUTATION_BASE_SHA" ]; then
              DIFF_RANGE="$MUTATION_BASE_SHA...HEAD"
            else
              DIFF_RANGE="HEAD^1...HEAD"
            fi
          else
            DIFF_RANGE="HEAD~1...HEAD"
          fi
          if [ -n "$CONTROL_COMMIT_SHA" ]; then
            SHARDS=$(pnpm exec tsx .release-tools/scripts/prepare-mutation-shards.ts --workspace . --scope shared --diff-range "$DIFF_RANGE")
          else
            SHARDS=$(pnpm tsx scripts/prepare-mutation-shards.ts --scope shared --diff-range "$DIFF_RANGE")
          fi
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"

  mutation-shared:
    name: Shared Stryker (${{ strategy.job-index }})
    needs: mutation-shared-prep
    if: needs.mutation-shared-prep.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        files: ${{ fromJSON(needs.mutation-shared-prep.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.control_commit_sha != ''
        with:
          ref: ${{ inputs.control_commit_sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            vitest.config.ts
            vitest.config.shared-mutation.ts
            stryker.ci.config.json
            stryker.shared.config.cjs
      - name: Install trusted mutation controls
        if: inputs.control_commit_sha != ''
        run: |
          cp .release-tools/vitest.config.ts ./vitest.config.ts
          cp .release-tools/vitest.config.shared-mutation.ts ./vitest.config.shared-mutation.ts
          cp .release-tools/stryker.ci.config.json ./stryker.ci.config.json
          cp .release-tools/stryker.shared.config.cjs ./stryker.shared.config.cjs
      - uses: ./.github/actions/setup-node-pnpm
      - name: Run Stryker
        env:
          MUTATE_FILES: ${{ matrix.files }}
        run: pnpm exec stryker run stryker.shared.config.cjs --mutate "$MUTATE_FILES"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-shared-report-${{ strategy.job-index }}
          path: reports/mutation/
          retention-days: 7

  # ── Aggregate ──────────────────────────────────────────────────────────

  shared-checks:
    name: Shared Checks
    needs: [typecheck, test-unit-shared, import-boundaries, review-scenarios, mutation-shared-prep, mutation-shared]
    if: always()
    runs-on: ubuntu-latest
    env:
      MUTATION_SHARDS: ${{ needs.mutation-shared-prep.outputs.shards }}
    steps:
      - name: Check results
        run: |
          fail=0
          require_success() {
            name="$1"
            result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::$name did not succeed ($result)"
              fail=1
            fi
          }

          require_success typecheck "${{ needs.typecheck.result }}"
          require_success test-unit-shared "${{ needs.test-unit-shared.result }}"
          require_success import-boundaries "${{ needs.import-boundaries.result }}"
          require_success review-scenarios "${{ needs.review-scenarios.result }}"
          require_success mutation-shared-prep "${{ needs.mutation-shared-prep.result }}"

          if [ "$MUTATION_SHARDS" != "[]" ]; then
            require_success mutation-shared "${{ needs.mutation-shared.result }}"
          fi

          exit "$fail"
