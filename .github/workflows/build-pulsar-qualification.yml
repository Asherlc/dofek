name: Build Pulsar Qualification

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Pulsar Qualification Build & Push
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image-name.outputs.reference }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image name
        id: image-name
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          name="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')-pulsar-qualification"
          tag="5.0.1-r2"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "reference=${name}:${tag}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.image-name.outputs.name }}
          tags: |
            type=raw,value=${{ steps.image-name.outputs.tag }}
            type=sha,value=${{ github.sha }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: deploy/pulsar
          file: deploy/pulsar/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.image-name.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image-name.outputs.name }}:buildcache,mode=max
      - name: Publish digest for stack pin
        env:
          IMAGE_REFERENCE: ${{ steps.image-name.outputs.reference }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${IMAGE_DIGEST}" ]; then
            echo "Pulsar qualification image push did not return a digest" >&2
            exit 1
          fi
          pinned="${IMAGE_REFERENCE}@${IMAGE_DIGEST}"
          {
            echo "## Pulsar qualification image"
            echo ""
            echo "- Tag reference: \`${IMAGE_REFERENCE}\`"
            echo "- Digest-pinned: \`${pinned}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pinned image: ${pinned}"
