name: Deploy

on:
  workflow_call:
    inputs:
      target:
        description: "What to deploy"
        required: false
        type: string
        default: all
      image_tag:
        description: "Docker image tag to deploy (e.g. sha-abc1234). Skips Docker build when provided."
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        type: choice
        options:
          - all
          - web
          - infra
          - web-stack
          - ios
          - ota
      image_tag:
        description: "Docker image tag to deploy (e.g. sha-abc1234). Skips Docker build when provided."
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  terraform:
    name: Deploy Infra
    if: inputs.target == 'infra' || inputs.target == 'web' || inputs.target == 'all'
    uses: ./.github/workflows/deploy-terraform.yml
    with:
      commit_sha: ${{ github.sha }}
      dispatching_run_id: ${{ github.run_id }}
    secrets: inherit

  docker:
    name: Docker Build & Push
    if: inputs.image_tag == '' && (inputs.target == 'web-stack' || inputs.target == 'web' || inputs.target == 'all')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Compute image tag
        id: tag
        env:
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA=$(echo "$SHA" | head -c 7)
          echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,value=${{ github.sha }}
            type=raw,value=latest
      - name: Compute web asset base URL
        id: web-assets
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          echo "base_url=https://assets.dofek.fit/web/${IMAGE_TAG}/" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: server
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_HASH=${{ github.sha }}
            VITE_ASSET_BASE_URL=${{ steps.web-assets.outputs.base_url }}
            REQUIRE_SENTRY_RELEASE_UPLOAD=true
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  docker_ml:
    name: Docker ML Build & Push
    if: inputs.image_tag == '' && (inputs.target == 'web-stack' || inputs.target == 'web' || inputs.target == 'all')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Compute image tag
        id: tag
        env:
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA=$(echo "$SHA" | head -c 7)
          echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ml
          tags: |
            type=sha,value=${{ github.sha }}
            type=raw,value=latest
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: packages/ml
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ml
          cache-to: type=gha,mode=max,scope=ml

  web-stack:
    name: Deploy Web Stack
    needs: [terraform, docker, docker_ml]
    if: always() && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') && (needs.docker.result == 'success' || needs.docker.result == 'skipped') && (needs.docker_ml.result == 'success' || needs.docker_ml.result == 'skipped') && vars.ORACLE_SERVER_HOST != '' && (inputs.target == 'web-stack' || inputs.target == 'web' || inputs.target == 'all')
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
    uses: ./.github/workflows/deploy-web-stack.yml
    with:
      image_tag: ${{ inputs.image_tag != '' && inputs.image_tag || needs.docker.outputs.image_tag }}
      server_host: ${{ vars.ORACLE_SERVER_HOST }}
      ssh_user: ubuntu
      stack_override: deploy/stack.oracle.yml
      public_url: https://dofek.asherlc.com
      web_host_rule: "Host(`dofek.asherlc.com`) || Host(`dofek.fit`) || Host(`www.dofek.fit`) || Host(`dofek.live`) || Host(`www.dofek.live`)"
      dispatching_run_id: ${{ github.run_id }}
    secrets: inherit

  ios:
    name: Deploy iOS
    if: inputs.target == 'ios' || inputs.target == 'all'
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-ios.yml
    with:
      commit_sha: ${{ github.sha }}
      dispatching_run_id: ${{ github.run_id }}
    secrets: inherit

  ota:
    name: Deploy OTA
    if: inputs.target == 'ota' || inputs.target == 'all'
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-ota.yml
    with:
      commit_sha: ${{ github.sha }}
      dispatching_run_id: ${{ github.run_id }}
    secrets: inherit
  # Image cleanup runs via daily cron on the server (see cloud-init.yml).
