name: Reusable / Deploy

on:
  workflow_call:
    inputs:
      target:
        description: "What to deploy"
        required: false
        type: string
        default: all
      image_tag:
        description: "Docker image tag to deploy (e.g. sha-abc1234). Skips Docker build when provided."
        required: false
        type: string
        default: ""
      recover_failed_deployment_id:
        description: "Exact failed live server deployment receipt to replace after verifying its source run and live identity. Use only for target web-stack."
        required: false
        type: string
        default: ""
    secrets:
      SENTRY_AUTH_TOKEN:
        required: false
      DEPLOY_SSH_KEY:
        required: false
      GHCR_TOKEN:
        required: false
      TF_API_TOKEN:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_TERRAFORM_R2_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  resolve-source:
    name: Resolve selected release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      commit_sha: ${{ steps.source.outputs.commit_sha }}
      mutation_base_sha: ${{ steps.source.outputs.mutation_base_sha }}
      image_ref: ${{ steps.source.outputs.image_ref }}
    steps:
      - name: Require current main release controls and validate source selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          TARGET: ${{ inputs.target }}
          RECOVER_FAILED_DEPLOYMENT_ID: ${{ inputs.recover_failed_deployment_id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Dispatch Release / Production from main, then select an immutable source with image_tag when needed."
            exit 1
          fi
          if [ -n "$RECOVER_FAILED_DEPLOYMENT_ID" ] && { [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$TARGET" != "web-stack" ] || [[ ! "$RECOVER_FAILED_DEPLOYMENT_ID" =~ ^[1-9][0-9]*$ ]]; }; then
            echo "::error::Failed server receipt recovery requires a positive exact deployment ID on a manual web-stack dispatch."
            exit 1
          fi
          if [[ ! "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The workflow control revision must be a full commit SHA"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: inputs.image_tag != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve source from selected immutable image or dispatch revision
        id: source
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          EVENT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$INPUT_TAG" ]; then
            SOURCE_SHA="$EVENT_SHA"
            echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          else
            IMAGE="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]'):$INPUT_TAG"
            pnpm tsx scripts/resolve-deploy-image.ts "$IMAGE" --resolve-source-only
            SOURCE_SHA=$(awk -F= '$1 == "source_sha" { print $2 }' "$GITHUB_OUTPUT" | tail -n 1)
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Resolved source must be a full commit SHA"
            exit 1
          fi
          git fetch --no-tags origin "$SOURCE_SHA"
          MUTATION_BASE_SHA=$(git rev-parse "$SOURCE_SHA^1")
          echo "commit_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "mutation_base_sha=$MUTATION_BASE_SHA" >> "$GITHUB_OUTPUT"

  check-repository:
    name: Check Repository
    needs: resolve-source
    permissions:
      contents: read
    uses: ./.github/workflows/check-repository.yml
    with:
      commit_sha: ${{ needs.resolve-source.outputs.commit_sha }}

  check-shared:
    name: Check Shared
    needs: resolve-source
    if: inputs.target != 'infra'
    permissions:
      contents: read
    uses: ./.github/workflows/check-shared.yml
    with:
      commit_sha: ${{ needs.resolve-source.outputs.commit_sha }}
      mutation_base_sha: ${{ needs.resolve-source.outputs.mutation_base_sha }}
      control_commit_sha: ${{ github.workflow_sha }}

  check-server:
    name: Check Server
    needs: resolve-source
    if: inputs.target == 'all' || inputs.target == 'web' || inputs.target == 'web-stack'
    permissions:
      contents: read
      id-token: write
      packages: read
    uses: ./.github/workflows/check-server.yml
    with:
      commit_sha: ${{ needs.resolve-source.outputs.commit_sha }}
      mutation_base_sha: ${{ needs.resolve-source.outputs.mutation_base_sha }}
      control_commit_sha: ${{ github.workflow_sha }}
      run_e2e_web: true
      run_image_scan: true

  check-mobile:
    name: Check Mobile
    needs: resolve-source
    if: inputs.target == 'all' || inputs.target == 'ios' || inputs.target == 'ota'
    permissions:
      contents: read
    uses: ./.github/workflows/check-mobile.yml
    with:
      commit_sha: ${{ needs.resolve-source.outputs.commit_sha }}

  build-mobile:
    name: Build Mobile Gate
    needs: resolve-source
    if: inputs.target == 'all' || inputs.target == 'ios' || inputs.target == 'ota'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-mobile.yml
    with:
      changed: true
      commit_sha: ${{ needs.resolve-source.outputs.commit_sha }}

  terraform:
    name: Deploy Infra
    needs: [resolve-source, check-repository]
    permissions:
      contents: read
      actions: read
      id-token: write
    if: inputs.target == 'infra'
    uses: ./.github/workflows/deploy-terraform.yml
    with:
      commit_sha: ${{ needs.resolve-source.outputs.commit_sha }}
      dispatching_run_id: ${{ github.run_id }}
    secrets:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_TERRAFORM_R2_API_TOKEN: ${{ secrets.CLOUDFLARE_TERRAFORM_R2_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  docker:
    name: Docker Build & Push
    needs: resolve-source
    if: inputs.image_tag == '' && (inputs.target == 'web-stack' || inputs.target == 'web' || inputs.target == 'all')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-docker.yml
    with:
      commit_sha: ${{ needs.resolve-source.outputs.commit_sha }}
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}


  web-stack:
    name: Deploy Web Stack
    needs: [resolve-source, check-repository, check-shared, check-server, docker, terraform]
    concurrency:
      group: deploy-web-stack-dofek-${{ vars.ORACLE_SERVER_HOST }}
      cancel-in-progress: false
    if: >-
      always() && needs.resolve-source.result == 'success' &&
      needs.check-repository.result == 'success' && needs.check-shared.result == 'success' &&
      needs.check-server.result == 'success' &&
      (needs.docker.result == 'success' || (inputs.image_tag != '' && needs.docker.result == 'skipped')) &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') &&
      vars.ORACLE_SERVER_HOST != '' &&
      (inputs.target == 'web-stack' || inputs.target == 'web' || inputs.target == 'all')
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      deployments: write
    uses: ./.github/workflows/deploy-web-environment.yml
    with:
      environment_name: production
      apply_infrastructure: ${{ inputs.target != 'web-stack' }}
      server_host: ${{ vars.ORACLE_SERVER_HOST }}
      automatic_commit_sha: ${{ needs.resolve-source.outputs.commit_sha }}
      image_tag: ${{ inputs.image_tag }}
      image_ref: ${{ needs.resolve-source.outputs.image_ref || needs.docker.outputs.image_ref }}
      recover_failed_deployment_id: ${{ inputs.recover_failed_deployment_id }}
      ssh_user: ubuntu
      stack_override: deploy/stack.oracle.yml
      public_url: https://dofek.fit
      web_host_rule: "Host(`dofek.fit`) || Host(`www.dofek.fit`) || Host(`dofek.live`) || Host(`www.dofek.live`) || Host(`dofek.asherlc.com`)"
      ci_run_id: ${{ format('{0}', github.run_id) }}
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_TERRAFORM_R2_API_TOKEN: ${{ secrets.CLOUDFLARE_TERRAFORM_R2_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  ios-archive:
    name: Build iOS Release
    # Manual image tags may resolve to a different source than github.sha.
    needs: resolve-source
    if: >-
      always() && (inputs.target == 'ios' || inputs.target == 'all') &&
      needs.resolve-source.result == 'success'
    permissions:
      actions: read
      contents: read
      id-token: write
      deployments: read
    uses: ./.github/workflows/build-ios-release.yml
    with:
      commit_sha: ${{ needs.resolve-source.outputs.commit_sha }}
      dispatching_run_id: ${{ github.run_id }}
  ios:
    name: Deploy iOS
    needs: [resolve-source, check-repository, check-shared, check-mobile, build-mobile, web-stack, ios-archive]
    if: >-
      always() && (inputs.target == 'ios' || inputs.target == 'all') &&
      needs.resolve-source.result == 'success' && needs.check-repository.result == 'success' &&
      needs.check-shared.result == 'success' && needs.check-mobile.result == 'success' &&
      needs.build-mobile.result == 'success' && needs.ios-archive.result == 'success' &&
      needs.ios-archive.outputs.should_deploy == 'true' &&
      needs.ios-archive.outputs.commit_sha == needs.resolve-source.outputs.commit_sha &&
      needs.ios-archive.outputs.artifact_id != '' && needs.ios-archive.outputs.build_number != '' &&
      (inputs.target != 'all' || (needs.web-stack.result == 'success' && needs.web-stack.outputs.publication_decision != 'superseded'))
    permissions:
      actions: read
      contents: read
      id-token: write
      deployments: write
    uses: ./.github/workflows/deploy-ios.yml
    with:
      commit_sha: ${{ needs.resolve-source.outputs.commit_sha }}
      archive_commit_sha: ${{ needs.ios-archive.outputs.commit_sha }}
      build_number: ${{ needs.ios-archive.outputs.build_number }}
      artifact_id: ${{ needs.ios-archive.outputs.artifact_id }}
      ci_run_id: ${{ format('{0}', github.run_id) }}
  ota:
    name: Deploy OTA
    needs: [resolve-source, check-repository, check-shared, check-mobile, build-mobile, web-stack]
    if: >-
      always() && (inputs.target == 'ota' || inputs.target == 'all') &&
      needs.resolve-source.result == 'success' && needs.check-repository.result == 'success' &&
      needs.check-shared.result == 'success' && needs.check-mobile.result == 'success' &&
      needs.build-mobile.result == 'success' &&
      (inputs.target != 'all' || (needs.web-stack.result == 'success' && needs.web-stack.outputs.publication_decision != 'superseded'))
    permissions:
      actions: read
      contents: read
      id-token: write
      deployments: write
    uses: ./.github/workflows/deploy-ota.yml
    with:
      commit_sha: ${{ needs.resolve-source.outputs.commit_sha }}
      dispatching_run_id: ${{ github.run_id }}

  release-summary:
    name: Manual Release Summary
    needs:
      - resolve-source
      - check-repository
      - check-shared
      - check-server
      - check-mobile
      - build-mobile
      - docker
      - terraform
      - web-stack
      - ios-archive
      - ios
      - ota
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ needs.resolve-source.outputs.commit_sha }}
      IMAGE_REF: ${{ needs.resolve-source.outputs.image_ref || needs.docker.outputs.image_ref }}
      TARGET: ${{ inputs.target }}
      SERVER_RESULT: ${{ needs.web-stack.result }}
      SERVER_DECISION: ${{ needs.web-stack.outputs.publication_decision }}
      SERVER_DEPLOYMENT_ID: ${{ needs.web-stack.outputs.deployment_id }}
      SERVER_SOURCE_SHA: ${{ needs.web-stack.outputs.commit_sha }}
      SERVER_IMAGE_REF: ${{ needs.web-stack.outputs.image_ref }}
      IOS_ARCHIVE_RESULT: ${{ needs.ios-archive.result }}
      IOS_SHOULD_DEPLOY: ${{ needs.ios-archive.outputs.should_deploy }}
      IOS_ARTIFACT_ID: ${{ needs.ios-archive.outputs.artifact_id }}
      IOS_BUILD_NUMBER: ${{ needs.ios-archive.outputs.build_number }}
      IOS_RESULT: ${{ needs.ios.result }}
      IOS_DECISION: ${{ needs.ios.outputs.decision }}
      IOS_DEPLOYMENT_ID: ${{ needs.ios.outputs.deployment_id }}
      IOS_SOURCE_SHA: ${{ needs.ios.outputs.commit_sha }}
      IOS_PUBLISH_BUILD_NUMBER: ${{ needs.ios.outputs.build_number }}
      IOS_PUBLISHER_URL: ${{ needs.ios.outputs.upload_run_url }}
      OTA_RESULT: ${{ needs.ota.result }}
      OTA_DECISION: ${{ needs.ota.outputs.decision }}
      OTA_DEPLOYMENT_ID: ${{ needs.ota.outputs.deployment_id }}
      OTA_UPDATE_ID: ${{ needs.ota.outputs.update_id }}
      OTA_RUNTIME_VERSION: ${{ needs.ota.outputs.runtime_version }}
      OTA_SUPERSEDING_SOURCE_SHA: ${{ needs.ota.outputs.superseding_source_sha }}
      OTA_SUPERSEDING_RUNTIME_VERSION: ${{ needs.ota.outputs.superseding_runtime_version }}
      OTA_SUPERSEDING_UPDATE_ID: ${{ needs.ota.outputs.superseding_update_id }}
    steps:
      - name: Report selected target outcomes
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          source_sha="${SOURCE_SHA:-$GITHUB_SHA}"
          run_url="$repo_url/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          {
            echo "## Manual release summary"
            echo
            echo "- Requested target: \`$TARGET\`"
            echo "- Selected source: [\`$source_sha\`]($repo_url/commit/$source_sha)"
            echo "- Publisher attempt: [Run #$GITHUB_RUN_NUMBER, attempt $GITHUB_RUN_ATTEMPT]($run_url)"
            echo
            echo "| Target | Outcome and identity | Publisher attempt | Deployment record |"
            echo "|---|---|---|---|"
            if [ "$TARGET" = "web" ] || [ "$TARGET" = "web-stack" ] || [ "$TARGET" = "all" ]; then
              case "$SERVER_RESULT:$SERVER_DECISION" in
                success:publish|success:recover) outcome="Published and verified" ;;
                success:unchanged) outcome="Unchanged — requested image is already live" ;;
                success:superseded) outcome="Superseded — a newer source is already live" ;;
                failure:*) outcome="Failed — inspect the publisher verification and deployment steps" ;;
                cancelled:*) outcome="Failed — publisher attempt was cancelled" ;;
                skipped:*) outcome="Blocked — required checks, immutable image, or infrastructure prerequisite did not complete" ;;
                *) outcome="Blocked — no verified publisher decision was produced ($SERVER_RESULT)" ;;
              esac
              server_source="${SERVER_SOURCE_SHA:-$source_sha}"
              identity="source [\`$server_source\`]($repo_url/commit/$server_source)"
              image_ref="${SERVER_IMAGE_REF:-$IMAGE_REF}"
              [ -z "$image_ref" ] || identity="$identity; image \`$image_ref\`"
              record="—"
              [ -z "$SERVER_DEPLOYMENT_ID" ] || record="[API deployment #$SERVER_DEPLOYMENT_ID](${GITHUB_API_URL:-https://api.github.com}/repos/$GITHUB_REPOSITORY/deployments/$SERVER_DEPLOYMENT_ID) · [Environment history]($repo_url/deployments/activity_log?environments_filter=server-production)"
              echo "| Server production | $outcome; $identity | [Open publisher attempt]($run_url) | $record |"
            else
              echo "| Server production | Not applicable — target \`$TARGET\` does not publish the server | — | — |"
            fi
            if [ "$TARGET" = "ota" ] || [ "$TARGET" = "all" ]; then
              case "$OTA_RESULT:$OTA_DECISION" in
                success:publish|success:recover) outcome="Published and device update verified" ;;
                success:unchanged) outcome="Unchanged — matching verified update is already live" ;;
                success:superseded) outcome="Superseded — a newer source is already live" ;;
                failure:*) outcome="Failed — inspect the publisher verification and deployment steps" ;;
                cancelled:*) outcome="Failed — publisher attempt was cancelled" ;;
                skipped:*) outcome="Blocked — required checks, mobile build, or server dependency did not complete" ;;
                *) outcome="Blocked — no verified publisher decision was produced ($OTA_RESULT)" ;;
              esac
              identity="source [\`$source_sha\`]($repo_url/commit/$source_sha)"
              [ -z "$OTA_RUNTIME_VERSION" ] || identity="$identity; requested runtime \`$OTA_RUNTIME_VERSION\`"
              [ -z "$OTA_UPDATE_ID" ] || identity="$identity; candidate update UUID \`$OTA_UPDATE_ID\`"
              if [ -n "$OTA_SUPERSEDING_SOURCE_SHA" ]; then
                identity="$identity; superseded by source [\`$OTA_SUPERSEDING_SOURCE_SHA\`]($repo_url/commit/$OTA_SUPERSEDING_SOURCE_SHA), runtime \`$OTA_SUPERSEDING_RUNTIME_VERSION\`, update UUID \`$OTA_SUPERSEDING_UPDATE_ID\`"
              fi
              record="—"
              [ -z "$OTA_DEPLOYMENT_ID" ] || record="[API deployment #$OTA_DEPLOYMENT_ID](${GITHUB_API_URL:-https://api.github.com}/repos/$GITHUB_REPOSITORY/deployments/$OTA_DEPLOYMENT_ID) · [Environment history]($repo_url/deployments/activity_log?environments_filter=ota-production)"
              echo "| OTA production | $outcome; $identity | [Open publisher attempt]($run_url) | $record |"
            else
              echo "| OTA production | Not applicable — target \`$TARGET\` does not publish OTA | — | — |"
            fi
            if [ "$TARGET" = "ios" ] || [ "$TARGET" = "all" ]; then
              if [ "$IOS_ARCHIVE_RESULT" = "success" ] && [ "$IOS_SHOULD_DEPLOY" = "false" ]; then
                echo "| TestFlight | Unchanged — no new signed archive is required for this source | [Open archive decision]($run_url) | — |"
              else
                case "$IOS_RESULT:$IOS_DECISION" in
                  success:upload) outcome="Uploaded to TestFlight; Apple's processing and availability continue separately" ;;
                  success:unchanged) outcome="Unchanged — this source is already uploaded" ;;
                  success:superseded) outcome="Superseded — a newer source is already uploaded" ;;
                  failure:*) outcome="Failed — inspect the archive, upload, and receipt steps" ;;
                  cancelled:*) outcome="Failed — publisher attempt was cancelled" ;;
                  skipped:*) outcome="Blocked — required checks, signed archive, or server dependency did not complete" ;;
                  *) outcome="Blocked — no verified upload decision was produced ($IOS_RESULT)" ;;
                esac
                identity_source="${IOS_SOURCE_SHA:-$source_sha}"
                identity="source [\`$identity_source\`]($repo_url/commit/$identity_source)"
                build_number="${IOS_PUBLISH_BUILD_NUMBER:-$IOS_BUILD_NUMBER}"
                [ -z "$build_number" ] || identity="$identity; build \`$build_number\`"
                if [ -n "$IOS_ARTIFACT_ID" ]; then
                  identity="$identity; archive [artifact $IOS_ARTIFACT_ID]($repo_url/actions/runs/$GITHUB_RUN_ID/artifacts/$IOS_ARTIFACT_ID)"
                fi
                record="—"
                [ -z "$IOS_DEPLOYMENT_ID" ] || record="[API deployment #$IOS_DEPLOYMENT_ID](${GITHUB_API_URL:-https://api.github.com}/repos/$GITHUB_REPOSITORY/deployments/$IOS_DEPLOYMENT_ID) · [Environment history]($repo_url/deployments/activity_log?environments_filter=testflight)"
                publisher_url="${IOS_PUBLISHER_URL:-$run_url}"
                echo "| TestFlight | $outcome; $identity | [Open publisher attempt]($publisher_url) | $record |"
              fi
            else
              echo "| TestFlight | Not applicable — target \`$TARGET\` does not upload to TestFlight | — | — |"
            fi
            if [ "$TARGET" = "infra" ]; then
              echo
              echo "Infrastructure-only target: [Terraform job and logs]($run_url). No server, OTA, or TestFlight publication was requested."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
  # Image cleanup runs via daily cron on the server (see cloud-init.yml).
