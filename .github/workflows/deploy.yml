name: Operator backup recovery lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hold-server-target:
    name: Hold server target for approved operator recovery
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: deploy-web-stack-dofek-${{ vars.ORACLE_SERVER_HOST }}
      cancel-in-progress: false
    steps:
      - name: Hold target lock until operator cancels this dedicated run
        run: sleep 7200
