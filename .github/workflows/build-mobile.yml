name: Build Mobile

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  build-metro-bundle:
    name: Metro Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-node-pnpm
      - name: Verify dependencies match Expo SDK
        run: cd packages/mobile && pnpm expo install --check
      - uses: ./.github/actions/load-infisical-secrets
        with:
          keys: |
            EXPO_PUBLIC_SENTRY_DSN
            EXPO_PUBLIC_OTEL_ENDPOINT
            EXPO_PUBLIC_OTEL_HEADERS
      - name: Export iOS bundle
        run: cd packages/mobile && pnpm expo export --platform ios --clear
      - name: Validate OTA export path
        run: cd packages/mobile && pnpm expo export --output-dir /tmp/ota-export-validate --platform ios
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-metro-bundle
          path: packages/mobile/dist/
          retention-days: 7

  build-ios-native:
    name: iOS Native Build
    runs-on: macos-26
    env:
      DERIVED_DATA_PATH: ${{ github.workspace }}/DerivedData
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/load-infisical-secrets
        with:
          keys: |
            EXPO_PUBLIC_SENTRY_DSN
            EXPO_PUBLIC_OTEL_ENDPOINT
            EXPO_PUBLIC_OTEL_HEADERS
      - uses: ./.github/actions/setup-ccache
        with:
          cache-key-prefix: ccache-ios
      - name: Generate native project
        working-directory: packages/mobile
        run: pnpm expo prebuild --clean --platform ios
      - name: Cache CocoaPods
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: packages/mobile/ios/Pods
          key: pods-v9-${{ hashFiles('packages/mobile/app.json', 'packages/mobile/app.config.ts', 'pnpm-lock.yaml') }}
          restore-keys: pods-v9-
      - name: Cache DerivedData
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ${{ env.DERIVED_DATA_PATH }}
          key: deriveddata-v2-${{ hashFiles('packages/mobile/app.json', 'packages/mobile/app.config.ts', 'pnpm-lock.yaml', 'packages/mobile/modules/*/ios/**/*.swift', 'packages/mobile/modules/*/ios/**/*.m', 'packages/mobile/modules/*/ios/**/*.h') }}
          restore-keys: deriveddata-v2-
      - name: Install CocoaPods dependencies
        run: cd packages/mobile/ios && pod install
      - name: Set build number
        if: github.event_name != 'pull_request'
        run: |
          cd packages/mobile/ios
          # Offset ensures continuity with builds uploaded before the workflow
          # split (highest previously uploaded build was ~1816).
          BUILD_NUMBER=$(( $(git rev-list --count HEAD) + 1200 ))
          echo "Setting build number to $BUILD_NUMBER"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Archive (Release, no signing)
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace packages/mobile/ios/Dofek.xcworkspace \
            -scheme Dofek \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Dofek.xcarchive \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            EXCLUDED_SOURCE_FILE_NAMES='*.test.swift' \
            CC=$RUNNER_TEMP/ccache-wrappers/ccache-clang \
            CPLUSPLUS=$RUNNER_TEMP/ccache-wrappers/ccache-clang++ \
            2>&1 | tail -40
        timeout-minutes: 25
      - name: Upload archive
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-xcarchive
          path: ${{ runner.temp }}/Dofek.xcarchive
          retention-days: 7
      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

  build-watchos:
    name: watchOS Build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-node-pnpm
      - name: Generate native project
        working-directory: packages/mobile
        run: pnpm expo prebuild --clean --platform ios
      - name: Cache CocoaPods
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: packages/mobile/ios/Pods
          key: pods-watchos-v9-${{ hashFiles('packages/mobile/app.json', 'packages/mobile/app.config.ts', 'pnpm-lock.yaml') }}
          restore-keys: pods-watchos-v9-
      - name: Install CocoaPods dependencies
        run: cd packages/mobile/ios && pod install
      - name: Build Watch target for simulator
        run: |
          set -o pipefail
          BUILD_DIR="$(pwd)/packages/mobile/ios/build"
          xcodebuild build \
            -project packages/mobile/ios/Pods/Pods.xcodeproj \
            -target Pods-DofekWatch \
            -sdk watchsimulator \
            -configuration Debug \
            SYMROOT="$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -20
          xcodebuild build \
            -project packages/mobile/ios/Dofek.xcodeproj \
            -target DofekWatch \
            -sdk watchsimulator \
            -configuration Debug \
            SYMROOT="$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            EXCLUDED_SOURCE_FILE_NAMES='*.test.swift' \
            2>&1 | tee /tmp/watchos-build.log | tail -80
      - name: Show watchOS build errors
        if: failure()
        run: |
          echo "=== Errors and warnings ==="
          ERRORS=$(grep -E '(error:|fatal error|BUILD FAILED|ld:|clang:)' /tmp/watchos-build.log | head -30 || true)
          echo "$ERRORS"
          echo ""
          echo "=== Last 20 lines ==="
          tail -20 /tmp/watchos-build.log || true
          echo "$ERRORS" | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done
      - name: Upload watchOS build log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watchos-build-log
          path: /tmp/watchos-build.log
          retention-days: 3

  lint-ios-podspecs:
    name: iOS Podspec Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate podspec deployment targets
        run: |
          APP_TARGET=$(python3 -c "import json; print(json.load(open('packages/mobile/app.json'))['expo']['ios']['deploymentTarget'])")
          echo "App deployment target: iOS $APP_TARGET"
          FAILED=0
          for spec in packages/mobile/modules/*/ios/*.podspec; do
            SPEC_TARGET=$(grep -oP "s\.platform\s*=\s*:ios,\s*'\K[^']+" "$spec")
            echo "  $(basename "$spec"): iOS $SPEC_TARGET"
            if [ "$(printf '%s\n' "$APP_TARGET" "$SPEC_TARGET" | sort -V | head -1)" != "$APP_TARGET" ]; then
              echo "  ERROR: podspec targets iOS $SPEC_TARGET which is below app target iOS $APP_TARGET"
              FAILED=1
            fi
          done
          exit $FAILED

  mobile-gate:
    name: Mobile Build Gate
    needs: [build-metro-bundle, build-ios-native, build-watchos, lint-ios-podspecs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          for result in \
            "${{ needs.build-metro-bundle.result }}" \
            "${{ needs.build-ios-native.result }}" \
            "${{ needs.build-watchos.result }}" \
            "${{ needs.lint-ios-podspecs.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "Mobile build gate failed"
              exit 1
            fi
          done
