name: Build Mobile

on:
  workflow_call:
    inputs:
      changed:
        required: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  build-metro-bundle:
    name: Metro Bundle
    if: >-
      inputs.changed &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/load-infisical-secrets
        with:
          keys: |
            EXPO_PUBLIC_SENTRY_DSN
            EXPO_PUBLIC_OTEL_ENDPOINT
            EXPO_PUBLIC_OTEL_HEADERS
      - name: Verify dependencies match Expo SDK
        run: cd packages/mobile && pnpm expo install --check
      - name: Export iOS bundle
        run: cd packages/mobile && pnpm expo export --platform ios --clear
      - name: Export Android bundle
        run: cd packages/mobile && pnpm expo export --platform android --clear
      - name: Validate OTA export path
        run: cd packages/mobile && pnpm expo export --output-dir /tmp/ota-export-validate --platform ios
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-metro-bundle
          path: packages/mobile/dist/
          retention-days: 7

  build-ios-native:
    name: iOS Native Build
    if: >-
      inputs.changed &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-26
    env:
      DERIVED_DATA_PATH: ${{ github.workspace }}/DerivedData
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/load-infisical-secrets
        with:
          keys: |
            EXPO_PUBLIC_SENTRY_DSN
            EXPO_PUBLIC_OTEL_ENDPOINT
            EXPO_PUBLIC_OTEL_HEADERS
      - uses: ./.github/actions/setup-ccache
        with:
          cache-key-prefix: ccache-ios
      - name: Generate native project
        working-directory: packages/mobile
        run: pnpm expo prebuild --clean --platform ios --no-install
      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/mobile/ios/Pods
          key: pods-v10-${{ hashFiles('packages/mobile/app.json', 'packages/mobile/app.config.ts', 'pnpm-lock.yaml') }}
          restore-keys: pods-v10-
      - name: Cache DerivedData
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DERIVED_DATA_PATH }}
          key: deriveddata-v2-${{ hashFiles('packages/mobile/app.json', 'packages/mobile/app.config.ts', 'pnpm-lock.yaml', 'packages/mobile/modules/*/ios/**/*.swift', 'packages/mobile/modules/*/ios/**/*.m', 'packages/mobile/modules/*/ios/**/*.h') }}
          restore-keys: deriveddata-v2-
      - name: Install CocoaPods dependencies
        run: cd packages/mobile/ios && pod install
      - name: Set build number
        if: github.event_name != 'pull_request'
        run: |
          cd packages/mobile/ios
          # Offset ensures continuity with builds uploaded before the workflow
          # split (highest previously uploaded build was ~1816).
          BUILD_NUMBER=$(( $(git rev-list --count HEAD) + 1200 ))
          echo "Setting build number to $BUILD_NUMBER"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Archive (Release, no signing)
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace packages/mobile/ios/Dofek.xcworkspace \
            -scheme Dofek \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Dofek.xcarchive \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            EXCLUDED_SOURCE_FILE_NAMES='*.test.swift' \
            CC=$RUNNER_TEMP/ccache-wrappers/ccache-clang \
            CPLUSPLUS=$RUNNER_TEMP/ccache-wrappers/ccache-clang++ \
            2>&1 | tail -40
        timeout-minutes: 25
      - name: Upload archive
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-xcarchive
          path: ${{ runner.temp }}/Dofek.xcarchive
          retention-days: 7
      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

  build-android-native:
    name: Android Native Build
    if: >-
      inputs.changed &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - uses: ./.github/actions/load-infisical-secrets
        with:
          keys: |
            EXPO_PUBLIC_SENTRY_DSN
            EXPO_PUBLIC_OTEL_ENDPOINT
            EXPO_PUBLIC_OTEL_HEADERS
      - name: Generate Android native project
        working-directory: packages/mobile
        run: pnpm expo prebuild --clean --platform android --no-install
      - name: Build Android phone App Bundle
        run: cd packages/mobile/android && ./gradlew :app:bundleRelease --stacktrace
      - name: Run Wear OS unit tests
        run: cd packages/mobile/targets/DofekWear && ./gradlew test --stacktrace
      - name: Build Wear OS release bundle
        run: cd packages/mobile/targets/DofekWear && ./gradlew :app:bundleRelease --stacktrace
      - name: Upload Android build logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-build-logs
          path: |
            packages/mobile/android/**/build/reports/
            packages/mobile/targets/DofekWear/**/build/reports/
          if-no-files-found: ignore
          retention-days: 3

  smoke-android-emulator:
    name: Android Emulator Smoke Test
    needs: build-android-native
    if: >-
      inputs.changed &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - uses: ./.github/actions/load-infisical-secrets
        with:
          keys: |
            EXPO_PUBLIC_SENTRY_DSN
            EXPO_PUBLIC_OTEL_ENDPOINT
            EXPO_PUBLIC_OTEL_HEADERS
      - name: Generate Android native project
        working-directory: packages/mobile
        run: pnpm expo prebuild --clean --platform android --no-install
      - name: Build Android debug APK
        run: cd packages/mobile/android && ./gradlew :app:assembleDebug --stacktrace
      - name: Launch Android app
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2.34.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: |
            adb install packages/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.dofek.app 1
            adb shell pidof com.dofek.app
      - name: Upload Android emulator logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-emulator-logs
          path: packages/mobile/android/**/build/reports/
          if-no-files-found: ignore
          retention-days: 3

  build-watchos:
    name: watchOS Build
    if: inputs.changed
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/load-infisical-secrets
        with:
          keys: EXPO_PUBLIC_SENTRY_DSN
      - uses: ./.github/actions/setup-ccache
        with:
          cache-key-prefix: ccache-watchos
      - name: Generate native project
        working-directory: packages/mobile
        run: pnpm expo prebuild --clean --platform ios --no-install
      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/mobile/ios/Pods
          key: pods-watch-v1-${{ hashFiles('packages/mobile/app.json', 'packages/mobile/app.config.ts', 'packages/mobile/targets/DofekWatch/pods.rb', 'pnpm-lock.yaml') }}
          restore-keys: pods-watch-v1-
      - name: Install CocoaPods dependencies
        run: cd packages/mobile/ios && pod install
      - name: Validate Watch target
        run: |
          set -euo pipefail
          xcodebuild -list -json -project packages/mobile/ios/Dofek.xcodeproj \
            | ruby -rjson -e 'targets = JSON.parse(STDIN.read).dig("project", "targets") || []; abort("DofekWatch target not found") unless targets.include?("DofekWatch")'
      - name: Build Watch target for simulator
        timeout-minutes: 25
        run: |
          set -o pipefail
          BUILD_DIR="$(pwd)/packages/mobile/ios/build"
          xcodebuild build \
            -project packages/mobile/ios/Pods/Pods.xcodeproj \
            -target Pods-DofekWatch \
            -configuration Debug \
            -sdk watchsimulator \
            SYMROOT="$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CC=$RUNNER_TEMP/ccache-wrappers/ccache-clang \
            CXX=$RUNNER_TEMP/ccache-wrappers/ccache-clang++ \
            2>&1 | tee -a /tmp/watchos-build.log | tail -80
          xcodebuild build \
            -project packages/mobile/ios/Dofek.xcodeproj \
            -target DofekWatch \
            -configuration Debug \
            -sdk watchsimulator \
            SYMROOT="$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            EXCLUDED_SOURCE_FILE_NAMES='*.test.swift' \
            CC=$RUNNER_TEMP/ccache-wrappers/ccache-clang \
            CXX=$RUNNER_TEMP/ccache-wrappers/ccache-clang++ \
            2>&1 | tee -a /tmp/watchos-build.log | tail -80
      - name: Show watchOS build errors
        if: failure()
        run: |
          echo "=== Errors and warnings ==="
          ERRORS=$(grep -E '(error:|fatal error|BUILD FAILED|ld:|clang:)' /tmp/watchos-build.log | head -30 || true)
          echo "$ERRORS"
          echo ""
          echo "=== Last 20 lines ==="
          tail -20 /tmp/watchos-build.log || true
          echo "$ERRORS" | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done
      - name: Upload watchOS build log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watchos-build-log
          path: /tmp/watchos-build.log
          retention-days: 3
      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

  lint-ios-podspecs:
    name: iOS Podspec Lint
    if: inputs.changed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate podspec deployment targets
        run: |
          APP_TARGET=$(python3 -c "import json; print(json.load(open('packages/mobile/app.json'))['expo']['ios']['deploymentTarget'])")
          echo "App deployment target: iOS $APP_TARGET"
          FAILED=0
          for spec in packages/mobile/modules/*/ios/*.podspec; do
            SPEC_TARGET=$(grep -oP "s\.platform\s*=\s*:ios,\s*'\K[^']+" "$spec")
            echo "  $(basename "$spec"): iOS $SPEC_TARGET"
            if [ "$(printf '%s\n' "$APP_TARGET" "$SPEC_TARGET" | sort -V | head -1)" != "$APP_TARGET" ]; then
              echo "  ERROR: podspec targets iOS $SPEC_TARGET which is below app target iOS $APP_TARGET"
              FAILED=1
            fi
          done
          exit $FAILED

  mobile-gate:
    name: Mobile Build Gate
    needs: [build-metro-bundle, build-ios-native, build-watchos, lint-ios-podspecs, build-android-native, smoke-android-emulator]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          for result in \
            "${{ needs.build-metro-bundle.result }}" \
            "${{ needs.build-ios-native.result }}" \
            "${{ needs.build-watchos.result }}" \
            "${{ needs.lint-ios-podspecs.result }}" \
            "${{ needs.build-android-native.result }}" \
            "${{ needs.smoke-android-emulator.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "Mobile build gate failed"
              exit 1
            fi
          done
