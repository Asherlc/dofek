name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  packages: write
  pull-requests: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Commit resolution ──────────────────────────────────────────────────

  resolve-commit:
    name: Resolve Commit
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
    steps:
      - name: Resolve and validate the event commit
        id: resolve
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          # For pull_request events github.sha is the candidate merge commit.
          # Use that exact revision for detection and every downstream checkout.
          COMMIT_SHA="$EVENT_SHA"
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected a full 40-character commit SHA for $EVENT_NAME, got '$COMMIT_SHA'."
            exit 1
          fi
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

  # ── Change detection ───────────────────────────────────────────────────

  detect-changes:
    name: Detect Changes
    needs: resolve-commit
    uses: ./.github/workflows/detect-changes.yml
    with:
      commit_sha: ${{ needs.resolve-commit.outputs.commit_sha }}

  # ── Independent check lanes ────────────────────────────────────────────

  check-repository:
    name: Check Repository
    needs: resolve-commit
    uses: ./.github/workflows/check-repository.yml
    with:
      commit_sha: ${{ needs.resolve-commit.outputs.commit_sha }}

  check-shared:
    name: Check Shared
    needs: [resolve-commit, detect-changes]
    if: needs.detect-changes.outputs.shared == 'true'
    uses: ./.github/workflows/check-shared.yml
    with:
      commit_sha: ${{ needs.resolve-commit.outputs.commit_sha }}

  check-server:
    name: Check Server
    needs: [resolve-commit, detect-changes]
    if: needs.detect-changes.outputs.server == 'true'
    uses: ./.github/workflows/check-server.yml
    with:
      commit_sha: ${{ needs.resolve-commit.outputs.commit_sha }}
      run_e2e_web: ${{ needs.detect-changes.outputs.e2e_web == 'true' }}
      run_image_scan: ${{ needs.detect-changes.outputs.docker_server == 'true' }}

  check-mobile:
    name: Check Mobile
    needs: [resolve-commit, detect-changes]
    if: needs.detect-changes.outputs.mobile == 'true'
    uses: ./.github/workflows/check-mobile.yml
    with:
      commit_sha: ${{ needs.resolve-commit.outputs.commit_sha }}

  # ── Reporting contexts ─────────────────────────────────────────────────

  test:
    name: Test
    needs: [detect-changes, check-repository, check-shared, check-server, check-mobile]
    if: always()
    uses: ./.github/workflows/test.yml
    with:
      repository_result: ${{ needs.check-repository.result }}
      shared_result: ${{ needs.check-shared.result }}
      server_result: ${{ needs.check-server.result }}
      mobile_result: ${{ needs.check-mobile.result }}
      shared_selected: ${{ needs.detect-changes.outputs.shared == 'true' }}
      server_selected: ${{ needs.detect-changes.outputs.server == 'true' }}
      mobile_selected: ${{ needs.detect-changes.outputs.mobile == 'true' }}
      e2e_selected: ${{ needs.detect-changes.outputs.e2e_web == 'true' }}
      image_scan_selected: ${{ needs.detect-changes.outputs.docker_server == 'true' }}

  # ── Builds ─────────────────────────────────────────────────────────────

  build-mobile:
    name: Build Mobile
    needs: detect-changes
    uses: ./.github/workflows/build-mobile.yml
    with:
      changed: ${{ needs.detect-changes.outputs.mobile == 'true' }}
    secrets: inherit

  build-web:
    name: Build Web
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    uses: ./.github/workflows/build-web.yml
    secrets: inherit

  build-zepp:
    name: Build Zepp
    needs: detect-changes
    if: needs.detect-changes.outputs.zepp == 'true'
    uses: ./.github/workflows/build-zepp.yml

  # ── Docker image (main push always publishes deploy image; others gated on changes) ──────

  build-docker:
    name: Build Docker
    needs: detect-changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || needs.detect-changes.outputs.docker_server == 'true'
    uses: ./.github/workflows/build-docker.yml
    secrets: inherit

  build-ota:
    name: Build OTA
    needs: detect-changes
    if: needs.detect-changes.outputs.docker_ota == 'true'
    uses: ./.github/workflows/build-private-ota.yml

  build-docker-ml:
    name: Build Docker ML
    needs: detect-changes
    if: needs.detect-changes.outputs.docker_ml == 'true'
    uses: ./.github/workflows/build-docker-ml.yml
    secrets: inherit

  # ── Storybook previews (PR only, depend on builds not tests) ────────────

  build-storybook:
    name: Build Storybook
    needs: detect-changes
    if: github.event_name == 'pull_request' && (needs.detect-changes.outputs.storybook_web == 'true' || needs.detect-changes.outputs.storybook_mobile == 'true')
    uses: ./.github/workflows/build-storybook.yml
    secrets: inherit

  build-storybook-mobile:
    name: Build Mobile Storybook
    needs: detect-changes
    if: github.event_name == 'pull_request' && (needs.detect-changes.outputs.storybook_web == 'true' || needs.detect-changes.outputs.storybook_mobile == 'true')
    uses: ./.github/workflows/build-storybook-mobile.yml
    secrets: inherit

  storybook-preview:
    name: Storybook Preview
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && (needs.detect-changes.outputs.storybook_web == 'true' || needs.detect-changes.outputs.storybook_mobile == 'true')
    needs: [detect-changes, build-storybook, build-storybook-mobile]
    uses: ./.github/workflows/storybook-preview.yml
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  # ── Aggregate PR gate ──────────────────────────────────────────────────

  ci-gate:
    name: CI Gate
    needs:
      - resolve-commit
      - detect-changes
      - check-repository
      - check-shared
      - check-server
      - check-mobile
      - test
      - build-mobile
      - build-web
      - build-zepp
      - build-ota
      - build-storybook
      - build-storybook-mobile
    if: always()
    runs-on: ubuntu-latest
    env:
      RESOLVE_RESULT: ${{ needs.resolve-commit.result }}
      DETECT_RESULT: ${{ needs.detect-changes.result }}
      REPOSITORY_RESULT: ${{ needs.check-repository.result }}
      SHARED_RESULT: ${{ needs.check-shared.result }}
      SERVER_RESULT: ${{ needs.check-server.result }}
      MOBILE_RESULT: ${{ needs.check-mobile.result }}
      TEST_RESULT: ${{ needs.test.result }}
      BUILD_MOBILE_RESULT: ${{ needs.build-mobile.result }}
      BUILD_WEB_RESULT: ${{ needs.build-web.result }}
      BUILD_ZEPP_RESULT: ${{ needs.build-zepp.result }}
      BUILD_OTA_RESULT: ${{ needs.build-ota.result }}
      BUILD_STORYBOOK_RESULT: ${{ needs.build-storybook.result }}
      BUILD_STORYBOOK_MOBILE_RESULT: ${{ needs.build-storybook-mobile.result }}
      SHARED_SELECTED: ${{ needs.detect-changes.outputs.shared == 'true' }}
      SERVER_SELECTED: ${{ needs.detect-changes.outputs.server == 'true' }}
      MOBILE_SELECTED: ${{ needs.detect-changes.outputs.mobile == 'true' }}
      WEB_SELECTED: ${{ needs.detect-changes.outputs.web == 'true' }}
      ZEPP_SELECTED: ${{ needs.detect-changes.outputs.zepp == 'true' }}
      OTA_SELECTED: ${{ needs.detect-changes.outputs.docker_ota == 'true' }}
      STORYBOOK_SELECTED: ${{ github.event_name == 'pull_request' && (needs.detect-changes.outputs.storybook_web == 'true' || needs.detect-changes.outputs.storybook_mobile == 'true') }}
    steps:
      - name: Check all CI results
        run: |
          fail=0
          require_success() {
            name="$1"
            result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::$name did not succeed ($result)"
              fail=1
            fi
          }
          check_selected() {
            name="$1"
            selected="$2"
            result="$3"
            if [ "$selected" = "true" ]; then
              require_success "$name" "$result"
            elif [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::Unexpected $name result ($result)"
              fail=1
            fi
          }

          require_success resolve-commit "$RESOLVE_RESULT"
          require_success detect-changes "$DETECT_RESULT"
          require_success check-repository "$REPOSITORY_RESULT"
          require_success test "$TEST_RESULT"
          require_success build-mobile "$BUILD_MOBILE_RESULT"

          check_selected check-shared "$SHARED_SELECTED" "$SHARED_RESULT"
          check_selected check-server "$SERVER_SELECTED" "$SERVER_RESULT"
          check_selected check-mobile "$MOBILE_SELECTED" "$MOBILE_RESULT"
          check_selected build-web "$WEB_SELECTED" "$BUILD_WEB_RESULT"
          check_selected build-zepp "$ZEPP_SELECTED" "$BUILD_ZEPP_RESULT"
          check_selected build-ota "$OTA_SELECTED" "$BUILD_OTA_RESULT"

          if [ "$STORYBOOK_SELECTED" = "true" ]; then
            require_success build-storybook "$BUILD_STORYBOOK_RESULT"
            require_success build-storybook-mobile "$BUILD_STORYBOOK_MOBILE_RESULT"
          elif [ "$BUILD_STORYBOOK_RESULT" = "failure" ] || [ "$BUILD_STORYBOOK_RESULT" = "cancelled" ]; then
            echo "::error::Unexpected build-storybook result ($BUILD_STORYBOOK_RESULT)"
            fail=1
          fi

          exit "$fail"
      - name: Link triggered deploys
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          {
            echo "## Triggered Deploys"
            echo ""
            echo "- [Deploy server, then publish matching mobile releases independently](${REPO_URL}/actions/workflows/deploy-web.yml)"
          } >> "$GITHUB_STEP_SUMMARY"
