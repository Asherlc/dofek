name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  packages: write
  pull-requests: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── CI ─────────────────────────────────────────────────────────────────

  build-mobile:
    name: Build Mobile
    uses: ./.github/workflows/build-mobile.yml

  build-web:
    name: Build Web
    uses: ./.github/workflows/build-web.yml

  build-zepp:
    name: Build Zepp
    uses: ./.github/workflows/build-zepp.yml

  test:
    name: Test
    uses: ./.github/workflows/test.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  ci-gate:
    name: CI Gate
    needs: [build-mobile, build-web, build-zepp, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all CI results
        run: |
          for result in \
            "${{ needs.build-mobile.result }}" \
            "${{ needs.build-web.result }}" \
            "${{ needs.build-zepp.result }}" \
            "${{ needs.test.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "CI gate failed"
              exit 1
            fi
          done
      - name: Link triggered deploys
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          {
            echo "## Triggered Deploys"
            echo ""
            echo "- [Deploy Web](${REPO_URL}/actions/workflows/deploy-web.yml)"
            echo "- [Deploy iOS](${REPO_URL}/actions/workflows/deploy-ios.yml)"
            echo "- [Deploy OTA](${REPO_URL}/actions/workflows/deploy-ota.yml)"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Docker image (main only, after CI passes) ─────────────────────────

  build-docker:
    name: Build Docker
    needs: [ci-gate]
    uses: ./.github/workflows/build-docker.yml
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  build-docker-ml:
    name: Build Docker ML
    needs: [ci-gate]
    uses: ./.github/workflows/build-docker-ml.yml

  # ── Storybook previews (PR only, depend on builds not tests) ────────────

  build-storybook:
    name: Build Storybook
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/build-storybook.yml

  build-storybook-mobile:
    name: Build Mobile Storybook
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/build-storybook-mobile.yml

  storybook-preview:
    name: Storybook Preview
    if: github.event_name == 'pull_request'
    needs: [build-storybook, build-storybook-mobile]
    uses: ./.github/workflows/storybook-preview.yml
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
