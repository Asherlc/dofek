name: Reusable / Check Repository

on:
  workflow_call:
    inputs:
      commit_sha:
        description: Full commit SHA to check; the caller validates it before dispatch.
        required: true
        type: string

jobs:
  # ── Security & supply chain ────────────────────────────────────────────

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Verify dependency security patches
        run: pnpm check:dependency-security
      - run: pnpm audit --prod --audit-level=high --ignore-registry-errors

  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Check for forbidden licenses
        run: |
          pnpm exec license-checker-rseidelsohn --production --excludePrivatePackages \
            --failOn "GPL-2.0-only;GPL-2.0-or-later;GPL-3.0-only;GPL-3.0-or-later;AGPL-1.0-only;AGPL-3.0-only;AGPL-3.0-or-later" \
            --summary

  action-pinning:
    name: Action Pinning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Validate action-pinning regression fixtures
        run: |
          set -euo pipefail

          uvx --from zizmor==1.28.0 zizmor \
            --offline \
            --strict-collection \
            --no-config \
            --no-ignores \
            --no-exit-codes \
            --format=json \
            --color=never \
            scripts/fixtures/action-pinning/unpinned \
            > "$RUNNER_TEMP/action-pinning-unpinned.json"

          unpinned_fixture_count="$(
            jq '[.[] | select(.ident == "unpinned-uses")] | length' \
              "$RUNNER_TEMP/action-pinning-unpinned.json"
          )"
          if [ "$unpinned_fixture_count" -ne 2 ]; then
            echo "::error::Expected both fixture violations, found $unpinned_fixture_count"
            jq '.[] | select(.ident == "unpinned-uses")' \
              "$RUNNER_TEMP/action-pinning-unpinned.json"
            exit 1
          fi

          uvx --from zizmor==1.28.0 zizmor \
            --offline \
            --strict-collection \
            --no-config \
            --no-ignores \
            --no-exit-codes \
            --format=json \
            --color=never \
            scripts/fixtures/action-pinning/pinned \
            > "$RUNNER_TEMP/action-pinning-pinned.json"

          if jq -e 'any(.ident == "unpinned-uses")' \
            "$RUNNER_TEMP/action-pinning-pinned.json" >/dev/null; then
            echo "::error::Pinned fixture unexpectedly produced an unpinned-uses finding"
            jq '.[] | select(.ident == "unpinned-uses")' \
              "$RUNNER_TEMP/action-pinning-pinned.json"
            exit 1
          fi
      - name: Verify all actions are SHA-pinned
        run: |
          set -euo pipefail

          action_definition_files=()
          while IFS= read -r action_definition_file; do
            action_definition_files+=("$action_definition_file")
          done < <(
            find .github/workflows .github/actions \
              -type f \
              \( -name '*.yml' -o -name '*.yaml' \) \
              -print
          )
          uvx --from zizmor==1.28.0 zizmor \
            --offline \
            --strict-collection \
            --no-config \
            --no-ignores \
            --no-exit-codes \
            --format=json \
            --color=never \
            "${action_definition_files[@]}" \
            > "$RUNNER_TEMP/action-pinning.json"

          unpinned_actions="$(
            jq -r '
              .[]
              | select(.ident == "unpinned-uses")
              | .locations[]
              | select(.symbolic.kind == "Primary")
              | "\(.symbolic.key.Local.verbatim_path):\(.concrete.location.start_point.row + 1): \(.concrete.feature)"
            ' "$RUNNER_TEMP/action-pinning.json"
          )"
          if [ -n "$unpinned_actions" ]; then
            echo "::error::Found unpinned GitHub Actions (must use full commit SHA):"
            echo "$unpinned_actions"
            exit 1
          fi
          echo "All actions are SHA-pinned"
      - name: Verify all job containers are digest-pinned
        run: |
          UNPINNED=$(awk '
            function is_pinned(line) {
              return line ~ /@sha256:[0-9a-f]{64}([[:space:]]*(#.*)?)?$/
            }
            /^    container:[[:space:]]*[^[:space:]#]/ {
              if (!is_pinned($0)) print FILENAME ":" FNR ":" $0
              next
            }
            /^    container:[[:space:]]*$/ { in_container=1; next }
            in_container && /^      image:/ {
              if (!is_pinned($0)) print FILENAME ":" FNR ":" $0
              in_container=0
              next
            }
            in_container && !/^      / { in_container=0 }
          ' .github/workflows/*.yml)
          if [ -n "$UNPINNED" ]; then
            echo "::error::Found unpinned job containers (must use a SHA-256 digest):"
            echo "$UNPINNED"
            exit 1
          fi
          echo "All job containers are digest-pinned"

  # ── Static analysis ────────────────────────────────────────────────────

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false
      - name: Install actionlint
        env:
          GOBIN: "${{ runner.temp }}/bin"
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Run actionlint (without shellcheck)
        run: |
          "$RUNNER_TEMP/bin/actionlint" -shellcheck=

  repository-lint:
    name: Repository Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Run database-free repository policies
        run: |
          pnpm lint:exact-versions
          pnpm exec biome check . --max-diagnostics=500
          pnpm lint:suppressions
          pnpm lint:workflow-downloads

  yamllint:
    name: YAMLLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Run yamllint
        run: uv tool run yamllint -c .yamllint.yml --no-warnings .

  dotenv-lint:
    name: Dotenv Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Install dotenv-linter
        run: |
          set -euo pipefail
          # dotenv-linter v4.0.0
          # https://github.com/dotenv-linter/dotenv-linter/releases/tag/v4.0.0
          archive_url="https://github.com/dotenv-linter/dotenv-linter/releases/download/v4.0.0/dotenv-linter-linux-x86_64.tar.gz"
          archive_sha256="9e2f1f6eb88a71ac15ef209f78f5a68644db82f132d2677112b4f80ec2bd2127"
          archive_path="$RUNNER_TEMP/dotenv-linter-linux-x86_64.tar.gz"
          curl --fail --location --silent --show-error "$archive_url" --output "$archive_path"
          printf '%s  %s\n' "$archive_sha256" "$archive_path" | sha256sum --check --strict -
          tar -xzf "$archive_path" -C "$RUNNER_TEMP" dotenv-linter
          rm -f "$archive_path"
      - name: Run dotenv-linter
        env:
          DOTENV_LINTER_IGNORE_CHECKS: UnorderedKey
        run: |
          "$RUNNER_TEMP/dotenv-linter" check .

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.62.0
      - name: Initialize tflint plugins
        run: tflint --init
      - name: Run tflint
        run: tflint --format compact

  sherif:
    name: Sherif
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm exec sherif

  knip:
    name: Knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm knip
        env:
          CLICKHOUSE_URL: http://default:health@localhost:8123
          EXPO_PUBLIC_SENTRY_DSN: https://public@example.invalid/1
          EXPO_APP_ID: dependency-analysis-fixture

  spellcheck:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm exec cspell --no-progress

  python-checks:
    name: Python Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install dependencies
        run: uv sync --locked --extra matching
      - name: Lint
        run: uv run --locked --extra matching ruff check src/ tests/
      - name: Format check
        run: uv run --locked --extra matching ruff format --check src/ tests/
      - name: Type check
        run: uv run --locked --extra matching mypy src/ tests/
      - name: Tests
        run: uv run --locked --extra matching pytest --cov --cov-report=xml

  hadolint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-provider-v1-${{ runner.os }}-${{ hashFiles('deploy/.terraform.lock.hcl') }}
          restore-keys: terraform-provider-v1-${{ runner.os }}-
      - run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          cd deploy
          terraform init -backend=false
          terraform validate

  check-dns-records:
    name: DNS Record Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - run: bash scripts/check-dns-records.sh

  # ── Aggregate ──────────────────────────────────────────────────────────

  repository-checks:
    name: Repository Checks
    needs:
      - secret-scan
      - audit
      - license-check
      - action-pinning
      - actionlint
      - repository-lint
      - yamllint
      - dotenv-lint
      - tflint
      - sherif
      - knip
      - spellcheck
      - python-checks
      - hadolint
      - terraform-validate
      - check-dns-records
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          for result in \
            "${{ needs.secret-scan.result }}" \
            "${{ needs.audit.result }}" \
            "${{ needs.license-check.result }}" \
            "${{ needs.action-pinning.result }}" \
            "${{ needs.actionlint.result }}" \
            "${{ needs.repository-lint.result }}" \
            "${{ needs.yamllint.result }}" \
            "${{ needs.dotenv-lint.result }}" \
            "${{ needs.tflint.result }}" \
            "${{ needs.sherif.result }}" \
            "${{ needs.knip.result }}" \
            "${{ needs.spellcheck.result }}" \
            "${{ needs.python-checks.result }}" \
            "${{ needs.hadolint.result }}" \
            "${{ needs.terraform-validate.result }}" \
            "${{ needs.check-dns-records.result }}"; do
            if [ "$result" != "success" ]; then
              echo "Repository check did not succeed: $result"
              exit 1
            fi
          done
