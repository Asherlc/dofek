name: Build private OTA

on:
  workflow_call:
    inputs:
      commit_sha:
        description: Full source SHA to build.
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and publish OTA server
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Build and publish selected source
        uses: ./.github/actions/build-private-ota
        with:
          commit_sha: ${{ inputs.commit_sha || github.sha }}
          publish: "true"
