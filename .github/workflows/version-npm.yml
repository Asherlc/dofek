name: Version npm Packages

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: version-npm
  cancel-in-progress: false

jobs:
  version:
    name: Open version pull request
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      # The App token (not GITHUB_TOKEN) is required here: pull requests opened
      # with GITHUB_TOKEN do not trigger workflows, so the required checks would
      # never report and auto-merge would wait forever.
      - name: Mint release token
        id: release_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.release_token.outputs.token }}

      - name: Confirm the tested commit is current
        id: current
        env:
          EVENT_NAME: ${{ github.event_name }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$(git rev-parse HEAD)" = "$TESTED_SHA" ]; then
            echo "should_version=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_version=false" >> "$GITHUB_OUTPUT"
            echo "A newer commit is on main; its CI run will version instead."
          fi

      - name: Set up Node.js and pnpm
        if: steps.current.outputs.should_version == 'true'
        uses: ./.github/actions/setup-node-pnpm

      - name: Find changed packages
        if: steps.current.outputs.should_version == 'true'
        id: changed
        run: |
          # A merged version bump reaches main before "Release npm Packages" has
          # published and tagged it. Both workflows start from the same CI run, so
          # without this guard `lerna changed` would still be comparing against the
          # previous tag and would open a second bump on top of the first.
          PENDING=$(
            pnpm exec lerna list --json --loglevel silent |
              jq -r '.[] | "\(.name)@\(.version)"' |
              while read -r TAG; do
                git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || echo "$TAG"
              done
          )
          if [ -n "$PENDING" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "A release is already in flight; these versions are not published yet:"
            echo "$PENDING"
            exit 0
          fi
          # `lerna changed` exits non-zero to mean "nothing changed", which is a
          # normal outcome here rather than a failure.
          CHANGED_PACKAGES=$(pnpm exec lerna changed --json --loglevel silent) || CHANGED_PACKAGES='[]'
          if [ "$(jq 'length' <<< "$CHANGED_PACKAGES")" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No package changes since the last release."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            jq -r '.[].name' <<< "$CHANGED_PACKAGES"
          fi

      - name: Open the version pull request
        if: >
          steps.current.outputs.should_version == 'true' &&
          steps.changed.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.release_token.outputs.token }}
        run: |
          BRANCH="release/npm-$(git rev-parse --short HEAD)"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "$BRANCH already exists; its pull request is still open."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Version on main so lerna's allowBranch check passes, then publish the
          # resulting commit as a branch. Tags are created after the pull request
          # merges, so an abandoned pull request never leaves stray release tags.
          pnpm exec lerna version patch --yes --no-push
          git branch "$BRANCH"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): version npm packages" \
            --body "Automated version bump for the npm packages changed since the last release. Publishing happens on main once this merges."
          gh pr merge "$BRANCH" --auto --squash
