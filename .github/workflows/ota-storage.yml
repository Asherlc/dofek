name: OTA Storage

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verified storage operation (production restore requires stopped OTA)
        required: true
        type: choice
        options: [inventory, snapshot, verify-snapshot, rehearsal-copy, migration-rehearsal, restore-rehearsal, restore-production, verify-production-migration]
      snapshot_id:
        description: Planned snapshot identifier (inventory does not create it)
        required: true
        type: string
      image:
        description: Private OTA image digest (required for migration-rehearsal)
        required: false
        type: string
      candidate_stopped:
        description: Confirm the rehearsal candidate/runner stopped before an explicit restore
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  id-token: write
  packages: read

concurrency:
  group: ${{ (github.ref == 'refs/heads/main' || inputs.operation == 'inventory') && 'deploy-web-production' || format('ota-storage-ineligible-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  storage:
    name: Verify OTA storage copy
    if: github.ref == 'refs/heads/main' || inputs.operation == 'inventory'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
      - name: Install locked native Infisical
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: "2026.10.23"
          install_args: infisical
          add_shims_to_path: "false"
          env: "false"
          export_path: "false"
      - name: Expose the Infisical binary
        run: dirname "$(mise which infisical)" >> "$GITHUB_PATH"
      - name: Load R2 credentials through OIDC
        uses: ./.github/actions/load-infisical-secrets
        with:
          keys: |
            R2_ENDPOINT
            R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY
      - name: Set up production inspection SSH
        if: inputs.operation == 'restore-production'
        uses: ./.github/actions/setup-ssh-host
        with:
          host: ${{ vars.ORACLE_SERVER_HOST }}
          private_key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Create the production inspection context
        if: inputs.operation == 'restore-production'
        env:
          ORACLE_SERVER_HOST: ${{ vars.ORACLE_SERVER_HOST }}
        run: |
          test -n "$ORACLE_SERVER_HOST" || { echo "::error::ORACLE_SERVER_HOST is required"; exit 1; }
          docker context create ota-production --docker "host=ssh://ubuntu@$ORACLE_SERVER_HOST"
      - name: Load application identity for production migration verification
        if: inputs.operation == 'verify-production-migration'
        uses: ./.github/actions/load-infisical-secrets
        with:
          keys: EXPO_APP_ID
      - name: Copy and byte-verify storage
        if: inputs.operation != 'migration-rehearsal'
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
          OTA_REHEARSAL_STOPPED: ${{ inputs.candidate_stopped }}
          OTA_DOCKER_CONTEXT: ota-production
          ORACLE_SERVER_HOST: ${{ vars.ORACLE_SERVER_HOST }}
        run: pnpm tsx scripts/ota-storage.ts "$OPERATION" "$SNAPSHOT_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Load retained application identity and signing keys
        if: inputs.operation == 'migration-rehearsal'
        uses: ./.github/actions/load-infisical-secrets
        with:
          keys: |
            EXPO_APP_ID
            EXPO_TOKEN
            OTA_JWT_SECRET
            OTA_PRIVATE_KEY_B64
            OTA_PUBLIC_KEY_B64
      - name: Sign in to private GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: inputs.operation == 'migration-rehearsal'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Rehearse candidate migration, signed delivery and restore
        if: inputs.operation == 'migration-rehearsal'
        env:
          GH_TOKEN: ${{ github.token }}
          OTA_REHEARSAL_IMAGE: ${{ inputs.image }}
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
        run: pnpm tsx scripts/rehearse-ota-storage.ts "$SNAPSHOT_ID" >> "$GITHUB_STEP_SUMMARY"
