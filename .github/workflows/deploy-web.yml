name: Release Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag; source is resolved from its immutable image before checks"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  production:
    name: Deploy Web Production
    if: github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      deployments: write
      id-token: write
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      target: web
      image_tag: ${{ inputs.image_tag }}
    secrets:
      CLOUDFLARE_TERRAFORM_R2_API_TOKEN: ${{ secrets.CLOUDFLARE_TERRAFORM_R2_API_TOKEN }}
