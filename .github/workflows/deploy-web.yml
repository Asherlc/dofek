name: Deploy Web

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: production
        type: choice
        options:
          - production
      image_tag:
        description: "Docker image tag (e.g. sha-abc1234). Defaults to latest."
        required: false
        default: "latest"
        type: string

permissions:
  contents: read
  actions: read
  packages: read
  id-token: write

jobs:
  production:
    name: Deploy Web Production
    # workflow_run uses main's workflow definitions. Deploy only when that
    # exact commit passed push CI, keeping workflows, source and image aligned.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_sha == github.sha)
    concurrency:
      group: deploy-web-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    uses: ./.github/workflows/deploy-web-environment.yml
    with:
      environment_name: production
      ssh_user: ubuntu
      stack_override: deploy/stack.oracle.yml
      image_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || '' }}
      automatic_commit_sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
      ci_run_id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || '' }}
      public_url: https://dofek.fit
      web_host_rule: "Host(`dofek.asherlc.com`) || Host(`dofek.fit`) || Host(`www.dofek.fit`) || Host(`dofek.live`) || Host(`www.dofek.live`)"
    secrets: inherit

  ota:
    name: Deploy Matching OTA
    needs: production
    if: ${{ !cancelled() && github.event_name == 'workflow_run' && needs.production.result == 'success' }}
    uses: ./.github/workflows/deploy-ota.yml
    with:
      commit_sha: ${{ needs.production.outputs.commit_sha }}
      dispatching_run_id: ${{ github.run_id }}

  ios:
    name: Deploy Matching iOS
    needs: production
    if: ${{ !cancelled() && github.event_name == 'workflow_run' && needs.production.result == 'success' }}
    permissions:
      contents: read
      actions: read
      id-token: write
      deployments: write
    uses: ./.github/workflows/deploy-ios.yml
    with:
      commit_sha: ${{ needs.production.outputs.commit_sha }}
      ci_run_id: ${{ format('{0}', github.event.workflow_run.id) }}
      dispatching_run_id: ${{ github.run_id }}
