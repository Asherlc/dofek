name: Deploy Web

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: production
        type: choice
        options:
          - production
      image_tag:
        description: "Docker image tag (e.g. sha-abc1234). Defaults to latest."
        required: false
        default: "latest"
        type: string

permissions:
  contents: read
  actions: read
  packages: read
  id-token: write

concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && 'deploy-web-production' || format('deploy-web-ineligible-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Select Production Release
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      actions: write
    outputs:
      image_tag: ${{ steps.select.outputs.image_tag }}
      commit_sha: ${{ steps.select.outputs.commit_sha }}
      ci_run_id: ${{ steps.select.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Select latest successful release or cancel an ineligible request
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm tsx scripts/select-web-deploy.ts

  production:
    name: Deploy Web Production
    needs: resolve
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    uses: ./.github/workflows/deploy-web-environment.yml
    with:
      environment_name: production
      ssh_user: ubuntu
      stack_override: deploy/stack.oracle.yml
      image_tag: ${{ needs.resolve.outputs.image_tag }}
      automatic_commit_sha: ${{ needs.resolve.outputs.commit_sha }}
      ci_run_id: ${{ needs.resolve.outputs.ci_run_id }}
      public_url: https://dofek.fit
      web_host_rule: "Host(`dofek.asherlc.com`) || Host(`dofek.fit`) || Host(`www.dofek.fit`) || Host(`dofek.live`) || Host(`www.dofek.live`)"
    secrets: inherit
