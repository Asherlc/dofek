name: Deploy Web

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: production
        type: choice
        options:
          - production
      image_tag:
        description: "Docker image tag (e.g. sha-abc1234). Defaults to latest."
        required: false
        default: "latest"
        type: string

permissions:
  contents: read
  actions: read
  packages: read
  id-token: write

concurrency:
  group: deploy-web-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'main' }}
  cancel-in-progress: true

jobs:
  production:
    name: Deploy Web Production
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    uses: ./.github/workflows/deploy-web-environment.yml
    with:
      environment_name: production
      server_host_source: production
      ssh_user: ubuntu
      stack_override: deploy/stack.oracle.yml
      image_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || '' }}
      automatic_commit_sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
      ci_run_id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
    secrets: inherit
