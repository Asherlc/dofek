name: Deploy iOS

on:
  workflow_call:
    inputs:
      commit_sha:
        description: "Actual deployed server source SHA to publish"
        required: true
        type: string
      archive_commit_sha:
        description: "Source SHA checked out for the signed archive"
        required: true
        type: string
      build_number:
        description: "Signed archive build number"
        required: true
        type: string
      artifact_id:
        description: "Signed archive artifact ID from this workflow run"
        required: true
        type: string
      ci_run_id:
        description: "CI run ID to include in deploy summary (optional)"
        required: false
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: deploy-ios
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
      deployments: write
    outputs:
      commit_sha: ${{ inputs.archive_commit_sha }}
      build_number: ${{ inputs.build_number }}
      upload_succeeded: ${{ steps.upload.outcome == 'success' }}
      deployment_id: ${{ steps.intent.outputs.deployment_id }}
      upload_run_url: ${{ steps.intent.outputs.upload_run_url }}
    steps:
      - name: Validate archive matches deployed source
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          ARCHIVE_COMMIT_SHA: ${{ inputs.archive_commit_sha }}
        run: |
          if [[ ! "$COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]] || [[ ! "$ARCHIVE_COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::commit_sha and archive_commit_sha must be full source SHAs"
            exit 1
          fi
          if [[ "$COMMIT_SHA" != "$ARCHIVE_COMMIT_SHA" ]]; then
            echo "::error::Signed iOS archive source $ARCHIVE_COMMIT_SHA does not match deployed server source $COMMIT_SHA"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.archive_commit_sha }}
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/load-infisical-secrets
        with:
          keys: |
            APP_STORE_CONNECT_KEY_ID
            APP_STORE_CONNECT_ISSUER_ID
            APP_STORE_CONNECT_KEY_BASE64
            IOS_DISTRIBUTION_CERT_BASE64
            IOS_DISTRIBUTION_CERT_PASSWORD
      - name: Download signed archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: ${{ runner.temp }}
      - name: Unpack signed archive
        run: tar -xf "$RUNNER_TEMP/testflight-signed-archive.tar" -C "$RUNNER_TEMP"
      - name: Setup code signing
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo -n "$IOS_DISTRIBUTION_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/dist-cert.p12"
          security import "$RUNNER_TEMP/dist-cert.p12" -P "$IOS_DISTRIBUTION_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
      - name: Setup App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo -n "$APP_STORE_CONNECT_KEY_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
      - name: Check out trusted upload tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/testflight-deployment.ts
            scripts/testflight-deployment-cli.ts
      - name: Prepare upload intent
        id: intent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ inputs.archive_commit_sha }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          UPLOAD_RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          DEPLOYMENT_ID=$(pnpm tsx .release-tools/scripts/testflight-deployment-cli.ts prepare "$GITHUB_REPOSITORY" "$COMMIT_SHA" "$BUILD_NUMBER" "$UPLOAD_RUN_URL")
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "upload_run_url=$UPLOAD_RUN_URL" >> "$GITHUB_OUTPUT"
      - name: Export IPA & Upload to TestFlight
        id: upload
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Dofek.xcarchive" \
            -exportOptionsPlist packages/mobile/build/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
      - name: Write job summary
        if: success()
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          COMMIT_SHA: ${{ inputs.archive_commit_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleShortVersionString" "$RUNNER_TEMP/Dofek.xcarchive/Info.plist")
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          {
            echo "## iOS Deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Version** | $VERSION |"
            echo "| **Build** | $BUILD_NUMBER |"
            echo "| **Commit** | \`${COMMIT_SHA:0:10}\` |"
            if [ -n "$CI_RUN_ID" ]; then
              echo "| **Triggered by** | [CI run #${CI_RUN_ID}](${REPO_URL}/actions/runs/${CI_RUN_ID}) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

  record-upload:
    name: Record successful TestFlight upload
    needs: [deploy]
    if: always() && needs.deploy.outputs.upload_succeeded == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - uses: ./.github/actions/setup-node-pnpm
      - name: Record uploaded source commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ needs.deploy.outputs.commit_sha }}
          BUILD_NUMBER: ${{ needs.deploy.outputs.build_number }}
          DEPLOYMENT_ID: ${{ needs.deploy.outputs.deployment_id }}
          UPLOAD_RUN_URL: ${{ needs.deploy.outputs.upload_run_url }}
        run: |
          pnpm tsx scripts/testflight-deployment-cli.ts record "$GITHUB_REPOSITORY" "$DEPLOYMENT_ID" "$COMMIT_SHA" "$BUILD_NUMBER" "$UPLOAD_RUN_URL"
