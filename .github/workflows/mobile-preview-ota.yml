name: Mobile Preview OTA

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'docs/**'

concurrency:
  group: mobile-preview-ota-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Mobile Preview OTA
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - name: Check mobile changes
        id: mobile-changes
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- packages/mobile/)
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Load mobile preview secrets from Infisical
        if: steps.mobile-changes.outputs.changed == 'true'
        uses: ./.github/actions/load-infisical-secrets
        with:
          keys: |
            EXPO_APP_ID
            EXPO_TOKEN
            EXPO_PUBLIC_SENTRY_DSN
            EXPO_PUBLIC_OTEL_ENDPOINT
            EXPO_PUBLIC_OTEL_HEADERS

      - name: Ensure preview channel maps to PR branch
        if: steps.mobile-changes.outputs.changed == 'true'
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: pnpm tsx scripts/ensure-mobile-preview-channel.ts "pr-$PR_NUMBER"

      - name: Publish OTA to PR branch
        id: publish
        if: steps.mobile-changes.outputs.changed == 'true'
        working-directory: packages/mobile
        env:
          PR_NUMBER: ${{ github.event.number }}
          DEBUG: true
          RELEASE_CHANNEL: staging
          PREVIEW_CHANNEL: pr-${{ github.event.number }}
        run: |
          RUNTIME_VERSION=$(pnpm exec expo-updates runtimeversion:resolve --platform ios --workflow managed | jq -er '.runtimeVersion | strings | select(length > 0)')
          echo "runtime_version=$RUNTIME_VERSION" >> "$GITHUB_OUTPUT"
          pnpm tsx ../../scripts/check-ota-manifest.ts --app-id "$EXPO_APP_ID" --channel "$PREVIEW_CHANNEL" --runtime-version "$RUNTIME_VERSION"
          pnpm dlx eoas@3.2.7 publish --branch "$PREVIEW_CHANNEL" --platform ios --nonInteractive --packageRunner "pnpm exec" --emitMetadata

      - name: Verify published device preview
        if: steps.mobile-changes.outputs.changed == 'true'
        env:
          PREVIEW_CHANNEL: pr-${{ github.event.number }}
        run: pnpm tsx scripts/verify-published-ota.ts packages/mobile/dist/xprem-update-metadata.json "$PREVIEW_CHANNEL" "${{ steps.publish.outputs.runtime_version }}"

      - name: Generate comment body
        if: steps.mobile-changes.outputs.changed == 'true'
        env:
          PR_NUMBER: ${{ github.event.number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          DEEP_LINK="dofek://preview/pr-$PR_NUMBER"
          ENCODED_LINK=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$DEEP_LINK', safe=''))")
          QR_IMAGE_URL="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=$ENCODED_LINK"
          cat > /tmp/mobile-preview-comment.md <<COMMENT_BODY
          ## Mobile Preview

          **Scan to open on device:**

          ![QR code for $DEEP_LINK]($QR_IMAGE_URL)

          | | |
          |---|---|
          | **Channel** | \`pr-$PR_NUMBER\` |
          | **Deep Link** | \`$DEEP_LINK\` |
          | **Commit** | $COMMIT_SHA |

          **To test on device:**
          1. Build and install the preview client: \`PREVIEW_CHANNEL=pr-$PR_NUMBER pnpm expo prebuild --clean -p ios\`
          2. Or tap deep link on an existing preview build: \`$DEEP_LINK\`

          > Each PR gets its own channel. Build a preview client with \`PREVIEW_CHANNEL=pr-{N}\` to test.
          COMMENT_BODY

      - name: Comment PR with Mobile Preview Info
        if: steps.mobile-changes.outputs.changed == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: mobile-preview
          path: /tmp/mobile-preview-comment.md
