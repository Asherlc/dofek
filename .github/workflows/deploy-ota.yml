name: Deploy OTA

on:
  workflow_call:
    inputs:
      commit_sha:
        description: "Commit SHA to deploy"
        required: true
        type: string
      dispatching_run_id:
        description: "Run ID of the workflow run that dispatched this workflow"
        required: false
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to deploy (defaults to main HEAD)"
        required: false
        type: string

concurrency:
  group: deploy-ota
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  check:
    name: Deploy Check
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Resolve commit SHA
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.commit_sha }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SHA="$INPUT_SHA"
            if [ -z "$SHA" ]; then
              SHA=$(git ls-remote origin refs/heads/main | awk '{ print $1 }')
            fi
          else
            SHA="$WORKFLOW_RUN_SHA"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  deploy:
    name: Publish OTA
    needs: [check]
    if: needs.check.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve commit SHA
        id: sha
        env:
          CHECK_SHA: ${{ needs.check.outputs.commit_sha }}
          INPUT_SHA: ${{ inputs.commit_sha }}
        run: |
          if [ -n "$CHECK_SHA" ]; then
            echo "ref=$CHECK_SHA" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_SHA" ]; then
            echo "ref=$INPUT_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$(git ls-remote origin refs/heads/main | awk '{ print $1 }')" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.sha.outputs.ref }}
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/load-infisical-secrets
        with:
          keys: |
            EXPO_TOKEN
            SENTRY_AUTH_TOKEN
            EXPO_PUBLIC_SENTRY_DSN
            EXPO_PUBLIC_OTEL_ENDPOINT
            EXPO_PUBLIC_OTEL_HEADERS
      - name: Validate mobile runtime env
        run: |
          if [ -z "${EXPO_PUBLIC_SENTRY_DSN:-}" ]; then
            echo "::error::Missing EXPO_PUBLIC_SENTRY_DSN secret required by packages/mobile/lib/telemetry.ts"
            exit 1
          fi
          if [ -z "${EXPO_PUBLIC_OTEL_ENDPOINT:-}" ]; then
            echo "::error::Missing EXPO_PUBLIC_OTEL_ENDPOINT secret required by packages/mobile/lib/telemetry.ts"
            exit 1
          fi
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "::error::Missing SENTRY_AUTH_TOKEN secret required for mobile OTA sourcemap upload"
            exit 1
          fi
      - name: Wait for OTA server
        run: |
          for attempt in $(seq 1 30); do
            if pnpm tsx scripts/check-ota-manifest.ts; then
              exit 0
            fi
            echo "Waiting for OTA server... (attempt $attempt/30)"
            sleep 2
          done
          echo "OTA server did not become healthy in time"
          exit 1
      # eoas runs `pnpx expo export` internally and swallows its output, so a
      # failing export only shows up as a generic "exited with non-zero code: 1".
      # Run the same command up front so the real Metro/expo error is visible.
      - name: Export iOS bundle (surfaces the error eoas hides)
        working-directory: packages/mobile
        env:
          SENTRY_RELEASE: ${{ steps.sha.outputs.ref }}
        run: pnpm expo export --output-dir dist --platform ios --source-maps external
      - name: Publish OTA update
        working-directory: packages/mobile
        env:
          DEBUG: true
          RELEASE_CHANNEL: production
          SENTRY_RELEASE: ${{ steps.sha.outputs.ref }}
        run: npx eoas@2.3.17 publish --branch main --platform ios --nonInteractive --packageRunner pnpm
      - name: Upload OTA sourcemaps to Sentry
        working-directory: packages/mobile
        env:
          SENTRY_RELEASE: ${{ steps.sha.outputs.ref }}
        run: pnpm exec sentry-expo-upload-sourcemaps dist

      - uses: ./.github/actions/append-dispatcher-run-summary
        if: always()
        with:
          dispatching_run_id: ${{ inputs.dispatching_run_id != '' && inputs.dispatching_run_id || github.event.workflow_run.id }}
