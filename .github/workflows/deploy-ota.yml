name: Deploy OTA

on:
  workflow_call:
    inputs:
      commit_sha:
        description: "Commit SHA to deploy"
        required: true
        type: string
      dispatching_run_id:
        description: "Run ID of the workflow run that dispatched this workflow"
        required: false
        type: string

concurrency:
  group: deploy-ota
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  deploy:
    name: Publish OTA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/load-infisical-secrets
        with:
          keys: |
            EXPO_TOKEN
            SENTRY_AUTH_TOKEN
            EXPO_PUBLIC_SENTRY_DSN
            EXPO_PUBLIC_OTEL_ENDPOINT
            EXPO_PUBLIC_OTEL_HEADERS
      - name: Validate mobile runtime env
        run: |
          if [ -z "${EXPO_PUBLIC_SENTRY_DSN:-}" ]; then
            echo "::error::Missing EXPO_PUBLIC_SENTRY_DSN secret required by packages/mobile/lib/telemetry.ts"
            exit 1
          fi
          if [ -z "${EXPO_PUBLIC_OTEL_ENDPOINT:-}" ]; then
            echo "::error::Missing EXPO_PUBLIC_OTEL_ENDPOINT secret required by packages/mobile/lib/telemetry.ts"
            exit 1
          fi
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "::error::Missing SENTRY_AUTH_TOKEN secret required for mobile OTA sourcemap upload"
            exit 1
          fi
      - name: Validate OTA server
        run: pnpm tsx scripts/check-ota-manifest.ts
      # eoas runs `pnpx expo export` internally and swallows its output, so a
      # failing export only shows up as a generic "exited with non-zero code: 1".
      # Run an isolated preflight so the real Metro/expo error is visible. The
      # publish step below owns the final dist directory and its source maps.
      - name: Export iOS bundle (surfaces the error eoas hides)
        working-directory: packages/mobile
        run: pnpm expo export --output-dir /tmp/dofek-ota-preflight --platform ios
      - name: Publish OTA update
        working-directory: packages/mobile
        env:
          DEBUG: true
          RELEASE_CHANNEL: production
          SENTRY_RELEASE: ${{ inputs.commit_sha }}
          EXPO_PUBLIC_SENTRY_RELEASE: ${{ inputs.commit_sha }}
        # EOAS 2.3.22 is the compatible Expo Open OTA publisher; eoas@3.1.0
        # is a different npm project. Keep the invocation on the pinned pnpm
        # toolchain and pass the sourcemap alias to the published export.
        run: pnpm dlx eoas@2.3.22 publish --branch main --platform ios --nonInteractive --packageRunner pnpm --dumpSourcemap
      - name: Upload OTA sourcemaps to Sentry
        working-directory: packages/mobile
        env:
          SENTRY_RELEASE: ${{ inputs.commit_sha }}
        run: pnpm exec sentry-expo-upload-sourcemaps dist

      - uses: ./.github/actions/append-dispatcher-run-summary
        if: always()
        with:
          dispatching_run_id: ${{ inputs.dispatching_run_id }}
