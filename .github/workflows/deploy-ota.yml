name: Deploy OTA

on:
  workflow_call:
    inputs:
      commit_sha:
        description: "Commit SHA to deploy"
        required: true
        type: string
      dispatching_run_id:
        description: "Run ID of the workflow run that dispatched this workflow"
        required: false
        type: string

concurrency:
  group: deploy-ota
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  deploy:
    name: Publish OTA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/load-infisical-secrets
        with:
          keys: |
            EXPO_TOKEN
            EXPO_APP_ID
            SENTRY_AUTH_TOKEN
            EXPO_PUBLIC_SENTRY_DSN
            EXPO_PUBLIC_OTEL_ENDPOINT
            EXPO_PUBLIC_OTEL_HEADERS
      - name: Validate mobile runtime env
        run: |
          if [ -z "${EXPO_PUBLIC_SENTRY_DSN:-}" ]; then
            echo "::error::Missing EXPO_PUBLIC_SENTRY_DSN secret required by packages/mobile/lib/telemetry.ts"
            exit 1
          fi
          if [ -z "${EXPO_PUBLIC_OTEL_ENDPOINT:-}" ]; then
            echo "::error::Missing EXPO_PUBLIC_OTEL_ENDPOINT secret required by packages/mobile/lib/telemetry.ts"
            exit 1
          fi
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "::error::Missing SENTRY_AUTH_TOKEN secret required for mobile OTA sourcemap upload"
            exit 1
          fi
      # The caller has already completed the matching server rollout. Validate
      # once: an unavailable or invalid manifest stops publication for diagnosis.
      - name: Validate OTA server
        working-directory: packages/mobile
        run: |
          RUNTIME_VERSION=$(pnpm exec expo-updates runtimeversion:resolve --platform ios --workflow managed | jq -er '.runtimeVersion | strings | select(length > 0)')
          pnpm tsx ../../scripts/check-ota-manifest.ts --app-id "$EXPO_APP_ID" --runtime-version "$RUNTIME_VERSION"
      # Keep export diagnostics visible before the publisher owns dist and its
      # source maps. Both commands use the installed Expo version.
      - name: Export iOS bundle (surfaces the error eoas hides)
        working-directory: packages/mobile
        run: pnpm expo export --output-dir /tmp/dofek-ota-preflight --platform ios
      - name: Publish OTA update
        working-directory: packages/mobile
        env:
          DEBUG: true
          RELEASE_CHANNEL: production
          SENTRY_RELEASE: ${{ inputs.commit_sha }}
          EXPO_PUBLIC_SENTRY_RELEASE: ${{ inputs.commit_sha }}
        run: pnpm dlx eoas@3.2.7 publish --branch main --platform ios --nonInteractive --packageRunner "pnpm exec" --dumpSourcemap --emitMetadata
      - name: Verify published device update
        run: pnpm tsx scripts/verify-published-ota.ts packages/mobile/dist/xprem-update-metadata.json production
      - name: Upload OTA sourcemaps to Sentry
        working-directory: packages/mobile
        env:
          SENTRY_RELEASE: ${{ inputs.commit_sha }}
        run: pnpm exec sentry-expo-upload-sourcemaps dist

      - uses: ./.github/actions/append-dispatcher-run-summary
        if: always()
        with:
          dispatching_run_id: ${{ inputs.dispatching_run_id }}
