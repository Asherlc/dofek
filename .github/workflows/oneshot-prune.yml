name: One-Shot Server Prune

on:
  push:
    branches:
      - Asherlc/ci-no-space-left
    paths:
      - .github/workflows/oneshot-prune.yml

jobs:
  prune:
    name: Reclaim disk on server
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup SSH
        uses: ./.github/actions/setup-ssh-host
        with:
          host: ${{ secrets.SERVER_HOST }}
          private_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Prune dangling and unused images
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          ssh -o ServerAliveInterval=30 "root@${SSH_HOST}" bash -s <<'EOF'
          set -uo pipefail
          echo "===== BEFORE ====="
          df -h /
          echo
          docker system df
          echo

          echo "===== Currently running images ====="
          running="$(docker ps --format '{{.Image}}' | sort -u)"
          printf '%s\n' "$running"
          echo

          echo "===== Removing untagged / dangling images ====="
          docker image prune -f
          echo

          echo "===== Removing stopped containers ====="
          docker container prune -f
          echo

          echo "===== Removing dofek sha-* tags not currently running ====="
          for image in $(docker images 'ghcr.io/asherlc/dofek*' --format '{{.Repository}}:{{.Tag}}'); do
            if printf '%s\n' "$running" | grep -Fxq "$image"; then
              echo "keep:   $image (in use)"
              continue
            fi
            echo "remove: $image"
            docker rmi "$image" || true
          done
          echo

          echo "===== Final docker image prune -af ====="
          docker image prune -af
          echo

          echo "===== AFTER ====="
          df -h /
          echo
          docker system df
          EOF
