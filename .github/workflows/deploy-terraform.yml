name: Deploy Terraform

on:
  workflow_call:
    inputs:
      commit_sha:
        description: "Commit SHA to deploy"
        required: false
        type: string
      dispatching_run_id:
        description: "Run ID of the workflow run that dispatched this workflow"
        required: false
        type: string
    outputs:
      server_host:
        description: "Oracle production server host/IP for Docker SSH deploys"
        value: ${{ jobs.terraform.outputs.server_host }}
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to deploy (defaults to workflow ref HEAD)"
        required: false
        type: string

concurrency:
  group: deploy-terraform
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    outputs:
      server_host: ${{ steps.tf_outputs.outputs.server_host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha != '' && inputs.commit_sha || github.sha }}
      - name: Load OTA lifecycle identity through OIDC
        uses: ./.github/actions/load-infisical-secrets
        with:
          keys: EXPO_APP_ID
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-provider-v1-${{ runner.os }}-${{ hashFiles('deploy/.terraform.lock.hcl') }}
          restore-keys: terraform-provider-v1-${{ runner.os }}-
      - name: Terraform Apply
        working-directory: deploy
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_oracle_server_host: ${{ vars.ORACLE_SERVER_HOST }}
          # Kafka TS R2 Infisical writes (when enable_kafka_tiered_storage_r2=true) use OIDC.
          # Existing GitHub OIDC machine identity (same default as load-infisical-secrets).
          INFISICAL_MACHINE_IDENTITY_ID: 46b66f72-0c77-4cfe-be1b-a43395e77be7
        run: |
          set -euo pipefail
          test -n "$TF_VAR_cloudflare_api_token" || { echo "ERROR: missing required GitHub secret CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          test -n "$TF_VAR_oracle_server_host" || { echo "ERROR: missing required GitHub variable ORACLE_SERVER_HOST" >&2; exit 1; }
          test -n "$EXPO_APP_ID" || { echo "ERROR: EXPO_APP_ID is required" >&2; exit 1; }
          export TF_VAR_expo_app_id="$EXPO_APP_ID"

          # -lock-timeout: HCP Terraform briefly holds the workspace lock during init/state ops.
          # When init is followed immediately by apply, apply can race the init lock release
          # (or collide with a stale lock from a prior failed run). Waiting up to 5 minutes
          # is benign in CI and avoids spurious "workspace already locked" failures.
          # Init/plugin download can exceed GitHub OIDC JWT lifetime (~5m), so mint the JWT
          # only after init succeeds and immediately before apply.
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init -lock-timeout=5m

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "ERROR: Missing GitHub OIDC request env; ensure id-token: write" >&2
            exit 1
          fi
          oidc_jwt="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value')"
          if [ -z "$oidc_jwt" ] || [ "$oidc_jwt" = "null" ]; then
            echo "ERROR: Failed to mint GitHub OIDC token for Infisical Terraform auth" >&2
            exit 1
          fi
          echo "::add-mask::$oidc_jwt"
          export INFISICAL_AUTH_METHOD=oidc
          export INFISICAL_AUTH_JWT="$oidc_jwt"

          # Never print plan/apply JSON, TF secret values, or Infisical credentials.
          # No sensitive terraform outputs are declared for this path.
          # Kafka TS R2 resources stay count=0 until TF_VAR_enable_kafka_tiered_storage_r2=true
          # after Root auth + Infisical privilege ACK (docs/kafka-ts-r2-offload-iac.md).
          terraform apply -auto-approve -lock-timeout=5m

      - name: Terraform Outputs
        id: tf_outputs
        working-directory: deploy
        env:
          ORACLE_SERVER_HOST: ${{ vars.ORACLE_SERVER_HOST }}
        run: |
          echo "server_host=$ORACLE_SERVER_HOST" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/append-dispatcher-run-summary
        if: always()
        with:
          dispatching_run_id: ${{ inputs.dispatching_run_id != '' && inputs.dispatching_run_id || github.event.workflow_run.id }}
