name: Release Dofek Zepp (Zepp Store)

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ZAB Package
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      ci_run_id: ${{ steps.resolve-ci-run.outputs.run_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/zepp-v* ]]; then
            VERSION="${GITHUB_REF_NAME#zepp-v}"
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            VERSION="0.0.$(date +%s)"
            RELEASE_TAG="zepp-v${VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          IFS='.' read -ra PARTS <<< "$VERSION"
          MAJOR="${PARTS[0]:-0}"
          MINOR="${PARTS[1]:-0}"
          PATCH="${PARTS[2]:-0}"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Resolve triggering CI run
        id: resolve-ci-run
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=" >> "$GITHUB_OUTPUT"
          fi

      - name: Write job summary
        env:
          CI_RUN_ID: ${{ steps.resolve-ci-run.outputs.run_id }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          {
            echo "## Zepp ZAB Build v$VERSION"
            echo ""
            if [ -n "$CI_RUN_ID" ]; then
              echo "| | |"
              echo "|---|---|"
              echo "| **Triggered by** | [CI run #${CI_RUN_ID}](${REPO_URL}/actions/runs/${CI_RUN_ID}) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Patch version files
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CODE=${{ steps.version.outputs.code }}
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('packages/zepp/app.json', 'utf8'));
            app.app.version.name = '$VERSION';
            app.app.version.code = $CODE;
            fs.writeFileSync('packages/zepp/app.json', JSON.stringify(app, null, 2) + '\n');
            const pkg = JSON.parse(fs.readFileSync('packages/zepp/package.json', 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('packages/zepp/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Print resolved version
        run: echo "Building Dofek Zepp v${{ steps.version.outputs.version }} (code ${{ steps.version.outputs.code }})"

      - name: Build Zepp ZAB
        uses: ./.github/actions/build-zepp

      - name: Upload ZAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zepp-zab
          path: packages/zepp/dist/
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zepp-zab
          path: dist

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.ZEPP_RELEASE_TOKEN }}
          CI_RUN_ID: ${{ needs.build.outputs.ci_run_id }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::ZEPP_RELEASE_TOKEN is not configured"
            exit 1
          fi
          ZAB_FILE=$(ls dist/*.zab 2>/dev/null | head -1)
          if [ -z "$ZAB_FILE" ]; then
            echo "::error::No .zab file found in dist/"
            ls -la dist/
            exit 1
          fi
          NOTES_FILE=$(mktemp)
          echo "Zepp OS mini-program build for Amazfit T-Rex 3." > "$NOTES_FILE"
          if [ -n "$CI_RUN_ID" ]; then
            REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "" >> "$NOTES_FILE"
            echo "Triggered by [CI run #${CI_RUN_ID}](${REPO_URL}/actions/runs/${CI_RUN_ID})" >> "$NOTES_FILE"
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Dofek Zepp v$VERSION" \
            --notes-file "$NOTES_FILE" \
            "$ZAB_FILE"
