name: Detect Changes

on:
  workflow_call:
    outputs:
      analytics:
        value: ${{ jobs.detect.outputs.analytics }}
      docker_ml:
        value: ${{ jobs.detect.outputs.docker_ml }}
      docker_server:
        value: ${{ jobs.detect.outputs.docker_server }}
      e2e_web:
        value: ${{ jobs.detect.outputs.e2e_web }}
      ml:
        value: ${{ jobs.detect.outputs.ml }}
      mobile:
        value: ${{ jobs.detect.outputs.mobile }}
      storybook_mobile:
        value: ${{ jobs.detect.outputs.storybook_mobile }}
      storybook_web:
        value: ${{ jobs.detect.outputs.storybook_web }}
      terraform:
        value: ${{ jobs.detect.outputs.terraform }}
      web:
        value: ${{ jobs.detect.outputs.web }}
      zepp:
        value: ${{ jobs.detect.outputs.zepp }}

jobs:
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      analytics: ${{ steps.detect.outputs.analytics }}
      docker_ml: ${{ steps.detect.outputs.docker_ml }}
      docker_server: ${{ steps.detect.outputs.docker_server }}
      e2e_web: ${{ steps.detect.outputs.e2e_web }}
      ml: ${{ steps.detect.outputs.ml }}
      mobile: ${{ steps.detect.outputs.mobile }}
      storybook_mobile: ${{ steps.detect.outputs.storybook_mobile }}
      storybook_web: ${{ steps.detect.outputs.storybook_web }}
      terraform: ${{ steps.detect.outputs.terraform }}
      web: ${{ steps.detect.outputs.web }}
      zepp: ${{ steps.detect.outputs.zepp }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed areas
        id: detect
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          run_all=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run_all=true
            changed_files=""
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            diff_range="origin/${BASE_REF}...HEAD"
            changed_files=$(git diff --name-only "$diff_range")
          elif [ -z "${BEFORE_SHA:-}" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            run_all=true
            changed_files=""
          else
            diff_range="${BEFORE_SHA}...${CURRENT_SHA}"
            changed_files=$(git diff --name-only "$diff_range")
          fi

          if [ "$run_all" = false ] && printf '%s\n' "$changed_files" | grep -E '^(\.github/workflows/(ci|test|detect-changes)\.yml|\.github/actions/)' >/dev/null; then
            run_all=true
          fi

          has_changed_matching() {
            pattern="$1"
            if [ "$run_all" = true ]; then
              return 0
            fi
            printf '%s\n' "$changed_files" | grep -E "$pattern" >/dev/null
          }

          write_output() {
            name="$1"
            pattern="$2"
            if has_changed_matching "$pattern"; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
              echo "$name=true"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
              echo "$name=false"
            fi
          }

          shared_packages='packages/(auth|format|heart-rate-variability|nutrition|onboarding|provider-http|providers-meta|recovery|scoring|server|stats|training|zones)/'
          package_files='(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.json)$'
          server_surface="^(src/|${shared_packages}|analytics/|drizzle/|Dockerfile|entrypoint\.sh|\.github/workflows/build-docker\.yml|${package_files})"
          web_surface="^(packages/web/|${shared_packages}|src/|analytics/|drizzle/|\.github/workflows/build-web\.yml|${package_files})"
          mobile_surface="^(packages/mobile/|${shared_packages}|\.github/workflows/build-mobile\.yml|${package_files})"
          zepp_surface="^(packages/zepp/|packages/zepp-client/|${package_files}|\.github/actions/build-zepp/|\.github/workflows/build-zepp\.yml)"

          write_output analytics "^(analytics/|src/db/clickhouse-sql/|scripts/migration-policy\.ts|\.sqlfluff|${package_files})"
          write_output docker_ml "^(packages/ml/|\.github/workflows/build-docker-ml\.yml)"
          write_output docker_server "$server_surface"
          write_output e2e_web "^(cypress/|docker-compose\.e2e\.yml|${server_surface#^}|packages/web/)"
          write_output ml "^(packages/ml/)"
          write_output mobile "$mobile_surface"
          write_output storybook_mobile "^(packages/mobile/|${shared_packages}|\.storybook/|\.github/workflows/(build-storybook-mobile|storybook-preview)\.yml|${package_files})"
          write_output storybook_web "^(packages/web/|${shared_packages}|\.storybook/|\.github/workflows/(build-storybook|storybook-preview)\.yml|${package_files})"
          write_output terraform "^(deploy/|\.github/workflows/deploy-terraform\.yml)"
          write_output web "$web_surface"
          write_output zepp "$zepp_surface"
