name: Pulsar Source Build
# cspell:words buildkit buildx

on:
  pull_request:
    paths:
      - deploy/pulsar/Dockerfile
      - deploy/pulsar/repeatable-offload-payload.patch
      - deploy/pulsar/oxia-coordinator.yml
      - .github/workflows/pulsar-source-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-build:
    name: ARM source build (4 GiB)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
        with:
          driver: docker-container
          driver-opts: |
            memory=4g
            memory-swap=4g
      - name: Verify builder memory boundary
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          limits=$(docker inspect "buildx_buildkit_${BUILDER_NAME}0" --format '{{.HostConfig.Memory}} {{.HostConfig.MemorySwap}}')
          test "$limits" = '4294967296 4294967296'
          echo "Builder memory and total memory-plus-swap limits: $limits bytes"
      - name: Build patched broker from source
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          docker buildx build \
            --builder "$BUILDER_NAME" \
            --progress plain \
            --no-cache \
            --load \
            --tag dofek-pulsar-source:qualification \
            deploy/pulsar
          {
            echo '### Pulsar source build passed'
            echo "Commit: $GITHUB_SHA"
            echo 'The normal Dockerfile source stage ran without an imported NAR or cached build layers.'
            echo 'The Dockerfile runs the affected upstream test class, main/test style checks and NAR packaging with testRetryCount=0.'
            echo 'The docker-container builder had verified 4 GiB memory and memory-plus-swap limits.'
            echo 'This build did not run services, contact R2 or publish an image.'
          } >> "$GITHUB_STEP_SUMMARY"
