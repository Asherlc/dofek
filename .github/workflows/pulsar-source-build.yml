name: Pulsar Source Build
# cspell:words buildkit buildx

on:
  pull_request:
    paths:
      - deploy/pulsar/Dockerfile
      - deploy/pulsar/repeatable-offload-payload.patch
      - deploy/pulsar/oxia-coordinator.yml
      - .github/workflows/pulsar-source-build.yml
  workflow_dispatch:
  workflow_call:

jobs:
  source-build:
    name: ARM source build (4 GiB)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
        with:
          driver: docker-container
          driver-opts: |
            memory=4g
            memory-swap=4g
      - name: Verify builder memory boundary
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          limits=$(docker inspect "buildx_buildkit_${BUILDER_NAME}0" --format '{{.HostConfig.Memory}} {{.HostConfig.MemorySwap}}')
          test "$limits" = '4294967296 4294967296'
          echo "Builder memory and total memory-plus-swap limits: $limits bytes"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image name
        if: env.PUBLISH == 'true'
        id: image-name
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          name="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')-pulsar-qualification"
          tag="5.0.1-r2"
          sha_tag="sha-${GITHUB_SHA}"
          {
            echo "name=$name"
            echo "tag=$tag"
            echo "sha_tag=$sha_tag"
            echo "reference=${name}:${tag}"
          } >> "$GITHUB_OUTPUT"
      - name: Build patched broker from source
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
          IMAGE_NAME: ${{ steps.image-name.outputs.name }}
          IMAGE_TAG: ${{ steps.image-name.outputs.tag }}
          IMAGE_SHA_TAG: ${{ steps.image-name.outputs.sha_tag }}
        run: |
          set -euo pipefail
          metadata="$(mktemp)"
          args=(
            --builder "$BUILDER_NAME"
            --platform linux/arm64
            --progress plain
            --no-cache
            --metadata-file "$metadata"
          )
          if [ "$PUBLISH" = "true" ]; then
            args+=(--push)
            args+=(--tag "${IMAGE_NAME}:${IMAGE_TAG}")
            args+=(--tag "${IMAGE_NAME}:${IMAGE_SHA_TAG}")
          else
            args+=(--load)
            args+=(--tag dofek-pulsar-source:qualification)
          fi
          docker buildx build "${args[@]}" deploy/pulsar
          {
            echo '### Pulsar source build'
            echo "Commit: $GITHUB_SHA"
            echo "Event: $GITHUB_EVENT_NAME"
            echo "Publish: $PUBLISH"
            echo 'Cold Dockerfile source stage: no imported NAR; builder 4 GiB memory + swap verified.'
            echo 'Dockerfile runs affected upstream test class, style checks, NAR packaging with testRetryCount=0.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PUBLISH" = "true" ]; then
            digest="$(jq -r '."containerimage.digest" // empty' "$metadata")"
            if [ -z "$digest" ]; then
              echo "Pulsar qualification image push did not return a digest" >&2
              exit 1
            fi
            pinned="${IMAGE_NAME}:${IMAGE_TAG}@${digest}"
            {
              echo ""
              echo "## Pulsar qualification image"
              echo ""
              echo "- Tag reference: \`${IMAGE_NAME}:${IMAGE_TAG}\`"
              echo "- SHA tag: \`${IMAGE_NAME}:${IMAGE_SHA_TAG}\`"
              echo "- Digest-pinned: \`${pinned}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Pinned image: ${pinned}"
          else
            echo 'This build did not run services, contact R2 or publish an image.' >> "$GITHUB_STEP_SUMMARY"
          fi
