name: Test

on:
  workflow_call:
    inputs:
      run_e2e_web:
        description: Run web E2E tests.
        required: false
        type: boolean
        default: true
      run_image_scan:
        description: Build and scan the server image.
        required: false
        type: boolean
        default: true
      run_mobile_checks:
        description: Run mobile-specific tests and Swift checks.
        required: false
        type: boolean
        default: true

jobs:
  # ── Security & supply chain ────────────────────────────────────────────

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm audit --prod --audit-level=high --ignore-registry-errors

  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Check for forbidden licenses
        run: |
          pnpm exec license-checker-rseidelsohn --production --excludePrivatePackages \
            --failOn "GPL-2.0-only;GPL-2.0-or-later;GPL-3.0-only;GPL-3.0-or-later;AGPL-1.0-only;AGPL-3.0-only;AGPL-3.0-or-later" \
            --summary

  action-pinning:
    name: Action Pinning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Validate action-pinning regression fixtures
        run: |
          set -euo pipefail

          uvx --from zizmor==1.28.0 zizmor \
            --offline \
            --strict-collection \
            --no-config \
            --no-ignores \
            --no-exit-codes \
            --format=json \
            --color=never \
            scripts/fixtures/action-pinning/unpinned \
            > "$RUNNER_TEMP/action-pinning-unpinned.json"

          unpinned_fixture_count="$(
            jq '[.[] | select(.ident == "unpinned-uses")] | length' \
              "$RUNNER_TEMP/action-pinning-unpinned.json"
          )"
          if [ "$unpinned_fixture_count" -ne 2 ]; then
            echo "::error::Expected both fixture violations, found $unpinned_fixture_count"
            jq '.[] | select(.ident == "unpinned-uses")' \
              "$RUNNER_TEMP/action-pinning-unpinned.json"
            exit 1
          fi

          uvx --from zizmor==1.28.0 zizmor \
            --offline \
            --strict-collection \
            --no-config \
            --no-ignores \
            --no-exit-codes \
            --format=json \
            --color=never \
            scripts/fixtures/action-pinning/pinned \
            > "$RUNNER_TEMP/action-pinning-pinned.json"

          if jq -e 'any(.ident == "unpinned-uses")' \
            "$RUNNER_TEMP/action-pinning-pinned.json" >/dev/null; then
            echo "::error::Pinned fixture unexpectedly produced an unpinned-uses finding"
            jq '.[] | select(.ident == "unpinned-uses")' \
              "$RUNNER_TEMP/action-pinning-pinned.json"
            exit 1
          fi
      - name: Verify all actions are SHA-pinned
        run: |
          set -euo pipefail

          action_definition_files=()
          while IFS= read -r action_definition_file; do
            action_definition_files+=("$action_definition_file")
          done < <(
            find .github/workflows .github/actions \
              -type f \
              \( -name '*.yml' -o -name '*.yaml' \) \
              -print
          )
          uvx --from zizmor==1.28.0 zizmor \
            --offline \
            --strict-collection \
            --no-config \
            --no-ignores \
            --no-exit-codes \
            --format=json \
            --color=never \
            "${action_definition_files[@]}" \
            > "$RUNNER_TEMP/action-pinning.json"

          unpinned_actions="$(
            jq -r '
              .[]
              | select(.ident == "unpinned-uses")
              | .locations[]
              | select(.symbolic.kind == "Primary")
              | "\(.symbolic.key.Local.verbatim_path):\(.concrete.location.start_point.row + 1): \(.concrete.feature)"
            ' "$RUNNER_TEMP/action-pinning.json"
          )"
          if [ -n "$unpinned_actions" ]; then
            echo "::error::Found unpinned GitHub Actions (must use full commit SHA):"
            echo "$unpinned_actions"
            exit 1
          fi
          echo "All actions are SHA-pinned"
      - name: Verify all job containers are digest-pinned
        run: |
          UNPINNED=$(awk '
            function is_pinned(line) {
              return line ~ /@sha256:[0-9a-f]{64}([[:space:]]*(#.*)?)?$/
            }
            /^    container:[[:space:]]*[^[:space:]#]/ {
              if (!is_pinned($0)) print FILENAME ":" FNR ":" $0
              next
            }
            /^    container:[[:space:]]*$/ { in_container=1; next }
            in_container && /^      image:/ {
              if (!is_pinned($0)) print FILENAME ":" FNR ":" $0
              in_container=0
              next
            }
            in_container && !/^      / { in_container=0 }
          ' .github/workflows/*.yml)
          if [ -n "$UNPINNED" ]; then
            echo "::error::Found unpinned job containers (must use a SHA-256 digest):"
            echo "$UNPINNED"
            exit 1
          fi
          echo "All job containers are digest-pinned"

  image-scan:
    name: Image Vulnerability Scan
    if: inputs.run_image_scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: |
            image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image name
        id: image-name
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "name=ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build server image with cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: server
          load: true
          tags: e2e-server:latest
          build-args: DEPENDENCY_CACHE_BUST=${{ hashFiles('package.json', 'pnpm-lock.yaml', 'Dockerfile') }}
          cache-from: |
            type=gha,scope=e2e
            type=registry,ref=${{ steps.image-name.outputs.name }}:e2e-buildcache
          cache-to: type=gha,mode=max,scope=e2e
      - name: Scan server image (Grype)
        env:
          GRYPE_IMAGE: mirror.gcr.io/anchore/grype:v0.111.1@sha256:3c1cd2ff38196e753751fb1619b3b6787a6e3e79149f2a2aec57946d2c154cd2
        run: |
          for attempt in $(seq 1 5); do
            if docker pull "$GRYPE_IMAGE"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Failed to pull $GRYPE_IMAGE after 5 attempts"
              exit 1
            fi
            echo "Grype image pull failed; retrying in 5s..."
            sleep 5
          done

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$GRYPE_IMAGE" \
            e2e-server:latest \
            --only-fixed \
            --fail-on critical \
            -o table

  security-gate:
    name: Security & Dependencies
    needs: [secret-scan, audit, license-check, action-pinning, image-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          for result in \
            "${{ needs.secret-scan.result }}" \
            "${{ needs.audit.result }}" \
            "${{ needs.license-check.result }}" \
            "${{ needs.action-pinning.result }}" \
            "${{ needs.image-scan.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A required job failed or was cancelled"
              exit 1
            fi
          done

  # ── Static analysis ────────────────────────────────────────────────────

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false
      - name: Install actionlint
        env:
          GOBIN: "${{ runner.temp }}/bin"
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Run actionlint (without shellcheck)
        run: |
          "$RUNNER_TEMP/bin/actionlint" -shellcheck=

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      clickhouse:
        image: mirror.gcr.io/clickhouse/clickhouse-server:26.6.1.1193-alpine@sha256:1904267fde1d8b794c9e5fda1b5a4bffd9b2e5b3d1057d5911161257125956f3
        env:
          CLICKHOUSE_DB: fitness
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ${{ github.run_id }}
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --password ${{ github.run_id }} --query 'SELECT 1'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Run lint policies
        run: pnpm lint
        env:
          CLICKHOUSE_URL: http://default:${{ github.run_id }}@127.0.0.1:8123

  stylelint:
    name: Stylelint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Run stylelint
        run: pnpm lint:css

  yamllint:
    name: YAMLLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Run yamllint
        run: uv tool run yamllint -c .yamllint.yml --no-warnings .

  openapi-lint:
    name: OpenAPI Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Validate OpenAPI document
        run: pnpm lint:openapi

  dotenv-lint:
    name: Dotenv Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dotenv-linter
        run: |
          # dotenv-linter v4.0.0
          curl -sSfL https://raw.githubusercontent.com/dotenv-linter/dotenv-linter/f9076b02daed89f54ed0bd23951a4cfa5ccceac4/install.sh -o "$RUNNER_TEMP/dotenv-linter-install.sh"
          sh "$RUNNER_TEMP/dotenv-linter-install.sh" -b "$HOME/.local/bin" v4.0.0
      - name: Run dotenv-linter
        env:
          DOTENV_LINTER_IGNORE_CHECKS: UnorderedKey
        run: |
          "$HOME/.local/bin/dotenv-linter" check .

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.62.0
      - name: Initialize tflint plugins
        run: tflint --init
      - name: Run tflint
        run: tflint --format compact

  sqlfluff:
    name: SQLFluff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Lint new migration SQL
        run: |
          NEW_MIGRATIONS=$(git diff --diff-filter=A --name-only "origin/${BASE_REF}...HEAD" -- \
            'drizzle/*.sql' ':(exclude)drizzle/_history/*.sql' \
            | grep -v '_baseline' \
            || true)
          if [ -z "$NEW_MIGRATIONS" ]; then
            echo "No new migrations to lint"
            exit 0
          fi
          echo "Linting migrations:"
          echo "$NEW_MIGRATIONS"
          echo "$NEW_MIGRATIONS" | xargs uv tool run sqlfluff lint

  typecheck-discover:
    name: Discover packages to typecheck
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: matrix
        run: |
          node << 'EOF'
          const fs = require('fs');
          const packages = [];

          const rootPkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (rootPkg.scripts && rootPkg.scripts.typecheck) {
            packages.push({ name: 'root', dir: '.' });
          }

          for (const dir of fs.readdirSync('packages')) {
            try {
              if (!fs.statSync('packages/' + dir).isDirectory()) continue;
              const pkg = JSON.parse(fs.readFileSync('packages/' + dir + '/package.json', 'utf8'));
              if (pkg.scripts && pkg.scripts.typecheck) {
                packages.push({ name: pkg.name || dir, dir: 'packages/' + dir });
              }
            } catch (_) {}
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'json=' + JSON.stringify(packages) + '\n');
          EOF

  typecheck:
    name: Typecheck (${{ matrix.package.name }})
    needs: typecheck-discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.typecheck-discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Typecheck
        working-directory: ${{ matrix.package.dir }}
        run: pnpm run typecheck

  sherif:
    name: Sherif
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm exec sherif

  knip:
    name: Knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm knip
        env:
          CLICKHOUSE_URL: http://default:health@localhost:8123
          EXPO_PUBLIC_SENTRY_DSN: https://public@example.invalid/1

  spellcheck:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm exec cspell --no-progress

  import-boundaries:
    name: Import Boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm exec depcruise --config .dependency-cruiser.cjs src/ packages/

  python-checks:
    name: Python Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: uv run ruff check src/ tests/
      - name: Format check
        run: uv run ruff format --check src/ tests/
      - name: Type check
        run: uv run mypy src/ tests/
      - name: Tests
        run: uv run pytest --cov --cov-report=xml

  hadolint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-provider-v1-${{ runner.os }}-${{ hashFiles('deploy/.terraform.lock.hcl') }}
          restore-keys: terraform-provider-v1-${{ runner.os }}-
      - run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          cd deploy
          terraform init -backend=false
          terraform validate

  check-dns-records:
    name: DNS Record Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/check-dns-records.sh

  swiftlint:
    name: SwiftLint
    needs: check-mobile-changes
    if: needs.check-mobile-changes.outputs.changed == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        working-directory: packages/mobile
        run: swiftlint lint --strict --reporter github-actions-logging

  periphery:
    name: Periphery
    needs: check-mobile-changes
    if: needs.check-mobile-changes.outputs.changed == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/mobile/modules/health-kit/.build
            packages/mobile/modules/whoop-ble/.build
            packages/mobile/modules/watch-motion/.build
          key: periphery-v2-${{ hashFiles('packages/mobile/modules/*/Package.swift') }}
          restore-keys: periphery-v2-
      - name: Install Periphery
        run: brew install peripheryapp/periphery/periphery
      - name: Scan for unused code
        run: |
          fail=0
          # Only packages with library source files (non-Module .swift files)
          # core-motion and ble-probe have no library code — only Module bridge files
          for pkg in health-kit whoop-ble watch-motion; do
            echo "::group::Scanning $pkg"
            (cd packages/mobile/modules/$pkg && periphery scan --retain-public --disable-update-check --relative-results --format github-actions) || fail=1
            echo "::endgroup::"
          done
          exit $fail

  quality-gate:
    name: Lint & Static Analysis
    needs: [actionlint, lint, stylelint, yamllint, openapi-lint, dotenv-lint, sqlfluff, tflint, typecheck, sherif, knip, spellcheck, import-boundaries, python-checks, hadolint, terraform-validate, check-dns-records, swiftlint, periphery]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          for result in \
            "${{ needs.actionlint.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.stylelint.result }}" \
            "${{ needs.yamllint.result }}" \
            "${{ needs.openapi-lint.result }}" \
            "${{ needs.dotenv-lint.result }}" \
            "${{ needs.sqlfluff.result }}" \
            "${{ needs.tflint.result }}" \
            "${{ needs.typecheck.result }}" \
            "${{ needs.sherif.result }}" \
            "${{ needs.knip.result }}" \
            "${{ needs.spellcheck.result }}" \
            "${{ needs.import-boundaries.result }}" \
            "${{ needs.python-checks.result }}" \
            "${{ needs.hadolint.result }}" \
            "${{ needs.terraform-validate.result }}" \
            "${{ needs.check-dns-records.result }}" \
            "${{ needs.swiftlint.result }}" \
            "${{ needs.periphery.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A required job failed or was cancelled"
              exit 1
            fi
          done

  # ── Tests ──────────────────────────────────────────────────────────────

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm exec vitest run --project unit --coverage
        env:
          CLICKHOUSE_URL: http://default:health@localhost:8123
          VITEST_COVERAGE_SKIP_THRESHOLDS: "true"
          NODE_OPTIONS: --max-old-space-size=8192
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage/lcov.info
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit
          path: coverage/

  test-fit-decoder:
    name: Native FIT Decoder
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/vcpkg/downloads
            ~/.cache/vcpkg/archives
          key: vcpkg-fit-${{ hashFiles('native/fit-decoder/vcpkg.json', 'native/fit-decoder/vcpkg-configuration.json', 'native/fit-decoder/vcpkg-ports/**') }}
      - name: Bootstrap vcpkg
        env:
          VCPKG_DOWNLOADS: ${{ runner.temp }}/vcpkg/downloads
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg/repo
        run: |
          mkdir -p "$VCPKG_DOWNLOADS"
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout 9e593bb18ea69cc5095e012465dcd675a822ed0d
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Build and test FIT decoder
        working-directory: native/fit-decoder
        env:
          VCPKG_DOWNLOADS: ${{ runner.temp }}/vcpkg/downloads
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg/repo
        run: |
          cmake --preset release
          cmake --build --preset release
          ctest --preset release
      - name: Upload FIT decoder binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fit-decoder-linux
          path: .build/fit-decoder/bin/dofek-fit-decoder

  test-integration:
    name: Integration Tests (${{ matrix.shard }}/4)
    needs: test-fit-decoder
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: mirror.gcr.io/timescale/timescaledb-ha:pg18.3-ts2.26.4-all
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: mirror.gcr.io/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      redpanda:
        image: mirror.gcr.io/redpandadata/redpanda:v26.1.12
        ports:
          - 9092:9092
        options: >-
          --health-cmd "rpk cluster health | grep -q 'Healthy:.*true'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      clickhouse:
        image: mirror.gcr.io/clickhouse/clickhouse-server:26.6.1.1193-alpine
        env:
          CLICKHOUSE_DB: fitness
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ${{ github.run_id }}
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --add-host=host.docker.internal:host-gateway
          --health-cmd "clickhouse-client --password ${{ github.run_id }} --query 'SELECT 1'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/test
      CLICKHOUSE_URL: http://default:${{ github.run_id }}@localhost:8123
      REDPANDA_BROKERS: localhost:9092
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Download FIT decoder binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fit-decoder-linux
          path: .build/fit-decoder/bin
      - name: Make FIT decoder executable
        run: chmod +x .build/fit-decoder/bin/dofek-fit-decoder
      - run: pnpm exec vitest run --project integration --coverage --shard=${{ matrix.shard }}/4
        timeout-minutes: 12
        env:
          VITEST_COVERAGE_SKIP_THRESHOLDS: "true"
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage/lcov.info
          flags: integration
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-integration-${{ matrix.shard }}
          path: coverage/

  coverage:
    name: Coverage
    needs: [test-unit, test-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-unit
          path: coverage-unit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-integration-*
          path: coverage-integration
          merge-multiple: false
      - name: Merge and check coverage
        run: |
          mkdir -p .nyc_output
          cp coverage-unit/coverage-final.json .nyc_output/unit.json
          index=0
          for file in coverage-integration/coverage-integration-*/coverage-final.json; do
            cp "$file" ".nyc_output/integration-${index}.json"
            index=$((index + 1))
          done
          if [ "$index" -eq 0 ]; then
            echo "No integration coverage artifacts found"
            exit 1
          fi
          pnpm exec nyc merge .nyc_output merged-coverage.json
          mkdir -p final-coverage
          cp merged-coverage.json final-coverage/coverage-final.json
          pnpm exec nyc report --temp-dir final-coverage --reporter=text-summary
          pnpm exec nyc check-coverage --temp-dir final-coverage \
            --lines 93.5 --branches 89 --functions 94.5 --statements 93.5
      - name: Diff coverage (changed lines only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          pip install diff-cover
          pnpm exec nyc report --temp-dir final-coverage --reporter=lcov --report-dir diff-coverage-lcov
          diff-cover diff-coverage-lcov/lcov.info \
            --compare-branch=origin/$BASE_REF \
            --fail-under=80 \
            --markdown-report diff-coverage.md || DIFF_FAILED=1
          if [ -f diff-coverage.md ]; then
            cat diff-coverage.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit ${DIFF_FAILED:-0}

  test-gate:
    name: Unit & Integration Tests
    needs: [test-unit, test-fit-decoder, test-integration, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          for result in \
            "${{ needs.test-unit.result }}" \
            "${{ needs.test-fit-decoder.result }}" \
            "${{ needs.test-integration.result }}" \
            "${{ needs.coverage.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A required job failed or was cancelled"
              exit 1
            fi
          done

  # ── E2E ────────────────────────────────────────────────────────────────

  test-e2e-web:
    name: E2E Tests (Web)
    if: inputs.run_e2e_web
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: dofek-ci-e2e
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free up runner disk space
        # The e2e stack pulls/builds several GB of images (timescaledb-ha,
        # clickhouse, the server build). The default runner has too little free
        # space, causing "no space left on device" while extracting layers.
        # Remove preinstalled toolchains we don't use to reclaim ~30 GB.
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/dotnet /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: ./.github/actions/setup-node-pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: cypress-${{ runner.os }}-
      - run: pnpm exec cypress install
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: |
            image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build E2E images with cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: server
          load: true
          tags: e2e-server:latest
          build-args: DEPENDENCY_CACHE_BUST=${{ hashFiles('package.json', 'pnpm-lock.yaml', 'Dockerfile') }}
          cache-from: |
            type=gha,scope=e2e
          cache-to: type=gha,mode=max,scope=e2e
      - name: Start e2e dependencies
        run: docker compose -f docker-compose.e2e.yml up -d --wait --no-build db clickhouse redis account-erasure-minio redpanda
      - name: Run e2e migrations
        run: |
          docker compose -f docker-compose.e2e.yml up -d --no-build migrate
          exit_code=$(docker wait "$(docker compose -f docker-compose.e2e.yml ps -q migrate)")
          if [ "$exit_code" != "0" ]; then
            exit "$exit_code"
          fi
      - name: Build e2e analytics models
        run: |
          docker compose -f docker-compose.e2e.yml up -d --no-build analytics
          exit_code=$(docker wait "$(docker compose -f docker-compose.e2e.yml ps -q analytics)")
          if [ "$exit_code" != "0" ]; then
            exit "$exit_code"
          fi
      - name: Start e2e server
        run: docker compose -f docker-compose.e2e.yml up -d --wait --no-build --no-deps server
      - run: pnpm e2e:web:run
      - name: Dump e2e service logs
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color db clickhouse redis redpanda migrate seed review-seed-clickhouse analytics server
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
          retention-days: 7
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  # ── Mobile tests ───────────────────────────────────────────────────────

  check-mobile-changes:
    name: Check Mobile Changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - id: check
        env:
          RUN_MOBILE_CHECKS: ${{ inputs.run_mobile_checks }}
        run: |
          if [ "$RUN_MOBILE_CHECKS" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Mobile checks enabled"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Mobile checks disabled by upstream change detection"
          fi

  test-mobile:
    name: Mobile Tests
    needs: check-mobile-changes
    if: needs.check-mobile-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm exec vitest run --project mobile
        env:
          CLICKHOUSE_URL: http://default:health@localhost:8123

  test-swift:
    name: Swift Tests
    needs: check-mobile-changes
    if: needs.check-mobile-changes.outputs.changed == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/mobile/modules/background-refresh/.build
            packages/mobile/modules/core-motion/.build
            packages/mobile/modules/health-kit/.build
          key: swift-build-v1-${{ hashFiles('packages/mobile/modules/background-refresh/Package.swift', 'packages/mobile/modules/core-motion/Package.swift', 'packages/mobile/modules/health-kit/Package.swift') }}
          restore-keys: swift-build-v1-
      - name: Run Background Refresh Swift tests
        working-directory: packages/mobile/modules/background-refresh
        run: swift test
      - name: Run Core Motion Swift tests
        working-directory: packages/mobile/modules/core-motion
        run: swift test
      - name: Run Swift tests with coverage
        run: |
          cd packages/mobile/modules/health-kit
          bash scripts/check-coverage.sh
      - name: Run Watch transfer tests
        run: |
          swift test \
            --package-path packages/mobile/targets/DofekWatch \
            --scratch-path "$RUNNER_TEMP/dofek-watch-transfer-core"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: swift-coverage
          path: packages/mobile/modules/health-kit/.build/debug/codecov/
          retention-days: 7

  # ── Mutation testing ───────────────────────────────────────────────────

  mutation-prep:
    name: Mutation Prep
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.shard.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compute changed files and split into shards
        id: shard
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF_RANGE="${{ github.event.pull_request.base.sha }}...HEAD"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DIFF_RANGE="origin/main...HEAD"
          else
            DIFF_RANGE="HEAD~1...HEAD"
          fi

          CANDIDATES=$(git diff -M -C --diff-filter=AM --name-only $DIFF_RANGE \
            | { grep '\.ts$' || true; } \
            | { grep -v '\.test\.ts$' || true; } \
            | { grep -v '\.cy\.ts$' || true; } \
            | { grep -v 'test-helpers\.ts$' || true; } \
            | { grep -v '^packages/server/src/routers/clickhouse-integration-test-' || true; } \
            | { grep -v '\.d\.ts$' || true; } \
            | { grep -v '\.gen\.ts$' || true; } \
            | { grep -v '\.config\.' || true; } \
            | { grep -v 'drizzle/' || true; } \
            | { grep -v 'src/db/clickhouse-migrations\.ts$' || true; } \
            | { grep -v 'src/db/drizzle-schema\.ts$' || true; } \
            | { grep -v 'src/db/schema/' || true; } \
            | { grep -v 'packages/server/src/types\.ts$' || true; } \
            | { grep -v '^packages/training/src/terminology\.ts$' || true; } \
            | { grep -v 'scripts/' || true; } \
            | { grep -v '^cypress/' || true; } \
            | { grep -v 'packages/mobile/' || true; } \
            | { grep -v '\.storybook/' || true; } \
            | { grep -v '\.stories\.ts$' || true; } \
            | { grep -v '^packages/zepp/app\.ts$' || true; } \
            | { grep -v '^packages/zepp/app-side/' || true; } \
            | { grep -v '^packages/zepp/app-service/' || true; } \
            | { grep -v '^packages/zepp/page/' || true; } \
            | { grep -v '^packages/zepp/setting/' || true; })

          FILE_WEIGHTS=()
          for f in $CANDIDATES; do
            [ ! -f "$f" ] && continue

            UNIT_TEST_BASE="${f%.ts}"
            if [ ! -f "${UNIT_TEST_BASE}.test.ts" ] && [ ! -f "${UNIT_TEST_BASE}.test.tsx" ]; then
              echo "Skipping $f: no colocated Docker-free unit test"
              continue
            fi

            if ! awk '
              /^[[:space:]]*(\/\/|$)/ { next }
              /(^|[[:space:]])(export[[:space:]]+default|export[[:space:]]+(async[[:space:]]+)?function|export[[:space:]]+class|export[[:space:]]+(const|let|var|enum)|((async[[:space:]]+)?function|class|const|let|var|enum)[[:space:]])/ { found=1 }
              END { exit found ? 0 : 1 }
            ' "$f"; then
              echo "Skipping $f: no runtime declarations to mutate"
              continue
            fi

            # Mutate only the lines this PR changed (added/modified), not the
            # whole file. A one-line edit (e.g. wrapping fetch for rate limiting)
            # must not surface a pre-existing file's entire coverage debt. Parse
            # the new-side line ranges from the unified diff hunks and pass them
            # to Stryker as `path:start-end` specs.
            RANGES=$(git diff -U0 $DIFF_RANGE -- "$f" | awk '
              /^@@ / {
                match($0, /\+[0-9]+(,[0-9]+)?/)
                plus = substr($0, RSTART + 1, RLENGTH - 1)
                n = split(plus, parts, ",")
                start = parts[1]
                count = (n > 1 ? parts[2] : 1)
                if (count > 0) print start "-" (start + count - 1)
              }')
            [ -z "$RANGES" ] && continue

            SPEC=""
            WEIGHT=0
            while IFS= read -r range; do
              [ -z "$range" ] && continue
              rstart="${range%-*}"
              rend="${range#*-}"
              WEIGHT=$((WEIGHT + rend - rstart + 1))
              SPEC="${SPEC:+$SPEC,}$f:$range"
            done <<< "$RANGES"

            FILE_WEIGHTS+=("$WEIGHT $SPEC")
          done

          COUNT=${#FILE_WEIGHTS[@]}
          if [ "$COUNT" -eq 0 ]; then
            echo "shards=[]" >> "$GITHUB_OUTPUT"
            echo "No files to mutate"
            exit 0
          fi

          MAX_SHARDS=16
          if [ "$COUNT" -lt "$MAX_SHARDS" ]; then
            SHARD_COUNT="$COUNT"
          else
            SHARD_COUNT="$MAX_SHARDS"
          fi

          SHARD_FILES=()
          SHARD_WEIGHTS=()
          for (( i=0; i<SHARD_COUNT; i++ )); do
            SHARD_FILES[$i]=""
            SHARD_WEIGHTS[$i]=0
          done

          SORTED_FILES=$(printf '%s\n' "${FILE_WEIGHTS[@]}" | sort -rn)
          while IFS= read -r entry; do
            [ -z "$entry" ] && continue
            WEIGHT="${entry%% *}"
            FILE="${entry#* }"
            TARGET=0
            for (( i=1; i<SHARD_COUNT; i++ )); do
              if [ "${SHARD_WEIGHTS[$i]}" -lt "${SHARD_WEIGHTS[$TARGET]}" ]; then
                TARGET="$i"
              fi
            done
            if [ -z "${SHARD_FILES[$TARGET]}" ]; then
              SHARD_FILES[$TARGET]="$FILE"
            else
              SHARD_FILES[$TARGET]="${SHARD_FILES[$TARGET]},$FILE"
            fi
            SHARD_WEIGHTS[$TARGET]=$((SHARD_WEIGHTS[$TARGET] + WEIGHT))
          done <<< "$SORTED_FILES"

          SHARDS="["
          WRITTEN=0
          for (( i=0; i<SHARD_COUNT; i++ )); do
            [ -z "${SHARD_FILES[$i]}" ] && continue
            [ "$WRITTEN" -gt 0 ] && SHARDS="$SHARDS,"
            SHARDS="$SHARDS\"${SHARD_FILES[$i]}\""
            echo "Shard $i (${SHARD_WEIGHTS[$i]} lines): ${SHARD_FILES[$i]}"
            WRITTEN=$((WRITTEN + 1))
          done
          SHARDS="$SHARDS]"

          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "Split $COUNT files into $WRITTEN weighted shards: $SHARDS"

  mutation:
    name: Stryker (${{ strategy.job-index }})
    needs: [mutation-prep, test-fit-decoder]
    if: needs.mutation-prep.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    services:
      postgres:
        image: mirror.gcr.io/timescale/timescaledb-ha:pg18.3-ts2.26.4-all
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: mirror.gcr.io/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      clickhouse:
        image: mirror.gcr.io/clickhouse/clickhouse-server:26.6.1.1193-alpine
        env:
          CLICKHOUSE_DB: fitness
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ${{ github.run_id }}
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --add-host=host.docker.internal:host-gateway
          --health-cmd "clickhouse-client --password ${{ github.run_id }} --query 'SELECT 1'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/test
      CLICKHOUSE_URL: http://default:${{ github.run_id }}@localhost:8123
      REDIS_URL: redis://localhost:6379
    strategy:
      fail-fast: false
      matrix:
        files: ${{ fromJSON(needs.mutation-prep.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - name: Download FIT decoder binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fit-decoder-linux
          path: .build/fit-decoder/bin
      - name: Make FIT decoder executable
        run: chmod +x .build/fit-decoder/bin/dofek-fit-decoder
      - name: Run Stryker
        env:
          MUTATE_FILES: ${{ matrix.files }}
        run: pnpm exec stryker run stryker.ci.config.json --mutate "$MUTATE_FILES"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-report-${{ strategy.job-index }}
          path: reports/mutation/
          retention-days: 7

  mutation-swift:
    name: Swift Mutation Testing
    needs: check-mobile-changes
    runs-on: macos-14
    if: github.event_name == 'pull_request' && needs.check-mobile-changes.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/mobile/modules/health-kit/.build
          key: swift-build-v1-${{ hashFiles('packages/mobile/modules/health-kit/Package.swift') }}
          restore-keys: swift-build-v1-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: muter-cache
        with:
          path: /opt/homebrew/Cellar/muter
          key: muter-v1-${{ runner.os }}-${{ runner.arch }}
      - name: Install Muter
        if: steps.muter-cache.outputs.cache-hit != 'true'
        run: brew install muter-mutation-testing/formulae/muter
      - name: Link Muter from cache
        if: steps.muter-cache.outputs.cache-hit == 'true'
        run: brew link --overwrite muter 2>/dev/null || ln -sf /opt/homebrew/Cellar/muter/*/bin/muter /opt/homebrew/bin/muter
      - name: Get changed Swift files
        id: changed
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD \
            | { grep '\.swift$' || true; } \
            | { grep -v 'Tests/' || true; } \
            | { grep -v 'HealthKitModule.swift' || true; } \
            | { grep -v 'Package.swift' || true; } \
            | sed 's|^packages/mobile/modules/health-kit/||' \
            | tr '\n' ',' \
            | sed 's/,$//')
          echo "files=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Mutating changed Swift files: $CHANGED"
      - name: Run Muter
        if: steps.changed.outputs.files != ''
        working-directory: packages/mobile/modules/health-kit
        timeout-minutes: 30
        run: |
          muter --files-to-mutate "${{ steps.changed.outputs.files }}" || {
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 255 ]; then
              echo "Muter found no mutatable code in changed files — skipping."
              exit 0
            fi
            exit $EXIT_CODE
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: muter-report
          path: packages/mobile/modules/health-kit/muter_logs/
          retention-days: 7

  mutation-gate:
    name: Mutation Testing
    needs: [mutation-prep, mutation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.mutation.result }}" = "failure" ] || [ "${{ needs.mutation.result }}" = "cancelled" ]; then
            echo "Mutation testing failed or was cancelled"
            exit 1
          fi

  migration-lint:
    name: Migration Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - name: Lint new migration SQL
        run: |
          NEW_MIGRATIONS=$(git diff --diff-filter=A --name-only origin/${{ github.base_ref }}...HEAD -- \
            'drizzle/*.sql' ':(exclude)drizzle/_history/*.sql' \
            | grep -v '_baseline' \
            || true)
          if [ -z "$NEW_MIGRATIONS" ]; then
            echo "No new migrations to lint"
            exit 0
          fi
          pnpm tsx scripts/migration-policy.ts $NEW_MIGRATIONS
          pip install squawk-cli
          echo "Linting migrations:"
          echo "$NEW_MIGRATIONS"
          echo "$NEW_MIGRATIONS" | xargs squawk

  # ── Overall test gate ──────────────────────────────────────────────────

  test-all-gate:
    name: Test Gate
    needs: [security-gate, quality-gate, test-gate, test-e2e-web, test-mobile, test-swift, mutation-gate, mutation-swift, migration-lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all test results
        run: |
          for result in \
            "${{ needs.security-gate.result }}" \
            "${{ needs.quality-gate.result }}" \
            "${{ needs.test-gate.result }}" \
            "${{ needs.test-e2e-web.result }}" \
            "${{ needs.test-mobile.result }}" \
            "${{ needs.test-swift.result }}" \
            "${{ needs.mutation-gate.result }}" \
            "${{ needs.mutation-swift.result }}" \
            "${{ needs.migration-lint.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "Test gate failed"
              exit 1
            fi
          done
