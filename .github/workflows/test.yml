name: Reusable / Test

on:
  workflow_call:
    inputs:
      repository_result:
        description: Result of the repository check lane.
        required: true
        type: string
      shared_result:
        description: Result of the shared check lane.
        required: true
        type: string
      server_result:
        description: Result of the server check lane.
        required: true
        type: string
      mobile_result:
        description: Result of the mobile check lane.
        required: true
        type: string
      image_scan_selected:
        description: Whether the server image scan was selected.
        required: true
        type: boolean
      e2e_selected:
        description: Whether web E2E tests were selected.
        required: true
        type: boolean
      shared_selected:
        description: Whether shared checks were selected.
        required: false
        type: boolean
        default: false
      server_selected:
        description: Whether server checks were selected.
        required: false
        type: boolean
        default: false
      mobile_selected:
        description: Whether mobile checks were selected.
        required: false
        type: boolean
        default: false

jobs:
  # ── Reporting jobs ─────────────────────────────────────────────────────
  #
  # These forward the independent lane results under the existing protected
  # check names. They never rerun tests. A selected prerequisite must report
  # success; an unselected lane reports not applicable.

  security-gate:
    name: Security & Dependencies
    runs-on: ubuntu-latest
    env:
      REPOSITORY_RESULT: ${{ inputs.repository_result }}
      SERVER_RESULT: ${{ inputs.server_result }}
      IMAGE_SCAN_SELECTED: ${{ inputs.image_scan_selected }}
    steps:
      - name: Check results
        run: |
          fail=0
          if [ "$REPOSITORY_RESULT" != "success" ]; then
            echo "::error::Repository safety checks did not succeed ($REPOSITORY_RESULT)"
            fail=1
          fi
          if [ "$IMAGE_SCAN_SELECTED" = "true" ] && [ "$SERVER_RESULT" != "success" ]; then
            echo "::error::Server lane with the selected image scan did not succeed ($SERVER_RESULT)"
            fail=1
          fi
          exit "$fail"

  quality-gate:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    env:
      REPOSITORY_RESULT: ${{ inputs.repository_result }}
      SHARED_RESULT: ${{ inputs.shared_result }}
      SHARED_SELECTED: ${{ inputs.shared_selected }}
      SERVER_RESULT: ${{ inputs.server_result }}
      SERVER_SELECTED: ${{ inputs.server_selected }}
      MOBILE_RESULT: ${{ inputs.mobile_result }}
      MOBILE_SELECTED: ${{ inputs.mobile_selected }}
    steps:
      - name: Check results
        run: |
          fail=0
          if [ "$REPOSITORY_RESULT" != "success" ]; then
            echo "::error::Repository lint checks did not succeed ($REPOSITORY_RESULT)"
            fail=1
          fi
          if [ "$SHARED_SELECTED" = "true" ] && [ "$SHARED_RESULT" != "success" ]; then
            echo "::error::Shared lint checks did not succeed ($SHARED_RESULT)"
            fail=1
          fi
          if [ "$SERVER_SELECTED" = "true" ] && [ "$SERVER_RESULT" != "success" ]; then
            echo "::error::Server lint checks did not succeed ($SERVER_RESULT)"
            fail=1
          fi
          if [ "$MOBILE_SELECTED" = "true" ] && [ "$MOBILE_RESULT" != "success" ]; then
            echo "::error::Mobile lint checks did not succeed ($MOBILE_RESULT)"
            fail=1
          fi
          exit "$fail"

  test-gate:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    env:
      SHARED_RESULT: ${{ inputs.shared_result }}
      SHARED_SELECTED: ${{ inputs.shared_selected }}
      SERVER_RESULT: ${{ inputs.server_result }}
      SERVER_SELECTED: ${{ inputs.server_selected }}
    steps:
      - name: Check results
        run: |
          fail=0
          if [ "$SHARED_SELECTED" = "true" ] && [ "$SHARED_RESULT" != "success" ]; then
            echo "::error::Shared unit tests did not succeed ($SHARED_RESULT)"
            fail=1
          fi
          if [ "$SERVER_SELECTED" = "true" ] && [ "$SERVER_RESULT" != "success" ]; then
            echo "::error::Server unit and integration tests did not succeed ($SERVER_RESULT)"
            fail=1
          fi
          if [ "$SERVER_SELECTED" != "true" ]; then
            echo "Server unit and integration tests were not selected"
          fi
          exit "$fail"

  test-e2e-web:
    name: E2E Tests (Web)
    runs-on: ubuntu-latest
    env:
      SERVER_RESULT: ${{ inputs.server_result }}
      E2E_SELECTED: ${{ inputs.e2e_selected }}
    steps:
      - name: Check results
        run: |
          fail=0
          if [ "$E2E_SELECTED" != "true" ]; then
            echo "Web E2E tests were not selected"
          elif [ "$SERVER_RESULT" != "success" ]; then
            echo "::error::Server lane with the selected web E2E tests did not succeed ($SERVER_RESULT)"
            fail=1
          fi
          exit "$fail"

  mutation-gate:
    name: Mutation Testing
    runs-on: ubuntu-latest
    env:
      SHARED_RESULT: ${{ inputs.shared_result }}
      SHARED_SELECTED: ${{ inputs.shared_selected }}
      SERVER_RESULT: ${{ inputs.server_result }}
      SERVER_SELECTED: ${{ inputs.server_selected }}
      MOBILE_RESULT: ${{ inputs.mobile_result }}
      MOBILE_SELECTED: ${{ inputs.mobile_selected }}
    steps:
      - name: Check results
        run: |
          fail=0
          if [ "$SHARED_SELECTED" = "true" ] && [ "$SHARED_RESULT" != "success" ]; then
            echo "::error::Shared mutation testing did not succeed ($SHARED_RESULT)"
            fail=1
          fi
          if [ "$SERVER_SELECTED" = "true" ] && [ "$SERVER_RESULT" != "success" ]; then
            echo "::error::TypeScript mutation testing did not succeed ($SERVER_RESULT)"
            fail=1
          fi
          if [ "$MOBILE_SELECTED" = "true" ] && [ "$MOBILE_RESULT" != "success" ]; then
            echo "::error::Native mutation testing did not succeed ($MOBILE_RESULT)"
            fail=1
          fi
          exit "$fail"

  # ── Overall test gate ──────────────────────────────────────────────────

  test-all-gate:
    name: Test Gate
    needs: [security-gate, quality-gate, test-gate, test-e2e-web, mutation-gate]
    if: always()
    runs-on: ubuntu-latest
    env:
      REPOSITORY_RESULT: ${{ inputs.repository_result }}
      SHARED_RESULT: ${{ inputs.shared_result }}
      SHARED_SELECTED: ${{ inputs.shared_selected }}
      SERVER_RESULT: ${{ inputs.server_result }}
      SERVER_SELECTED: ${{ inputs.server_selected }}
      MOBILE_RESULT: ${{ inputs.mobile_result }}
      MOBILE_SELECTED: ${{ inputs.mobile_selected }}
    steps:
      - name: Check all test results
        run: |
          fail=0
          require_success() {
            name="$1"
            result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::$name did not succeed ($result)"
              fail=1
            fi
          }

          require_success security-gate "${{ needs.security-gate.result }}"
          require_success quality-gate "${{ needs.quality-gate.result }}"
          require_success test-gate "${{ needs.test-gate.result }}"
          require_success test-e2e-web "${{ needs.test-e2e-web.result }}"
          require_success mutation-gate "${{ needs.mutation-gate.result }}"

          require_success repository "$REPOSITORY_RESULT"
          if [ "$SHARED_SELECTED" = "true" ]; then
            require_success shared "$SHARED_RESULT"
          fi
          if [ "$SERVER_SELECTED" = "true" ]; then
            require_success server "$SERVER_RESULT"
          fi
          if [ "$MOBILE_SELECTED" = "true" ]; then
            require_success mobile "$MOBILE_RESULT"
          fi

          exit "$fail"
