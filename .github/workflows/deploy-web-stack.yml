name: Deploy Web Stack

on:
  workflow_call:
    inputs:
      commit_sha:
        description: "Commit SHA to deploy (used to compute image tag if image_tag not provided)"
        required: false
        type: string
      image_tag:
        description: "Docker image tag to deploy directly (e.g. sha-abc1234)"
        required: false
        type: string
      server_host:
        description: "Docker SSH host (defaults to ORACLE_SERVER_HOST variable)"
        required: false
        type: string
      ssh_user:
        description: "SSH user for the remote Docker context"
        required: false
        type: string
        default: ubuntu
      stack_override:
        description: "Optional extra compose override appended to the stack deploy (e.g. deploy/stack.oracle.yml)"
        required: false
        type: string
        default: ""
      infisical_environment:
        description: "Infisical environment to export for the stack"
        required: false
        type: string
        default: prod
      stack_name:
        description: "Docker stack name"
        required: false
        type: string
        default: dofek
      public_url:
        description: "Public app URL"
        required: false
        type: string
        default: https://dofek.asherlc.com
      web_host_rule:
        description: "Traefik Host() rule for the app router"
        required: false
        type: string
        default: ""
      ota_base_url:
        description: "Public OTA base URL"
        required: false
        type: string
        default: https://ota.dofek.asherlc.com
      ota_host_rule:
        description: "Traefik Host() rule for OTA"
        required: false
        type: string
        default: ""
      portainer_host_rule:
        description: "Traefik Host() rule for Portainer"
        required: false
        type: string
        default: ""
      netdata_host_rule:
        description: "Traefik Host() rule for Netdata"
        required: false
        type: string
        default: ""
      databasus_host_rule:
        description: "Traefik Host() rule for Databasus"
        required: false
        type: string
        default: ""
      cloudbeaver_host_rule:
        description: "Traefik Host() rule for CloudBeaver"
        required: false
        type: string
        default: ""
      pgadmin_host_rule:
        description: "Traefik Host() rule for pgAdmin"
        required: false
        type: string
        default: ""
      peerdb_public_url:
        description: "Public PeerDB UI URL"
        required: false
        type: string
        default: https://peerdb.dofek.asherlc.com
      peerdb_host_rule:
        description: "Traefik Host() rule for PeerDB UI"
        required: false
        type: string
        default: ""
      dispatching_run_id:
        description: "Run ID of the workflow run that dispatched this workflow"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag (e.g. sha-abc1234). Defaults to latest."
        required: false
        default: "latest"
        type: string
      server_host:
        description: "Docker SSH host (defaults to ORACLE_SERVER_HOST variable)"
        required: false
        type: string
      ssh_user:
        description: "SSH user for the remote Docker context"
        required: false
        type: string
        default: ubuntu
      stack_override:
        description: "Optional extra compose override appended to the stack deploy (e.g. deploy/stack.oracle.yml)"
        required: false
        type: string
        default: ""
      infisical_environment:
        description: "Infisical environment to export for the stack"
        required: false
        default: prod
        type: string
      stack_name:
        description: "Docker stack name"
        required: false
        default: dofek
        type: string

concurrency:
  # Key on the target host so deploys to different hosts (production vs staging) run in
  # parallel, while concurrent deploys to the same host still serialize.
  group: deploy-web-stack-${{ inputs.stack_name || 'dofek' }}-${{ inputs.server_host != '' && inputs.server_host || vars.ORACLE_SERVER_HOST }}
  cancel-in-progress: false

jobs:
  web-stack:
    name: Deploy Web Stack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    env:
      SSH_USER: ${{ inputs.ssh_user != '' && inputs.ssh_user || 'ubuntu' }}
      DOCKER_HOST: ssh://${{ inputs.ssh_user != '' && inputs.ssh_user || 'ubuntu' }}@${{ inputs.server_host != '' && inputs.server_host || vars.ORACLE_SERVER_HOST }}
      DOCKER_SSH_COMMAND: ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10
      DEPLOY_ENVIRONMENT: ${{ inputs.infisical_environment || 'prod' }}
      STACK_NAME: ${{ inputs.stack_name || 'dofek' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Resolve image tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          INPUT_SHA: ${{ inputs.commit_sha }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ -n "$INPUT_SHA" ]; then
            TAG="sha-$(echo "$INPUT_SHA" | head -c 7)"
          else
            echo "::error::Either image_tag or commit_sha must be provided"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        uses: ./.github/actions/setup-ssh-host
        with:
          host: ${{ inputs.server_host != '' && inputs.server_host || vars.ORACLE_SERVER_HOST }}
          private_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Export Infisical deploy secrets file via OIDC
        uses: ./.github/actions/export-infisical-dotenv
        with:
          env: ${{ inputs.infisical_environment || 'prod' }}
          template: .github/templates/infisical-dotenv.tmpl
          output_path: ${{ github.workspace }}/.env.${{ inputs.infisical_environment || 'prod' }}

      - name: Export deploy env for stack interpolation
        env:
          INFISICAL_ENV_FILE_PATH: ${{ github.workspace }}/.env.${{ inputs.infisical_environment || 'prod' }}
          PUBLIC_URL_INPUT: ${{ inputs.public_url || 'https://dofek.asherlc.com' }}
          WEB_HOST_RULE_INPUT: ${{ inputs.web_host_rule }}
          OTA_BASE_URL_INPUT: ${{ inputs.ota_base_url || 'https://ota.dofek.asherlc.com' }}
          OTA_HOST_RULE_INPUT: ${{ inputs.ota_host_rule }}
          PORTAINER_HOST_RULE_INPUT: ${{ inputs.portainer_host_rule }}
          NETDATA_HOST_RULE_INPUT: ${{ inputs.netdata_host_rule }}
          DATABASUS_HOST_RULE_INPUT: ${{ inputs.databasus_host_rule }}
          CLOUDBEAVER_HOST_RULE_INPUT: ${{ inputs.cloudbeaver_host_rule }}
          PGADMIN_HOST_RULE_INPUT: ${{ inputs.pgadmin_host_rule }}
          PEERDB_PUBLIC_URL_INPUT: ${{ inputs.peerdb_public_url || 'https://peerdb.dofek.asherlc.com' }}
          PEERDB_HOST_RULE_INPUT: ${{ inputs.peerdb_host_rule }}
          STACK_OVERRIDE_INPUT: ${{ inputs.stack_override }}
        run: |
          STACK_FILE_FLAGS="-c deploy/stack.yml"

          # Optional caller-supplied override (e.g. deploy/stack.oracle.yml for
          # the Always Free OCI host, which scales operator UIs to zero).
          if [ -n "$STACK_OVERRIDE_INPUT" ]; then
            test -f "$STACK_OVERRIDE_INPUT" || { echo "::error::stack_override file not found: $STACK_OVERRIDE_INPUT"; exit 1; }
            STACK_FILE_FLAGS="$STACK_FILE_FLAGS -c $STACK_OVERRIDE_INPUT"
          fi

          {
            echo "INFISICAL_ENV_FILE=$INFISICAL_ENV_FILE_PATH"
            echo "DEPLOY_ENVIRONMENT=$DEPLOY_ENVIRONMENT"
            echo "STACK_NAME=$STACK_NAME"
            echo "PUBLIC_URL=$PUBLIC_URL_INPUT"
            echo "OTA_BASE_URL=$OTA_BASE_URL_INPUT"
            echo "PEERDB_PUBLIC_URL=$PEERDB_PUBLIC_URL_INPUT"
            echo "STACK_FILE_FLAGS=$STACK_FILE_FLAGS"
          } >> "$GITHUB_ENV"

          write_multiline_env() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              return 0
            fi
            {
              echo "${name}<<EOF"
              echo "$value"
              echo "EOF"
            } >> "$GITHUB_ENV"
          }

          write_multiline_env WEB_HOST_RULE "$WEB_HOST_RULE_INPUT"
          write_multiline_env OTA_HOST_RULE "$OTA_HOST_RULE_INPUT"
          write_multiline_env PORTAINER_HOST_RULE "$PORTAINER_HOST_RULE_INPUT"
          write_multiline_env NETDATA_HOST_RULE "$NETDATA_HOST_RULE_INPUT"
          write_multiline_env DATABASUS_HOST_RULE "$DATABASUS_HOST_RULE_INPUT"
          write_multiline_env CLOUDBEAVER_HOST_RULE "$CLOUDBEAVER_HOST_RULE_INPUT"
          write_multiline_env PGADMIN_HOST_RULE "$PGADMIN_HOST_RULE_INPUT"
          write_multiline_env PEERDB_HOST_RULE "$PEERDB_HOST_RULE_INPUT"

      - name: Create dotenv command runner
        run: |
          cat > "$RUNNER_TEMP/run-with-dotenv-env.mjs" <<'NODE'
          import { readFileSync } from "node:fs";
          import { spawnSync } from "node:child_process";

          const dotenvPath = process.env.INFISICAL_ENV_FILE;
          if (!dotenvPath) {
            console.error("::error::INFISICAL_ENV_FILE is required");
            process.exit(1);
          }

          const command = process.argv[2];
          const args = process.argv.slice(3);
          if (!command) {
            console.error("::error::Command is required");
            process.exit(1);
          }

          const childEnv = { ...process.env };
          for (const line of readFileSync(dotenvPath, "utf8").split(/\r?\n/)) {
            if (!line || line.startsWith("#")) {
              continue;
            }
            const separatorIndex = line.indexOf("=");
            if (separatorIndex <= 0) {
              continue;
            }
            childEnv[line.slice(0, separatorIndex)] = line.slice(separatorIndex + 1);
          }

          const result = spawnSync(command, args, {
            env: childEnv,
            stdio: "inherit",
          });
          if (result.error) {
            console.error(`::error::${result.error.message}`);
            process.exit(1);
          }
          process.exit(result.status ?? 1);
          NODE

      - name: Export encoded ClickHouse password
        run: |
          encoded_clickhouse_password="$(
            node "$RUNNER_TEMP/run-with-dotenv-env.mjs" node -e 'const password = process.env.CLICKHOUSE_PASSWORD; if (!password) { throw new Error("CLICKHOUSE_PASSWORD is required"); } process.stdout.write(encodeURIComponent(password));'
          )"
          echo "CLICKHOUSE_PASSWORD_ENCODED=$encoded_clickhouse_password" >> "$GITHUB_ENV"

      - name: Validate rendered stack files
        run: |
          node "$RUNNER_TEMP/run-with-dotenv-env.mjs" \
            docker stack config $STACK_FILE_FLAGS >/dev/null

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Reclaim Docker root disk headroom
        run: |
          df -h /
          docker system df || true
          minimum_kb=$((8 * 1024 * 1024))
          available_kb="$(df --output=avail -k / | tail -n 1 | tr -d ' ')"
          if [ "$available_kb" -lt "$minimum_kb" ]; then
            docker system prune --all --force
          else
            echo "Root filesystem already has at least 8 GiB free; skipping Docker prune."
          fi
          df -h /
          available_kb="$(df --output=avail -k / | tail -n 1 | tr -d ' ')"
          if [ "$available_kb" -lt "$minimum_kb" ]; then
            echo "::error::Root filesystem has less than 8 GiB free after Docker cleanup; aborting before image pulls."
            exit 1
          fi

      - name: Pull deploy images
        env:
          IMAGE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          echo "Starting deploy with IMAGE_TAG=${IMAGE_TAG}"
          docker pull "ghcr.io/asherlc/dofek:${IMAGE_TAG}"

          server_host="${DOCKER_HOST#ssh://${SSH_USER}@}"
          if [ -z "$server_host" ] || [ "$server_host" = "$DOCKER_HOST" ]; then
            echo "::error::Unable to derive SSH host from DOCKER_HOST"
            exit 1
          fi

          ssh -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "${SSH_USER}@${server_host}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          pull_if_missing() {
            image="$1"
            if docker image inspect "$image" >/dev/null 2>&1; then
              echo "Image already present: $image"
              return 0
            fi
            docker pull "$image"
          }
          pull_if_missing "timescale/timescaledb-ha:pg18.3-ts2.26.4-all"
          pull_if_missing "postgres:18-alpine"
          pull_if_missing "ghcr.io/peerdb-io/peerdb-server:stable-v0.36.19"
          pull_if_missing "ghcr.io/peerdb-io/flow-api:stable-v0.36.19"
          pull_if_missing "ghcr.io/peerdb-io/flow-snapshot-worker:stable-v0.36.19"
          pull_if_missing "ghcr.io/peerdb-io/flow-worker:stable-v0.36.19"
          pull_if_missing "ghcr.io/peerdb-io/peerdb-ui:stable-v0.36.19"
          pull_if_missing "temporalio/auto-setup:1.29"
          pull_if_missing "temporalio/admin-tools:1.29"
          pull_if_missing "minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e"
          pull_if_missing "dbeaver/cloudbeaver:26.0.3@sha256:3daa6269a49198363af3f0fcd8af58def9a32fa38152b9ab37854dc80c16a4a4"
          REMOTE

      - name: Validate host bind mount paths
        run: |
          server_host="${DOCKER_HOST#ssh://${SSH_USER}@}"
          if [ -z "$server_host" ] || [ "$server_host" = "$DOCKER_HOST" ]; then
            echo "::error::Unable to derive SSH host from DOCKER_HOST"
            exit 1
          fi

          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "${SSH_USER}@${server_host}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          for path in /mnt/dofek-data/postgres /mnt/dofek-data/clickhouse /mnt/dofek-data/redpanda /mnt/dofek-data/databasus /mnt/dofek-data/cloudbeaver /mnt/dofek-data/redis /mnt/dofek-data/peerdb-catalog /mnt/dofek-data/peerdb-minio; do
            if [ ! -d "$path" ]; then
              echo "::error::Required host bind mount path is missing: $path"
              exit 1
            fi
          done
          REMOTE

      - name: Wait for Postgres writable
        run: |
          for attempt in $(seq 1 36); do
            recovery_output=$(timeout 15s docker run --rm --network "${STACK_NAME}_default" \
              --env-file "$INFISICAL_ENV_FILE" \
              postgres:18-alpine sh -euc \
              "PGPASSWORD=\"\$POSTGRES_PASSWORD\" \
              psql --host=db --username=health --dbname=health --no-align --tuples-only --quiet \
              --command \"SELECT CASE WHEN pg_is_in_recovery() THEN 'recovery' ELSE 'writable' END;\"" 2>&1 || true)
            recovery_state="$(printf '%s\n' "$recovery_output" | tail -n 1 | tr -d '[:space:]')"
            if [ "$recovery_state" = "writable" ]; then
              echo "Postgres is writable."
              break
            fi
            if [ "$attempt" -eq 36 ]; then
              echo "::error::Postgres did not become writable within 180s"
              exit 1
            fi
            echo "Postgres readiness attempt ${attempt}/36: retrying in 5s..."
            sleep 5
          done

      - name: Wait for ClickHouse
        run: |
          for attempt in $(seq 1 36); do
            clickhouse_output=$(timeout 15s docker run --rm --network "${STACK_NAME}_default" \
              postgres:18-alpine sh -euc \
              "wget -qO- http://clickhouse:8123/ping" 2>&1 || true)
            if [ "$clickhouse_output" = "Ok." ]; then
              echo "ClickHouse is reachable."
              break
            fi
            if [ "$attempt" -eq 36 ]; then
              echo "::error::ClickHouse did not become reachable within 180s"
              exit 1
            fi
            echo "ClickHouse readiness attempt ${attempt}/36: retrying in 5s..."
            sleep 5
          done

      - name: Run migrations
        env:
          IMAGE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          migration_container="${STACK_NAME}_migrate_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          cleanup_migration_container() {
            timeout 60s docker rm -f "$migration_container" >/dev/null 2>&1 || true
          }
          trap cleanup_migration_container EXIT

          echo "Starting migration container ${migration_container}..."
          cleanup_migration_container
          # Heavy data migrations can legitimately run for hours on prod. Use a
          # detached container and short status polls so one long-lived
          # Docker-over-SSH wait cannot drop while ClickHouse is busy.
          migration_timeout_seconds=14400
          migration_started_at="$(date +%s)"
          docker run -d --name "$migration_container" --network "${STACK_NAME}_default" \
            --env-file "$INFISICAL_ENV_FILE" \
            --env "CLICKHOUSE_PASSWORD_ENCODED=$CLICKHOUSE_PASSWORD_ENCODED" \
            --entrypoint sh \
            "ghcr.io/asherlc/dofek:${IMAGE_TAG}" \
            -euc 'export DATABASE_URL="postgres://health:${POSTGRES_PASSWORD}@db:5432/health"; export CLICKHOUSE_URL="http://default:${CLICKHOUSE_PASSWORD_ENCODED}@clickhouse:8123"; exec node --experimental-transform-types --enable-source-maps --disable-warning=ExperimentalWarning src/db/run-migrate.ts'

          inspect_failure_count=0
          max_inspect_failures=10
          while true; do
            elapsed_seconds="$(($(date +%s) - migration_started_at))"
            if [ "$elapsed_seconds" -ge "$migration_timeout_seconds" ]; then
              echo "::error::Migration exceeded ${migration_timeout_seconds}s"
              docker logs "$migration_container" || true
              cleanup_migration_container
              exit 1
            fi

            set +e
            inspect_output="$(docker inspect --format '{{.State.Status}} {{.State.ExitCode}}' "$migration_container" 2>&1)"
            inspect_status=$?
            set -e
            if [ "$inspect_status" -ne 0 ]; then
              inspect_failure_count="$((inspect_failure_count + 1))"
              if [ "$inspect_failure_count" -ge "$max_inspect_failures" ]; then
                echo "::error::Could not inspect migration container after ${inspect_failure_count} attempts"
                printf '%s\n' "$inspect_output"
                docker logs "$migration_container" || true
                cleanup_migration_container
                exit "$inspect_status"
              fi
              echo "Migration container inspect attempt ${inspect_failure_count}/${max_inspect_failures} failed after ${elapsed_seconds}s; retrying..."
              printf '%s\n' "$inspect_output"
              sleep 15
              continue
            fi
            inspect_failure_count=0
            migration_state="$(printf '%s\n' "$inspect_output" | awk '{print $1}')"
            migration_status="$(printf '%s\n' "$inspect_output" | awk '{print $2}')"
            if [ "$migration_state" = "exited" ] || [ "$migration_state" = "dead" ]; then
              break
            fi

            echo "Migration container ${migration_container} is ${migration_state} after ${elapsed_seconds}s..."
            sleep 60
          done

          docker logs "$migration_container" || true
          trap - EXIT
          if [ "$migration_status" -ne 0 ]; then
            cleanup_migration_container
            echo "::error::Migration failed"
            exit "$migration_status"
          fi
          cleanup_migration_container
          echo "Migration succeeded."

      - name: Deploy stack
        id: deploy_stack
        env:
          IMAGE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set +e
          timeout 20m node "$RUNNER_TEMP/run-with-dotenv-env.mjs" docker stack deploy $STACK_FILE_FLAGS --with-registry-auth --prune --detach=true "$STACK_NAME"
          status=$?
          set -e
          if [ "$status" -eq 124 ]; then
            echo "::error::docker stack deploy exceeded 20m"
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

          wait_deadline_seconds=$((SECONDS + 1200))
          for service in web worker analytics-worker clickhouse; do
            service_name="${STACK_NAME}_${service}"
            while true; do
              update_state="$(
                docker service inspect "$service_name" \
                  --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{end}}'
              )"
              image="$(
                docker service inspect "$service_name" \
                  --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}'
              )"
              desired_replicas="$(
                docker service inspect "$service_name" \
                  --format '{{if .Spec.Mode.Replicated}}{{.Spec.Mode.Replicated.Replicas}}{{end}}'
              )"
              replicas="$(
                docker service ls --filter "name=${service_name}" --format '{{.Replicas}}'
              )"
              echo "${service_name} image=${image} replicas=${replicas} update_state=${update_state:-none}"
              case "$update_state" in
                rollback_*)
                  docker service ps "$service_name" --no-trunc
                  echo "::error::${service_name} did not finish deployment cleanly; update_state=${update_state}"
                  exit 1
                  ;;
                paused)
                  running="${replicas%%/*}"
                  if [ "$running" -eq 0 ]; then
                    docker service ps "$service_name" --no-trunc
                    echo "::error::${service_name} update is paused with no running tasks"
                    exit 1
                  fi
                  echo "::warning::${service_name} update is paused but has running tasks; continuing"
                  ;;
              esac
              if [ "$replicas" = "${desired_replicas}/${desired_replicas}" ] && {
                [ -z "$update_state" ] || [ "$update_state" = "completed" ]
              }; then
                break
              fi
              if [ "$SECONDS" -ge "$wait_deadline_seconds" ]; then
                docker service ps "$service_name" --no-trunc
                echo "::error::${service_name} did not converge before timeout"
                exit 124
              fi
              sleep 10
            done
          done

      - name: Prune obsolete images post-deploy
        if: ${{ steps.deploy_stack.outcome == 'success' }}
        run: docker image prune -af

      - name: Report Docker disk usage post-prune
        if: ${{ steps.deploy_stack.outcome == 'success' }}
        run: docker system df

      - name: Wait for Postgres writable after stack deploy
        run: |
          readiness_attempts=36
          command_timeout_seconds=15
          retry_sleep_seconds=5
          readiness_timeout_seconds=$((readiness_attempts * command_timeout_seconds + (readiness_attempts - 1) * retry_sleep_seconds))
          for attempt in $(seq 1 "$readiness_attempts"); do
            recovery_output=$(timeout "${command_timeout_seconds}s" docker run --rm --network "${STACK_NAME}_default" \
              --env-file "$INFISICAL_ENV_FILE" \
              postgres:18-alpine sh -euc \
              "PGPASSWORD=\"\$POSTGRES_PASSWORD\" \
              psql --host=db --username=health --dbname=health --no-align --tuples-only --quiet \
              --command \"SELECT CASE WHEN pg_is_in_recovery() THEN 'recovery' ELSE 'writable' END;\"" 2>&1 || true)
            recovery_state="$(printf '%s\n' "$recovery_output" | tail -n 1 | tr -d '[:space:]')"
            if [ "$recovery_state" = "writable" ]; then
              echo "Postgres is writable after stack deploy."
              break
            fi
            if [ "$attempt" -eq "$readiness_attempts" ]; then
              echo "::error::Postgres did not become writable within ${readiness_timeout_seconds}s after stack deploy"
              exit 1
            fi
            echo "Postgres post-stack readiness attempt ${attempt}/${readiness_attempts}: retrying in ${retry_sleep_seconds}s..."
            sleep "$retry_sleep_seconds"
          done

      - name: Wait for ClickHouse after stack deploy
        run: |
          readiness_attempts=36
          command_timeout_seconds=15
          retry_sleep_seconds=5
          readiness_timeout_seconds=$((readiness_attempts * command_timeout_seconds + (readiness_attempts - 1) * retry_sleep_seconds))
          for attempt in $(seq 1 "$readiness_attempts"); do
            clickhouse_output=$(timeout "${command_timeout_seconds}s" docker run --rm --network "${STACK_NAME}_default" \
              postgres:18-alpine sh -euc \
              "wget -qO- http://clickhouse:8123/ping" 2>&1 || true)
            if [ "$clickhouse_output" = "Ok." ]; then
              echo "ClickHouse is reachable after stack deploy."
              break
            fi
            if [ "$attempt" -eq "$readiness_attempts" ]; then
              echo "::error::ClickHouse did not become reachable within ${readiness_timeout_seconds}s after stack deploy"
              exit 1
            fi
            echo "ClickHouse post-stack readiness attempt ${attempt}/${readiness_attempts}: retrying in ${retry_sleep_seconds}s..."
            sleep "$retry_sleep_seconds"
          done

      - name: Wait for PeerDB
        run: |
          for attempt in $(seq 1 36); do
            peerdb_output=$(timeout 15s docker run --rm --network "${STACK_NAME}_default" \
              --env-file "$INFISICAL_ENV_FILE" \
              postgres:18-alpine sh -euc \
              "PGPASSWORD=\"\$POSTGRES_PASSWORD\" \
              psql --host=peerdb --port=9900 --username=peerdb --dbname=peerdb --no-align --tuples-only --quiet \
              --command \"SELECT 1;\"" 2>&1 || true)
            peerdb_state="$(printf '%s\n' "$peerdb_output" | tail -n 1 | tr -d '[:space:]')"
            if [ "$peerdb_state" = "1" ]; then
              echo "PeerDB is reachable."
              break
            fi
            if [ "$attempt" -eq 36 ]; then
              echo "::error::PeerDB did not become reachable within 180s"
              printf '%s\n' "$peerdb_output"
              exit 1
            fi
            echo "PeerDB readiness attempt ${attempt}/36: retrying in 5s..."
            sleep 5
          done

      - name: Wait for Temporal
        run: |
          dump_temporal_diagnostics() {
            echo "::group::Temporal service state"
            docker service ps "${STACK_NAME}_peerdb-temporal" --no-trunc || true
            echo "::endgroup::"

            echo "::group::PeerDB catalog service state"
            docker service ps "${STACK_NAME}_peerdb-catalog" --no-trunc || true
            echo "::endgroup::"

            echo "::group::Recent Temporal logs"
            timeout 30s docker service logs --raw --timestamps --tail 200 "${STACK_NAME}_peerdb-temporal" 2>&1 || true
            echo "::endgroup::"

            echo "::group::Recent PeerDB catalog logs"
            timeout 30s docker service logs --raw --timestamps --tail 120 "${STACK_NAME}_peerdb-catalog" 2>&1 || true
            echo "::endgroup::"
          }

          deadline=$((SECONDS + 180))
          attempt=0
          temporal_output=""
          while :; do
            attempt=$((attempt + 1))
            remaining=$((deadline - SECONDS))
            if [ "$remaining" -le 0 ]; then
              echo "::error::Temporal frontend did not become reachable within 180s"
              printf '%s\n' "$temporal_output"
              dump_temporal_diagnostics
              exit 1
            fi
            per_attempt_timeout=10
            if [ "$per_attempt_timeout" -gt "$remaining" ]; then
              per_attempt_timeout="$remaining"
            fi
            if temporal_output=$(timeout "${per_attempt_timeout}s" docker run --rm --network "${STACK_NAME}_default" \
              --entrypoint temporal \
              temporalio/admin-tools:1.29 \
              --address peerdb-temporal:7233 --namespace default --color never \
              operator cluster health 2>&1); then
              echo "Temporal frontend is reachable after ${attempt} attempt(s)."
              break
            fi
            echo "Temporal readiness attempt ${attempt} failed; ${remaining}s remaining, sleeping 5s..."
            sleep 5
          done

      - name: Ensure PeerDB Temporal search attributes
        run: |
          temporal_args=(
            --address peerdb-temporal:7233
            --namespace default
            --color never
          )

          search_attributes="$(
            timeout 120s docker run --rm --network "${STACK_NAME}_default" \
              --entrypoint temporal \
              temporalio/admin-tools:1.29 \
              "${temporal_args[@]}" operator search-attribute list
          )"

          if printf '%s\n' "$search_attributes" | grep -qw "MirrorName"; then
            echo "Temporal search attribute MirrorName already exists."
            exit 0
          fi

          timeout 120s docker run --rm --network "${STACK_NAME}_default" \
            --entrypoint temporal \
            temporalio/admin-tools:1.29 \
            "${temporal_args[@]}" operator search-attribute create \
              --name MirrorName \
              --type Text

      - name: Configure ClickHouse CDC
        env:
          IMAGE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          docker run --rm --network "${STACK_NAME}_default" \
            --env-file "$INFISICAL_ENV_FILE" \
            --env "CLICKHOUSE_PASSWORD_ENCODED=$CLICKHOUSE_PASSWORD_ENCODED" \
            --entrypoint sh \
            "ghcr.io/asherlc/dofek:${IMAGE_TAG}" \
            -euc 'export DATABASE_URL="postgres://health:${POSTGRES_PASSWORD}@db:5432/health"; export CLICKHOUSE_URL="http://default:${CLICKHOUSE_PASSWORD_ENCODED}@clickhouse:8123"; exec node --experimental-transform-types --enable-source-maps --disable-warning=ExperimentalWarning src/db/setup-clickhouse-cdc.ts'

      - uses: ./.github/actions/append-dispatcher-run-summary
        if: always()
        with:
          dispatching_run_id: ${{ inputs.dispatching_run_id != '' && inputs.dispatching_run_id || github.event.workflow_run.id }}
