name: Build private OTA image
description: Test the OTA image and optionally publish it for a main release.
inputs:
  commit_sha:
    description: Full source SHA to build.
    required: true
  publish:
    description: Publish the runtime image on the protected main release path.
    required: true
runs:
  using: composite
  steps:
    - name: Check out Dofek
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.commit_sha }}
        persist-credentials: false
    - name: Validate exact build source
      id: source
      shell: bash
      env:
        EXPECTED_SHA: ${{ inputs.commit_sha }}
      run: |
        set -euo pipefail
        if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::commit_sha must be a full source SHA"
          exit 1
        fi
        CHECKED_OUT_SHA=$(git rev-parse HEAD)
        if [ "$CHECKED_OUT_SHA" != "$EXPECTED_SHA" ]; then
          echo "::error::Checked out $CHECKED_OUT_SHA instead of requested source $EXPECTED_SHA"
          exit 1
        fi
        echo "commit_sha=$CHECKED_OUT_SHA" >> "$GITHUB_OUTPUT"
    - name: Set up Node and pnpm
      uses: ./.github/actions/setup-node-pnpm
    - name: Require a private OTA package before publication
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: pnpm tsx scripts/check-ota-image-visibility.ts
    - name: Check out official xprem 3.2.7
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: mercuretechnologies/xprem
        ref: 071f6d907527d7de1ba21dd0be23a6ba669a2b1c
        path: .ota-upstream
        persist-credentials: false
    - name: Apply tested server corrections
      working-directory: .ota-upstream
      shell: bash
      run: git apply ../deploy/ota/upstream.patch
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
    - name: Sign in to private GHCR
      if: inputs.publish == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Resolve image name
      id: image
      shell: bash
      env:
        REPOSITORY: ${{ github.repository }}
      run: echo "name=ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')-ota-internal" >> "$GITHUB_OUTPUT"
    - name: Run upstream and HTTP regression tests
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .ota-upstream
        file: deploy/ota/Dockerfile
        target: test
        platforms: linux/arm64
        push: false
    - name: Build runtime image
      id: runtime
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .ota-upstream
        file: deploy/ota/Dockerfile
        platforms: linux/arm64
        push: ${{ inputs.publish == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        tags: ${{ steps.image.outputs.name }}:sha-${{ steps.source.outputs.commit_sha }}
    - name: Verify published image remains private
      if: inputs.publish == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: pnpm tsx scripts/check-ota-image-visibility.ts
    - name: Record immutable image
      if: inputs.publish == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      shell: bash
      env:
        IMAGE: ${{ steps.image.outputs.name }}
        DIGEST: ${{ steps.runtime.outputs.digest }}
      run: echo "Private OTA image — $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
