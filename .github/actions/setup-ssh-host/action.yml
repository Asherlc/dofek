name: Setup SSH Host
description: Install a private key and trust a host in known_hosts
inputs:
  host:
    description: SSH host to trust
    required: true
  private_key:
    description: Private SSH key content
    required: true
  fail_on_error:
    description: Whether to fail when the host key cannot be fetched
    required: false
    default: "true"
outputs:
  ready:
    description: Whether the host key was fetched
    value: ${{ steps.setup.outputs.ready }}
  error_message:
    description: Host key fetch failure message
    value: ${{ steps.setup.outputs.error_message }}
runs:
  using: composite
  steps:
    - name: Setup SSH key and known_hosts
      id: setup
      shell: bash
      env:
        FAIL_ON_ERROR: ${{ inputs.fail_on_error }}
        SSH_HOST: ${{ inputs.host }}
        SSH_PRIVATE_KEY: ${{ inputs.private_key }}
      run: |
        set -euo pipefail

        mkdir -p ~/.ssh
        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519

        attempts=24
        keyscan_timeout=5
        sleep_between=5
        keyscan_stderr="$(mktemp)"
        trap 'rm -f "$keyscan_stderr"' EXIT

        for attempt in $(seq 1 "$attempts"); do
          known_hosts_entry="$(ssh-keyscan -T "$keyscan_timeout" -H "$SSH_HOST" 2>"$keyscan_stderr" || true)"
          if [ -n "$known_hosts_entry" ]; then
            printf '%s\n' "$known_hosts_entry" >> ~/.ssh/known_hosts
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Attempt ${attempt}/${attempts}: ssh-keyscan returned no key for $SSH_HOST"
          if [ -s "$keyscan_stderr" ]; then
            sed 's/^/  keyscan: /' "$keyscan_stderr"
          fi
          if timeout "$keyscan_timeout" bash -c "exec 3<>/dev/tcp/$SSH_HOST/22" 2>/dev/null; then
            echo "  tcp/22: reachable (no SSH banner yet)"
          else
            echo "  tcp/22: not reachable"
          fi
          if [ "$attempt" -eq "$attempts" ]; then
            total_seconds=$((attempts * keyscan_timeout + (attempts - 1) * sleep_between))
            message="SSH host key for $SSH_HOST did not become available within ${total_seconds}s"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "error_message=$message" >> "$GITHUB_OUTPUT"
            if [ "$FAIL_ON_ERROR" = "true" ]; then
              echo "::error::$message"
              exit 1
            fi
            echo "::warning::$message"
            exit 0
          fi
          sleep "$sleep_between"
        done
