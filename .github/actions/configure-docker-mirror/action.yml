name: Configure Docker registry mirror
description: >-
  Point the host Docker daemon at the mirror.gcr.io pull-through cache so that
  daemon-level image pulls (buildx's buildkit bootstrap image, service/stack
  containers, base images) don't depend on registry-1.docker.io, which has
  proven flaky. The buildkitd config-inline mirror only covers buildkit's own
  pulls, not the daemon's, so this must be set on the daemon directly.
runs:
  using: composite
  steps:
    - name: Point Docker daemon at mirror.gcr.io
      shell: bash
      run: |
        sudo mkdir -p /etc/docker
        echo '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
        sudo systemctl restart docker
        # Wait for the daemon to come back up after the restart.
        for _ in $(seq 1 30); do
          if docker info >/dev/null 2>&1; then
            echo "Docker daemon is up with registry mirror configured"
            exit 0
          fi
          sleep 1
        done
        echo "::error::Docker daemon did not come back up after configuring the registry mirror"
        exit 1
