name: Setup Node + pnpm
description: Install pnpm, Node 26, and project dependencies

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v4
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4
      with:
        node-version: 26
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
      env:
        CYPRESS_INSTALL_BINARY: "0"
