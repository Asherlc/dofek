version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "uv"
    directories:
      - "/analytics"
      - "/packages/ml"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "swift"
    directories:
      - "/packages/ble-probe"
      - "/packages/mobile/modules/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/packages/ml"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "vcpkg"
    directory: "/native/fit-decoder"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "redpandadata/connect"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
