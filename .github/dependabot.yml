version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "react-native-svg"
        versions: [">=15.15.5"]
  - package-ecosystem: "uv"
    directories:
      - "/analytics"
      - "/packages/ml"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "swift"
    directories:
      - "/packages/ble-probe"
      - "/packages/mobile/modules/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "python"
        versions: [">=3.14"]
  - package-ecosystem: "docker"
    directory: "/packages/ml"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "vcpkg"
    directory: "/native/fit-decoder"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "redpandadata/connect"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
