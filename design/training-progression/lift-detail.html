<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lift Detail · Dofek</title>
  <link rel="stylesheet" href="artboard.css">
  <link rel="stylesheet" href="tweaks.css">
</head>
<body id="dofek-progression-board">
  <article class="phone" aria-label="Squat lift detail">
    <header data-dc-id="screen-header" class="topbar"><strong>Training</strong><span>Strength · Exercise detail</span></header>
    <main class="body">
      <div data-dc-id="screen-intro" class="intro"><h2 data-dc-id="screen-title">Barbell squat</h2><p data-dc-id="screen-context" class="sub">Goal · Get stronger</p></div>
      <div data-dc-id="strength-trend" class="plot" role="img" aria-label="Estimated max across six comparable sessions ranged from 119 to 121 kilograms between October 17 and November 21">
        <p data-dc-id="effort-response" class="plot-caption">Estimated max · 6 weeks</p>
        <div class="plot-area" aria-hidden="true">
          <div class="plot-y"><span>125 kg</span><span>120</span><span>115</span></div>
          <div data-dc-id="effort-options" class="plot-points"><div class="plot-point" style="--level:50%"></div><div data-dc-id="effort-easier" class="plot-point" style="--level:40%"></div><div class="plot-point" style="--level:50%"></div><div data-dc-id="effort-harder" class="plot-point" style="--level:60%"></div><div class="plot-point" style="--level:50%"></div><div data-dc-id="effort-same" class="plot-point" style="--level:50%"></div></div>
        </div>
        <div class="plot-dates" aria-hidden="true"><span>Oct 17</span><span>Nov 21</span></div>
      </div>
      <div data-dc-id="recommendation" class="insight">
        <p data-dc-id="recommendation-status" class="flag caution">Stagnating</p>
        <h3 data-dc-id="recommendation-title">Squat strength has leveled off</h3>
        <p data-dc-id="recommendation-reason" class="copy">Your estimated one-rep max stayed between 119 and 121 kg across six comparable sessions.</p>
      </div>
    </main>
    <footer data-dc-id="screen-nav" class="foot" aria-label="App sections"><span>Today</span><strong>Training</strong><span>History</span></footer>
  </article>
</body>
</html>
