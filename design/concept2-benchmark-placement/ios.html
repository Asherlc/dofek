<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concept2 benchmark · iOS activity detail</title>
  <link rel="stylesheet" href="activity-detail.css">
</head>
<body class="ios">
  <main class="activity" data-dc-id="activity-detail">
    <p class="back-label" data-dc-id="back-label"><span aria-hidden="true">‹</span> Activities</p>
    <header class="activity-header" data-dc-id="activity-header">
      <h1 data-dc-id="activity-title">2,000 m RowErg</h1>
      <p class="activity-meta">Mar 21, 2026 at 9:12 AM · Concept2</p>
    </header>
    <nav class="screen-sections" aria-label="Activity sections" data-dc-id="activity-sections">
      <span aria-current="page">Overview</span>
      <span>Performance</span>
    </nav>
    <h2 class="stats-title" data-dc-id="stats-title">Key stats</h2>
    <dl class="stats" data-dc-id="activity-stats">
      <div data-dc-id="recorded-time"><dt>Duration</dt><dd>7:10.0</dd></div>
      <div data-dc-id="recorded-distance"><dt>Distance</dt><dd>2,000 m</dd></div>
    </dl>
    <section class="benchmark" aria-labelledby="benchmark-title" data-dc-id="benchmark">
      <div class="comparison">
        <h2 id="benchmark-title" data-dc-id="benchmark-title">Concept2 benchmark</h2>
        <p class="result" data-dc-id="placement">Met the 75th-percentile cutoff</p>
      </div>
      <dl class="cutoff" data-dc-id="cutoff">
        <dt>Published cutoff</dt><dd>7:19.3</dd>
      </dl>
      <div class="evidence" data-dc-id="benchmark-source">
        <p>Submitted Concept2 participants · Non-adaptive division</p>
        <a href="https://log.concept2.com/rankings/2026/rower/2000?rower=rower" target="_blank" rel="noopener noreferrer" data-dc-id="ranking-link">2026 Concept2 rankings <span aria-hidden="true">↗</span></a>
      </div>
    </section>
  </main>
</body>
</html>
