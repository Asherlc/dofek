<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dofek · Home Screen · Sleep recorded</title>
  <link rel="stylesheet" href="widgets.css">
</head>
<body>
  <main class="screen" aria-label="iPhone Home Screen">
    <header class="status" aria-hidden="true"><span>7:42</span><span class="indicators" aria-hidden="true"><span class="reception"></span><span class="battery"></span></span></header>
    <div class="home-grid">
      <div>
        <section class="small-widget" aria-label="Dofek Sleep widget" data-dc-id="home-sleep-widget">
          <p class="small-heading" data-dc-id="widget-heading"><span class="moon" aria-hidden="true"></span>Sleep</p>
          <div>
            <p class="small-duration" data-dc-id="sleep-duration">7 <span class="unit">hr</span> 24 <span class="unit">min</span></p>
            <p class="record-date" data-dc-id="sleep-date">Nov 24</p>
          </div>
        </section>
        <p class="home-label" aria-hidden="true">Dofek</p>
      </div>
      <div class="icon-grid" aria-hidden="true">
        <div class="app-tile"><span class="app-icon slate">◎</span>Camera</div>
        <div class="app-tile"><span class="app-icon pine">↗</span>Maps</div>
        <div class="app-tile"><span class="app-icon olive">✦</span>Photos</div>
        <div class="app-tile"><span class="app-icon plum">♫</span>Music</div>
      </div>
    </div>
    <div class="dock" aria-hidden="true">
      <span class="app-icon pine">╱</span>
      <span class="app-icon slate">◌</span>
      <span class="app-icon olive">✉</span>
      <span class="app-icon plum">⎋</span>
    </div>
    <div class="home-indicator" aria-hidden="true"></div>
  </main>
</body>
</html>
