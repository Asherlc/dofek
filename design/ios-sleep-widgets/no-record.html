<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dofek · No recent sleep</title>
  <link rel="stylesheet" href="widgets.css">
</head>
<body>
  <main class="specimen" aria-label="No recent sleep">
    <div class="state-comparison">
      <div>
        <p class="family-label">Home Screen</p>
        <section class="small-widget" aria-label="Home Screen widget" data-dc-id="home-widget">
          <p class="small-heading"><span class="moon" aria-hidden="true"></span>Sleep</p>
          <p class="small-message" data-dc-id="home-state-message">No recent sleep recorded</p>
        </section>
      </div>
      <div>
        <p class="family-label">Lock Screen</p>
        <div class="accessory-specimen">
          <section class="lock-widget" aria-label="Lock Screen widget after authentication" data-dc-id="lock-widget">
            <span class="moon" aria-hidden="true"></span>
            <div class="lock-data">
              <p class="lock-message" data-dc-id="lock-state-message">No recent sleep recorded</p>
            </div>
          </section>
        </div>
      </div>
    </div>
    <p class="tap-destination" data-dc-id="tap-destination">Tap opens <strong>Sleep</strong></p>
  </main>
</body>
</html>
