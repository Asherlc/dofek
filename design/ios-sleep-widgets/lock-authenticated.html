<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dofek · Lock Screen · Authenticated</title>
  <link rel="stylesheet" href="widgets.css">
</head>
<body>
  <main class="screen lock-screen" aria-label="Authenticated Lock Screen">
    <header class="status" aria-hidden="true"><span></span><span class="indicators" aria-hidden="true"><span class="reception"></span><span class="battery"></span></span></header>
    <div class="lock-heading" aria-hidden="true">
      <span class="padlock open"></span>
      <p class="lock-date">Tuesday, November 24</p>
      <p class="lock-time">7:42</p>
    </div>
    <section class="lock-widget lock-screen-widget" aria-label="Dofek Sleep widget" data-dc-id="lock-sleep-widget">
      <span class="moon" aria-hidden="true"></span>
      <div class="lock-data">
        <p class="lock-record-date" data-dc-id="sleep-date">Sleep · Nov 24</p>
        <p class="lock-duration" data-dc-id="sleep-duration">7 hr 24 min</p>
      </div>
    </section>
    <div class="home-indicator" aria-hidden="true"></div>
  </main>
</body>
</html>
