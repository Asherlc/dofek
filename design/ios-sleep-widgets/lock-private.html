<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dofek · Lock Screen · Locked</title>
  <link rel="stylesheet" href="widgets.css">
</head>
<body>
  <main class="screen lock-screen" aria-label="Locked iPhone">
    <header class="status" aria-hidden="true"><span></span><span class="indicators" aria-hidden="true"><span class="reception"></span><span class="battery"></span></span></header>
    <div class="lock-heading" aria-hidden="true">
      <span class="padlock"></span>
      <p class="lock-date">Tuesday, November 24</p>
      <p class="lock-time">7:42</p>
    </div>
    <section class="lock-widget lock-screen-widget" aria-label="Dofek widget. Content hidden while locked." data-dc-id="privacy-placeholder">
      <span class="skeleton-icon" aria-hidden="true"></span>
      <div aria-hidden="true">
        <span class="skeleton"></span>
        <span class="skeleton long"></span>
      </div>
    </section>
    <div class="home-indicator" aria-hidden="true"></div>
  </main>
</body>
</html>
